name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # 构建时区统一（IA-3 / D0-3）：GitHub Actions 构建机默认 UTC，而 Hexo 的 permalink
    # 用构建机系统时区格式化日期，导致与本地（Asia/Shanghai）产出的文章 URL 日期漂移
    # （线上 /04/23 vs 本地 /04/24）。Vercel 侧须在项目环境变量设 TZ=Asia/Shanghai，
    # 说明见 ENVIRONMENT.md「构建时区」一节。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 package.json engines（24.x）和 Vercel 生产构建对齐（E-112 同族）。
          # 注意：这不是 verify 变红的原因——那次红是步骤顺序问题，见 E-133。
          node-version: 24
          cache: npm
      - run: npm ci
      # 0. 构建环境门禁：engines 主版本 = 当前 Node = ci.yml 的 node-version（E-112）
      - name: Build env
        run: npm run test:env
      # 1. 语法门禁：api 全部子目录 + 后台前端 + 测试脚本（issue #11）
      #    用 find api 递归，避免内容域再拆一层子目录时又漏检；
      #    test/build-env.js 会动态枚举 api/**/*.js 反向校验本步骤的覆盖方式。
      - name: Syntax check
        run: |
          set -euo pipefail
          for f in source/admin/*.js test/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find api -type f -name '*.js' -print0)
          [ "$count" -gt 0 ] || { echo "api/ 下没有 .js，语法门禁空转"; exit 1; }
          echo "syntax ok"
      # 1.5 依赖声明断言（E-132）：src / tools / test 引用的外部包必须写进 package.json，
      #     且 lock 里必须有对应条目——本地残留 node_modules 会让这条永远绿，CI 的 npm ci 不会。
      - name: Dependency declarations
        run: npm run test:deps
      # 2. 后台服务端冒烟（mock 模式，零依赖零密钥）
      - name: Admin smoke
        run: npm run test:admin
      # 3. 前台构建门禁。必须排在 test:pages 之前：该测试第 [10] 组断言直接读
      #    真实 dist/index.html（E-133：顺序颠倒时 CI 必红，而本地 npm test 先构建，不复现）。
      - name: Astro build
        run: npm run build
      # 4. 前台模块页端到端（后台写入链路 → YAML 落盘 → Astro 生成 → HTML 断言；结束后自动还原数据文件）
      - name: Module pages E2E
        run: npm run test:pages
      # 4.5 断图断言（E-186 / issue #26）。必须排在 Astro build 之后：断言读的是
      #     dist/**/*.html 里的 src/srcset。此前只挂在本地 npm test 上，CI 逐项写死
      #     套件、不跑 npm test，于是「删图不改引用」照样全绿上线。
      - name: Image refs
        run: npm run test:img
      # 4.6 文章页导语（blurb）渲染（issue #21 / E-191）。同样必须排在 Astro build 之后：
      #     断言读 dist/<permalink>/index.html 的页头。模板曾读不存在的 post.data，
      #     条件恒假、导语静默不显示，而构建与既有套件全绿。
      - name: Post blurb
        run: npm run test:blurb
      # 4.7 车牌字母编号页（/plates/，Issue #12）。排在 Astro build 之后：断言读
      #     dist/plates/index.html 的字母带、对照表行数与脚本 hash。
      - name: Plates E2E
        run: npm run test:plates
      # 4.8–4.14 以下七套全部读 dist/（页面产物 + 数据文件），必须排在 Astro build 之后。
      #     它们此前只挂在本地 npm test 链上：CI 逐项列举套件、不跑 npm test，
      #     所以「本地全绿、push 后无人校验」的空档一直存在（E-189 同族）。
      #     test/build-env.js 会枚举 package.json 的所有 test:* 脚本反查本文件，
      #     漏接一套即判红——新增套件必须同时进这两处。
      - name: Home contract
        run: npm run test:home
      - name: Page forms
        run: npm run test:form
      - name: Asset versions
        run: npm run test:assets
      - name: Module dates
        run: npm run test:dates
      - name: Holidays E2E
        run: npm run test:holidays
      - name: Zodiac E2E
        run: npm run test:zodiac
      - name: City rank E2E
        run: npm run test:cityrank
      - name: Search index
        run: npm run test:search
      # 5. 前台/后台 CSS token 一致性（防止 --accent 两处漂移）
      - name: CSS tokens
        run: npm run test:tokens
      # 6. 账本引用可核对性（防止凭空引用 PRD 条款，见 E-015）
      - name: Doc claims
        run: npm run test:claims
      # 7. 文章发布器 Markdown⇄块 往返幂等性（见 E-017）
      - name: Composer blocks roundtrip
        run: npm run test:blocks
      # 8. 旧分类重定向完整性（issue #22 / E-188）：分类收敛删掉旧 URL 时，
      #    vercel.json 的 redirects 无人校验，线上旧入口静默 404。
      - name: Legacy redirects
        run: npm run test:redirects
