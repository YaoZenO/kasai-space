name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # 构建时区统一（IA-3 / D0-3）：GitHub Actions 构建机默认 UTC，而 Hexo 的 permalink
    # 用构建机系统时区格式化日期，导致与本地（Asia/Shanghai）产出的文章 URL 日期漂移
    # （线上 /04/23 vs 本地 /04/24）。Vercel 侧须在项目环境变量设 TZ=Asia/Shanghai，
    # 说明见 ENVIRONMENT.md「构建时区」一节。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 package.json engines（24.x）和 Vercel 生产构建对齐（E-112 同族）。
          # 注意：这不是 verify 变红的原因——那次红是步骤顺序问题，见 E-133。
          node-version: 24
          cache: npm
      - run: npm ci
      # 0. 构建环境门禁：engines 主版本 = 当前 Node = ci.yml 的 node-version（E-112）
      - name: Build env
        run: npm run test:env
      # 1. 语法门禁：api 全部子目录 + 后台前端 + 测试脚本（issue #11）
      #    用 find api 递归，避免内容域再拆一层子目录时又漏检；
      #    test/build-env.js 会动态枚举 api/**/*.js 反向校验本步骤的覆盖方式。
      - name: Syntax check
        run: |
          set -euo pipefail
          for f in source/admin/*.js test/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find api -type f -name '*.js' -print0)
          [ "$count" -gt 0 ] || { echo "api/ 下没有 .js，语法门禁空转"; exit 1; }
          echo "syntax ok"
      # 2. 后台服务端冒烟（mock 模式，零依赖零密钥）
      - name: Admin smoke
        run: npm run test:admin
      # 3. 前台构建门禁。必须排在 test:pages 之前：该测试第 [10] 组断言直接读
      #    真实 dist/index.html（E-133：顺序颠倒时 CI 必红，而本地 npm test 先构建，不复现）。
      - name: Astro build
        run: npm run build
      # 4. 前台模块页端到端（后台写入链路 → YAML 落盘 → Astro 生成 → HTML 断言；结束后自动还原数据文件）
      - name: Module pages E2E
        run: npm run test:pages
      # 5. 前台/后台 CSS token 一致性（防止 --accent 两处漂移）
      - name: CSS tokens
        run: npm run test:tokens
      # 6. 账本引用可核对性（防止凭空引用 PRD 条款，见 E-015）
      - name: Doc claims
        run: npm run test:claims
      # 7. 文章发布器 Markdown⇄块 往返幂等性（见 E-017）
      - name: Composer blocks roundtrip
        run: npm run test:blocks
