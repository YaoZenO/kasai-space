name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # 构建时区统一（IA-3 / D0-3）：GitHub Actions 构建机默认 UTC，而 Hexo 的 permalink
    # 用构建机系统时区格式化日期，导致与本地（Asia/Shanghai）产出的文章 URL 日期漂移
    # （线上 /04/23 vs 本地 /04/24）。Vercel 侧须在项目环境变量设 TZ=Asia/Shanghai，
    # 说明见 ENVIRONMENT.md「构建时区」一节。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 1. 语法门禁：api 函数 + 后台前端 + 测试脚本
      - name: Syntax check
        run: |
          for f in api/*.js api/_lib/*.js source/admin/admin.js test/*.js; do
            node --check "$f" || exit 1
          done
          echo "syntax ok"
      # 2. 后台服务端冒烟（mock 模式，零依赖零密钥）
      - name: Admin smoke
        run: npm run test:admin
      # 3. 前台模块页端到端（后台写入链路 → YAML 落盘 → Hexo 生成 → HTML 断言；结束后自动还原数据文件）
      - name: Module pages E2E
        run: npm run test:pages
      # 3.5 前台/后台 CSS token 一致性（防止 --accent 两处漂移）
      - name: CSS tokens
        run: npm run test:tokens
      # 3.6 账本引用可核对性（防止凭空引用 PRD 条款，见 E-015）
      - name: Doc claims
        run: npm run test:claims
      # 3.7 文章发布器 Markdown⇄块 往返幂等性（见 E-017）
      - name: Composer blocks roundtrip
        run: npm run test:blocks
      # 4. 前台构建门禁
      - name: Hexo generate
        run: npm run build
