<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>管理后台 · KASAI'S Blog</title>
<!-- ASSET_V：后台静态资源缓存破坏版本号。改动 source/admin/ 下任何前端文件后，
     必须同步 bump 此处与 admin.js 动态 import 的 ?v=（由 test/admin-smoke.js 断言两处一致），
     否则浏览器会继续用本地缓存的旧副本，表现为「改了线上看不到」（2026-10-15 实际发生过）。 -->
<link rel="stylesheet" href="/admin/admin.css?v=20261021">
</head>
<body>

<!-- 登录视图 -->
<section id="view-login" class="view" hidden>
  <div class="login-box">
    <p class="login-brand">KASAI'S Blog</p>
    <h1>管理后台</h1>
    <p class="login-hint">使用 GitHub 账号登录，仅站点管理员可用。</p>
    <button id="btn-login" class="btn btn-primary btn-block">使用 GitHub 登录</button>
    <p id="login-error" class="login-error" hidden></p>
  </div>
</section>

<!-- 主视图 -->
<section id="view-app" class="view" hidden>
  <header class="topbar">
    <div class="topbar-title">
      <span id="whoami" class="whoami"></span>
      <span id="deploy-pill" class="pill" hidden></span>
    </div>
    <a id="btn-logout" class="topbar-action" href="/api/auth-logout">退出</a>
  </header>

  <main id="main" class="main">
    <!-- 列表视图（文章/项目/游戏/收藏/回收站 共用骨架由 JS 渲染） -->
    <div id="view-list"></div>

    <!-- 文章编辑器 -->
    <div id="view-post-editor" hidden>
      <div class="editor-head">
        <button class="btn-back" data-back>← 返回</button>
        <span id="post-permalink" class="permalink-hint"></span>
      </div>
      <label class="field"><span>标题</span><input id="post-title" type="text" autocomplete="off"></label>
      <div class="field-row">
        <label class="field"><span>Slug（永久链接，发布后锁定）</span><input id="post-slug" type="text" autocomplete="off" spellcheck="false"></label>
      </div>
      <div class="field-row two">
        <label class="field"><span>标签（逗号分隔）</span><input id="post-tags" type="text" autocomplete="off"></label>
        <label class="field"><span>分类</span><input id="post-categories" type="text" autocomplete="off"></label>
      </div>
      <div class="field-row two">
        <label class="field"><span>封面图片路径（可空；可双击从图库选择）</span><input id="post-cover" type="text" autocomplete="off" spellcheck="false" placeholder="/img/posts/xxx.jpg"></label>
        <label class="field field-check"><span>设为首页 FEATURED 代表作</span><input id="post-featured" type="checkbox"></label>
      </div>
      <div class="editor-toolbar">
        <button class="btn btn-mini" id="btn-toggle-preview" type="button">预览</button>
        <span id="post-wordcount" class="wordcount"></span>
      </div>
      <div id="post-composer" class="cps"></div>
      <div id="post-preview" class="post-preview markdown-body" hidden></div>
      <div class="editor-actions">
        <button class="btn" id="btn-save-draft" type="button">保存草稿</button>
        <button class="btn btn-primary" id="btn-publish" type="button">发布</button>
        <!-- 删除是破坏性操作：danger 样式 + aria-label 说明后果（可恢复、去哪恢复）。
             2026-10-18 之前它只是三个按钮里最右的一个普通按钮，主人实测「找不到删除文章的地方」。 -->
        <button class="btn btn-danger" id="btn-delete-post" type="button"
                aria-label="删除当前文章，文件会移入回收站，可恢复">删除</button>
      </div>
    </div>

    <!-- 数据条目编辑器：按模块切换不同表单（项目富文本 / 游戏专属 / 收藏简洁） -->
    <div id="view-data-editor" hidden>
      <div class="editor-head">
        <button class="btn-back" data-back>← 返回</button>
        <span id="item-module-badge" class="permalink-hint"></span>
      </div>

      <!-- 项目表单：长篇图文 -->
      <div class="item-form" data-form="projects">
        <div class="field-row two">
          <label class="field"><span>项目名称（必填）</span><input id="item-title" type="text" autocomplete="off"></label>
          <label class="field"><span>Slug（详情页地址 /projects/xxx/，可空）</span><input id="item-slug" type="text" autocomplete="off" spellcheck="false"></label>
        </div>
        <label class="field">
          <span>封面图片（可空）</span>
          <div class="field-inline">
            <input id="item-cover" type="text" autocomplete="off" spellcheck="false" placeholder="/img/projects/xxx.jpg">
            <button class="btn btn-mini" id="btn-item-cover-pick" type="button">图库选择</button>
            <button class="btn btn-mini btn-primary-quiet" id="btn-item-cover-upload" type="button">上传封面</button>
          </div>
          <small class="field-hint">上传后存入 /img/projects/，建议 16:9 横图。</small>
        </label>
        <div class="field-row two">
          <label class="field"><span>日期（可空）</span><input id="item-date" type="text" autocomplete="off" placeholder="2026-05-01"></label>
          <label class="field"><span>标签（逗号分隔，可空）</span><input id="item-tags" type="text" autocomplete="off" placeholder="Hexo, Node.js"></label>
        </div>
        <label class="field"><span>仓库 / 演示 / 相关文章链接（可空）</span><input id="item-link" type="text" autocomplete="off" spellcheck="false" placeholder="https://github.com/YaoZenO/xxx"></label>
        <label class="field"><span>一句话简介（列表与详情页摘要，可空）</span><input id="item-summary" type="text" autocomplete="off"></label>
        <div class="rich-block">
          <div class="rich-head"><span class="rich-title">项目背景</span><span class="rich-hint">Markdown 长文，详情页展示</span></div>
          <div class="editor-toolbar">
            <button class="btn btn-mini" id="btn-insert-bg" type="button">插图</button>
            <span class="wordcount" data-wc="item-bg"></span>
          </div>
          <textarea id="item-bg" class="post-body" spellcheck="false" placeholder="为什么做这个项目…"></textarea>
        </div>
        <div class="rich-block">
          <div class="rich-head"><span class="rich-title">实现过程</span><span class="rich-hint">Markdown 长文</span></div>
          <div class="editor-toolbar">
            <button class="btn btn-mini" id="btn-insert-process" type="button">插图</button>
            <span class="wordcount" data-wc="item-process"></span>
          </div>
          <textarea id="item-process" class="post-body" spellcheck="false" placeholder="怎么做出来的…"></textarea>
        </div>
        <div class="rich-block">
          <div class="rich-head"><span class="rich-title">技术方案</span><span class="rich-hint">Markdown 长文</span></div>
          <div class="editor-toolbar">
            <button class="btn btn-mini" id="btn-insert-tech" type="button">插图</button>
            <span class="wordcount" data-wc="item-tech"></span>
          </div>
          <textarea id="item-tech" class="post-body" spellcheck="false" placeholder="架构、选型、取舍…"></textarea>
        </div>
        <div class="rich-block">
          <div class="rich-head"><span class="rich-title">成果</span><span class="rich-hint">Markdown 长文</span></div>
          <div class="editor-toolbar">
            <button class="btn btn-mini" id="btn-insert-outcome" type="button">插图</button>
            <span class="wordcount" data-wc="item-outcome"></span>
          </div>
          <textarea id="item-outcome" class="post-body" spellcheck="false" placeholder="数据、影响、后续…"></textarea>
        </div>
        <div class="editor-actions">
          <button class="btn btn-primary btn-save-item" type="button">保存项目</button>
        </div>
      </div>

      <!-- 游戏表单：专属字段 + 媒体区 + 链接对 -->
      <div class="item-form" data-form="games">
        <div class="field-row two">
          <label class="field"><span>游戏名称（必填）</span><input id="game-title" type="text" autocomplete="off"></label>
          <label class="field"><span>Slug（详情页地址 /games/xxx/，可空）</span><input id="game-slug" type="text" autocomplete="off" spellcheck="false"></label>
        </div>
        <label class="field">
          <span>封面图（可空）</span>
          <div class="field-inline">
            <input id="game-cover" type="text" autocomplete="off" spellcheck="false" placeholder="/img/games/xxx.jpg">
            <button class="btn btn-mini" id="btn-game-cover-pick" type="button">图库选择</button>
            <button class="btn btn-mini btn-primary-quiet" id="btn-game-cover-upload" type="button">上传封面</button>
          </div>
        </label>
        <div class="field-row three">
          <label class="field"><span>游戏分类</span><input id="game-genre" type="text" autocomplete="off" placeholder="角色扮演 / 策略 / 独立"></label>
          <label class="field"><span>平台（可空）</span><input id="game-platform" type="text" autocomplete="off" placeholder="PC / Switch"></label>
          <label class="field"><span>状态（可空）</span><input id="game-status" type="text" autocomplete="off" placeholder="在玩 / 通关 / 搁置"></label>
        </div>
        <label class="field"><span>一句话简介（可空）</span><input id="game-summary" type="text" autocomplete="off"></label>
        <div class="rich-block">
          <div class="rich-head"><span class="rich-title">玩法介绍</span><span class="rich-hint">Markdown 长文</span></div>
          <div class="editor-toolbar">
            <button class="btn btn-mini" id="btn-insert-gameplay" type="button">插图</button>
            <span class="wordcount" data-wc="game-gameplay"></span>
          </div>
          <textarea id="game-gameplay" class="post-body" spellcheck="false" placeholder="核心玩法、系统、体验…"></textarea>
        </div>
        <div class="rich-block">
          <div class="rich-head"><span class="rich-title">截图 / 视频</span><span class="rich-hint">本模块独立媒体区，直传 /img/games/</span></div>
          <div class="media-zone" id="game-media-zone">
            <button class="btn btn-primary-quiet" id="btn-game-media-upload" type="button">＋ 上传截图</button>
            <div class="media-list" id="game-media-list"></div>
          </div>
          <label class="field" style="margin-top:.6rem"><span>视频链接（B 站 / YouTube，可空）</span><input id="game-video" type="text" autocomplete="off" spellcheck="false" placeholder="https://b23.tv/xxxx"></label>
        </div>
        <div class="rich-block">
          <div class="rich-head"><span class="rich-title">下载 / 试玩链接</span><span class="rich-hint">名称 + 地址成对添加</span></div>
          <div class="link-rows" id="game-link-rows"></div>
          <button class="btn btn-mini" id="btn-game-link-add" type="button">＋ 添加链接</button>
        </div>
        <div class="field-row two">
          <label class="field"><span>日期（可空）</span><input id="game-date" type="text" autocomplete="off" placeholder="2026-05-01"></label>
        </div>
        <div class="editor-actions">
          <button class="btn btn-primary btn-save-item" type="button">保存游戏</button>
        </div>
      </div>

      <!-- 收藏表单：简洁（原有结构） -->
      <div class="item-form" data-form="collections">
        <label class="field"><span>名称（必填）</span><input id="coll-title" type="text" autocomplete="off"></label>
        <label class="field"><span>链接（http(s):// 或站内路径，可空）</span><input id="coll-link" type="text" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>一句话说明（可空）</span><input id="coll-desc" type="text" autocomplete="off"></label>
        <label class="field">
          <span>封面图片路径（可空）</span>
          <div class="field-inline">
            <input id="coll-cover" type="text" autocomplete="off" spellcheck="false" placeholder="/img/collections/xxx.jpg">
            <button class="btn btn-mini" id="btn-coll-cover-pick" type="button">图库选择</button>
            <button class="btn btn-mini btn-primary-quiet" id="btn-coll-cover-upload" type="button">上传封面</button>
          </div>
        </label>
        <label class="field"><span>日期（参与首页近期动态，如 2026-05-01，可空）</span><input id="coll-date" type="text" autocomplete="off" placeholder="2026-05-01"></label>
        <div class="editor-actions">
          <button class="btn btn-primary btn-save-item" type="button">保存</button>
        </div>
      </div>
    </div>

    <!-- 站点身份设置 -->
    <div id="view-site-editor" hidden>
      <div class="editor-head">
        <button class="btn-back" data-back>← 返回</button>
        <span id="site-hint" class="permalink-hint">保存后自动提交，部署完成后首页生效</span>
      </div>
      <label class="field"><span>一句话介绍（首页身份域 tagline）</span><input id="site-intro" type="text" autocomplete="off" placeholder="如：写作 / 归档 / 痕迹"></label>
      <label class="field"><span>页脚座右铭（可空，空则显示 SINCE 年份）</span><input id="site-motto" type="text" autocomplete="off"></label>
      <label class="field">
        <span>头像图片路径（可空，空则用主题配置）</span>
        <div class="field-inline">
          <input id="site-avatar" type="text" autocomplete="off" spellcheck="false" placeholder="/img/avatar/xxx.jpg">
          <button class="btn btn-mini btn-primary-quiet" id="btn-site-avatar-upload" type="button">上传头像</button>
        </div>
      </label>
      <label class="field"><span>身份词竖列（每行一个，如：WRITER / DEVELOPER；空则不渲染）</span><textarea id="site-identity" class="post-body small" rows="5" spellcheck="false" placeholder="WRITER&#10;DEVELOPER"></textarea></label>
      <div class="editor-actions">
        <button class="btn btn-primary" id="btn-save-site" type="button">保存设置</button>
      </div>
    </div>
  </main>

  <!-- 底部标签导航（手机优先：图标 + 大点按区） -->
  <nav class="tabbar" id="tabbar" aria-label="管理导航">
    <button data-tab="posts" class="tab active"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5"/><path d="M9 13h6M9 16.5h6"/></svg></span><span class="tab-txt">文章</span></button>
    <button data-tab="projects" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></span><span class="tab-txt">项目</span></button>
    <button data-tab="games" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8h10a4.5 4.5 0 0 1 4.4 5.4l-.8 3.8a2.6 2.6 0 0 1-4.5 1.1L14.5 16h-5l-1.6 2.3a2.6 2.6 0 0 1-4.5-1.1l-.8-3.8A4.5 4.5 0 0 1 7 8z"/><path d="M8.5 11v3M7 12.5h3"/><circle cx="16" cy="11.5" r=".9" fill="currentColor" stroke="none"/><circle cx="18.2" cy="13.7" r=".9" fill="currentColor" stroke="none"/></svg></span><span class="tab-txt">游戏</span></button>
    <button data-tab="collections" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-9-9c-1.3-3 .8-6.5 4-6.5 2 0 3.6 1.2 5 3 1.4-1.8 3-3 5-3 3.2 0 5.3 3.5 4 6.5-2 4.5-9 9-9 9z"/></svg></span><span class="tab-txt">收藏</span></button>
    <button data-tab="images" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 17l5-5 3.5 3.5 3-3 4.5 4.5"/></svg></span><span class="tab-txt">图片</span></button>
    <button data-tab="site" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M18 6l-1.6 1.6M7.6 16.4L6 18"/></svg></span><span class="tab-txt">设置</span></button>
    <button data-tab="trash" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10.5 11v5M13.5 11v5"/></svg></span><span class="tab-txt">回收站</span></button>
  </nav>
</section>

  <!-- 快捷入口「发一条」（2026-10-19，先③再① 的③）：浮动按钮 + 菜单。
       菜单项只负责切 tab 并打开对应新建表单，保存逻辑仍走各编辑器既有路径。 -->
  <button class="fab" id="fab-compose" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="fab-menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span class="fab-txt">发一条</span>
  </button>
  <div class="fab-menu" id="fab-menu" role="menu" aria-label="快捷发布" hidden></div>

<!-- 图片选择器 -->
<div id="modal-picker" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><strong>选择图片</strong><button class="modal-close" data-close-modal>×</button></div>
    <div id="picker-grid" class="picker-grid"></div>
    <p class="modal-hint">没有合适的图片？先到「图片」页上传。</p>
  </div>
</div>

<!-- 确认弹窗 -->
<div id="modal-confirm" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><strong id="confirm-title">确认</strong></div>
    <p id="confirm-text" class="confirm-text"></p>
    <div class="modal-actions">
      <button class="btn" id="confirm-cancel">取消</button>
      <button class="btn btn-danger" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<!-- 冲突弹窗 -->
<div id="modal-conflict" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><strong>内容冲突</strong></div>
    <p class="confirm-text">服务器上的内容已被其他操作修改。你可以加载最新版本，或用当前编辑内容强制覆盖。</p>
    <div class="modal-actions">
      <button class="btn" id="conflict-reload">加载服务器版本</button>
      <button class="btn btn-danger" id="conflict-overwrite">强制覆盖</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<!-- ES module：admin-core / admin-list 静态加载；编辑器等重模块在登录成功后动态 import，
     登录页不会下载这部分代码（P2-2） -->
<script type="module" src="/admin/admin.js?v=20261021"></script>
</body>
</html>
