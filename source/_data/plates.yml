# 车牌字母编号探索 —— /plates/ 页面的唯一数据源
#
# 事实来源（唯一）：公安部公共安全行业标准 GA 36-2018《中华人民共和国机动车号牌》
# 附录 A（规范性附录）表 A.1「发牌机关代号」，以及正文 5.8「发牌机关代号」条款。
# 现行有效版本 2018-05-01 起实施。
#
# 纪律（与 holidays.yml / zodiac.yml 相同）：
#   1. 只收录标准原文明确写出的事实，不掺入二手百科 / 民间说法（如「闽K 平潭」「新D 奎屯」
#      这类标准表 A.1 里不存在的说法一律不收）；
#   2. 中文长文案一律写单行（E-042）；
#   3. code 是发牌机关代号的英文字母，单个大写字母；place 是标准表 A.1 原列出的登记机关
#      所在地名称（逐字照录，含标准的旧行政区划写法）；
#   4. 同一 code 可对应多地（如宁夏吴忠市、固原市同用 C），同一地可对应多个 code（如
#      哈尔滨市 A、L），allocations 一条 = 一个（code, place）组合，忠实记录，不做归并；
#   5. 直辖市 kind=municipality，发牌机关代号为 A 至 Z 全序列（5.8.2），用 codes: full 表示，
#      不逐字母展开成 26 条 allocations；
#   6. 省公安厅车管所警用专段（O）、广东港澳入出境车（Z）、山东交警总队（W）等特殊代号
#      单独列在 special，不与普通地市分配混排。
#
# 数据完整转录自标准表 A.1；断档（如云南无 B）、共用（如宁夏固原/吴忠同 C）、多字母
# （如佛山 E/X/Y、青岛 B/U）均按标准原样保留，页面据实呈现。

meta:
  updated: "2026-11-26"
  standard: "GA 36-2018《中华人民共和国机动车号牌》"
  standardScope: "发牌机关代号见标准附录 A（规范性附录）表 A.1；启用规则见正文 5.8"
  lede: "路上车牌的第二位英文字母，是「发牌机关代号」。它怎么来的、为什么这么排，标准里其实写得很清楚：省会（首府）固定用 A，其余设区的市报经公安部交通管理局批准后依次启用新字母。本页按标准附录 A 逐条整理各省发牌机关代号与登记机关的对应关系。"
  scopeNote: "本页依据 GA 36-2018 附录 A 表 A.1 整理，覆盖 31 个省级行政区（23 省、5 自治区、4 直辖市）。香港特别行政区、澳门特别行政区、台湾地区实行不同的号牌制度，不在本标准附录 A 的发牌机关代号表范围内，本页不予混排。"

