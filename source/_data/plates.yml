# 特殊发牌机关代号（标准表 A.1 末尾三行及脚注）
special:
  - code: "O"
    meaning: "省、自治区公安厅交通管理局、处车辆管理所"
    note: "用于公安机关行政单位在编机动车等警用专段，各省、自治区通用"
  - code: "Z"
    meaning: "广东省公安厅交通管理局车辆管理所"
    note: "核发的港澳入出境车号牌使用发牌机关代号「Z」"
  - code: "W"
    meaning: "山东省公安厅交通警察总队车辆管理所"
    note: "山东省公安厅交通警察总队车辆管理所的发牌机关代号为「O」和「W」"

# 编号规则说明（依据标准正文 5.8，非推测）
rules:
  - key: "capital-a"
    title: "省会（首府）固定为 A"
    text: "标准表 A.1 中，各省会、首府的发牌机关代号均为 A。"
    source: "GA 36-2018 附录 A 表 A.1"
  - key: "sequential"
    title: "其余代号按批准启用顺序依次分配"
    text: "标准 5.8.3 规定：设区的市或者相当于同级的公安机关交通管理部门，报经公安部交通管理局批准同意后，可启用新的发牌机关代号。即 B、C、D…… 不是按经济、人口、行政级别或地理顺序排，而是按报批启用的先后依次分配。"
    source: "GA 36-2018 5.8.3"
  - key: "municipality-full"
    title: "直辖市用 A 至 Z 全序列"
    text: "标准 5.8.2 规定：直辖市公安机关交通管理部门使用发牌机关代号为 A 至 Z，应按照英文字母顺序依次启用新的发牌机关代号，并在启用前 30 天报公安部交通管理局备案。"
    source: "GA 36-2018 5.8.2"
  - key: "skip-io"
    title: "发牌机关代号不使用 I，O 有专用"
    text: "标准表 A.1 中各省地市代号没有使用 I；O 单独留给省、自治区公安厅车管所警用专段，不作为普通地市代号。序号位（车牌后几位）同样不使用字母 O 和 I（标准 5.9.1）。"
    source: "GA 36-2018 附录 A 表 A.1、5.9.1"
  - key: "multi-letter"
    title: "部分城市或地区对应多个代号"
    text: "机动车保有量增长后，部分登记机关会启用第二个乃至第三个发牌机关代号。标准表 A.1 中，佛山（E、X、Y）、青岛（B、U）、烟台（F、Y）、潍坊（G、V）、哈尔滨（A、L）、福州（A、K）、南昌（A、M）、长沙（A、S）、成都（A、G）、桂林（C、H）、伊犁（D、F）均为多地代号示例。"
    source: "GA 36-2018 附录 A 表 A.1"
  - key: "shared-code"
    title: "少数情况两地共用一个代号"
    text: "标准表 A.1 中，宁夏吴忠市与固原市共用发牌机关代号 C。"
    source: "GA 36-2018 附录 A 表 A.1"
  - key: "gap"
    title: "个别省份存在字母空缺"
    text: "标准表 A.1 中，云南的地市代号从 A 直接到 C，没有 B。此类空缺是标准原文如此，不代表「尚未启用」或「跳号」，本页据实呈现。"
    source: "GA 36-2018 附录 A 表 A.1"
