# V3.1 首页扩展机制 · 游戏模块（专属字段）
# 新增条目：在 items 下按以下字段追加（仅 title 必传，其余可选）
#   slug       详情页地址 /games/<slug>/；缺省由标题编码生成
#   title      游戏名
#   date       日期，如 2026-10-12
#   cover      封面图路径，如 /img/games/xxx.jpg（后台可直传到该目录）
#   genre      游戏分类，如 角色扮演 / 策略 / 独立
#   platform   平台，如 PC / Switch
#   status     状态，如 在玩 / 通关 / 搁置 / 想玩
#   summary    一句话简介
#   gameplay   玩法介绍（Markdown 长文）
#   media      截图路径数组，如 [/img/games/a.jpg, /img/games/b.jpg]
#   video      视频链接（B 站 / YouTube）
#   links      下载 / 试玩链接数组，如 [{label: 下载, url: https://…}]
# items 有内容时自动渲染到首页，并生成 /games/ 列表页与各条目详情页；为空时整段不渲染

items:
  - title: 【测试】游戏模块字段演练
    slug: test-game
    date: 2026-10-15
    cover: /img/default.png
    genre: 测试
    platform: PC
    status: 在玩
    summary: 测试条目：验证游戏专属字段与截图墙渲染，确认后可删除。
    gameplay: |-
      ## 玩法

      玩法介绍：包含 **加粗** 与 [示例链接](https://example.com)。
    media: [/img/default.png, /img/default.png]
    video: "https://www.bilibili.com/video/BV1xx"
    links:
      - label: 下载
        url: "https://example.com/dl"
      - label: 试玩
        url: "https://example.com/play"
