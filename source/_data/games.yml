  - title: 绝地求生
    slug: pubg
    date: 2026-10-18
    cover: /img/games/game-pubg.jpg
    genre: 大逃杀
    platform: PC
    status: 在玩
    summary: 2017 年那会儿入的坑，AFK 过很长一段时间，现在又回来打了。缩圈逼着所有人不断移动的机制还是那么让人紧张。
    gameplay: |-
      ## 为什么又回来玩了

      大逃杀这个类型的开创者，也是我入坑最久的一个。核心乐趣从来不是「吃鸡」，而是那种从落地到决赛圈一直绷着的紧张感——你不知道下一个转角会遇到谁。

      ## 我现在怎么玩

      单排和四排都打，单排居多。第三人称视角更习惯，虽然第一人称更硬核。跳伞落点固定几个熟悉的资源点，不跟风去热门区域凑热闹。

      ## 这个游戏在逼你做什么

      - **不断移动**：蓝圈持续收缩，圈外持续掉血。想苟就得一直换点，苟不久。
      - **装备全靠捡**：没有成长系统，落地一把枪都没有，物资质量完全看运气和搜索效率。
      - **落点即决策**：航线决定资源分布，跳哪里是每局的第一个判断，选错了这一局都很难受。

      ## AFK 和回归

      中间隔了很久没打，回来发现已经免费了，入门门槛低了不少。武器配件、倍镜、背包的取舍逻辑还在，子弹下坠和弹道计算也还是老样子——捡起来的速度比想象中快。

      ## 顺带一提

      衍生版本不少，PUBG Mobile、和平精英各自走移动端路线，但我一直只玩 PC 原版。
    links:
      - label: Steam 商店
        url: "https://store.steampowered.com/app/578080/PUBG_BATTLEGROUNDS/"
      - label: 官方网站
        url: "https://www.pubg.com/"
