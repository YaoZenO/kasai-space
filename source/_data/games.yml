items:
  - title: 英雄联盟
    slug: lol
    date: 2026-10-18
    cover: "/img/games/202610180235-v2-1681ff26afbd5f92aa5790b4dee6a63f-1440.jpg"
    genre: MOBA
    platform: PC
    status: 在玩
    summary: 从 2011 年国服开服玩到现在，中间断过几年，最近又捡回来了。补刀手感和资源判断都还在，就是反应确实不如从前。
    gameplay: |-
      ## 为什么还在玩

      这是一款我反复卸载又反复装回来的游戏。真正留住我的不是某一个模式，而是它对「资源判断」的奖励：同一张地图，同样两个英雄，会因为谁先回家、谁多补了三个兵，在十分钟后走向完全不同的结局。

      ## 我现在怎么玩

      排位打得少了，大多时候在嚎哭深渊（大乱斗）那条单线上消遣——没有对线压力，也不用记打野路线，随时开局随时结束，适合碎片时间。想认真一点的时候才回召唤峡谷打几把。

      上手的英雄很固定，玩得最舒服的还是那几个不吃操作、吃判断的老英雄。新英雄偶尔试试，但很少往排位里带。

      ## 卡在哪

      意识还在，手跟不上。以前能打出来的操作现在做不出来，团战里经常是「看清了但没躲开」。所以现在更多是靠选角和节奏去赢，而不是靠个人发挥。

      ## 顺带一提

      每年秋天的全球总决赛还是会看。自己打得少了，但看比赛的兴致一直没减。
    links:
      - label: 官方网站
        url: "https://lol.qq.com/"

  - title: Counter-Strike 2
    slug: cs2
    date: 2026-10-18
    cover: /img/games/game-counter-strike-2.jpg
    genre: FPS
    platform: PC
    status: 在玩
    summary: 从 CS:GO 一路打过来的老玩家。CS2 上线后饰品原样继承，这点让人省心；烟变成可以被子弹和手雷改变之后，以前的封烟套路得重新学。
    gameplay: |-
      ## 为什么还在玩

      这个系列的乐趣很直接：没有等级压制，没有成长曲线，一局开始所有人都在同一条起跑线上。输赢只取决于枪法、定位和对地图的理解——这种公平感是别的射击游戏很难给到的。

      ## CS:GO 到 CS2 的变化

      - **饰品原样继承**：我原来的库存、皮肤、贴纸全都带过来了，没有推倒重来，这点让我这种老玩家很安心。
      - **烟不再是烟**：烟雾弹的烟可以被子弹穿透、被手雷吹散。以前「封一颗烟就封死一条路」的思路得整个推翻，现在烟本身是个可以操作的变量。
      - **地图重做**：老地图在 Source 2 下重建，光影和贴图都变了，但布局没动，肌肉记忆还能用。

      ## 我现在怎么玩

      休闲 10v10 是常去的地方，不用在意输赢，就当练枪。想认真打的时候才进竞技，5v5 拆弹局，24 回合先拿 13 分者胜——这个节奏我习惯了，改不掉。

      ## 卡在哪

      定位和反应都在缓慢退化。以前能稳赢的对枪现在经常五五开，更多时候靠道具和团队配合去弥补。VAC 3.0 上线之后环境确实干净了不少。

      ## 顺带一提

      饰品的二级市场水很深。2025 年 10 月 Valve 上线「五件红皮合成一件金刀/金手套」之后，大盘一天内从约 60 亿美元跌到 30 亿美元附近，热门刀型跌了将近 75%。看看就好，没打算进场。
    links:
