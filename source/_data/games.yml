  - title: Esports Manager 2026
    slug: esports-manager-2026
    date: 2026-10-18
    cover: ""
    genre: 体育模拟
    platform: PC
    status: 在玩
    summary: Neurona Games 的电竞俱乐部经营模拟，2026 年 7 月 6 日发售。从零组建战队、谈合同、培养选手，一路打进 Major 决赛。
    gameplay: |-
      ## 经营一家俱乐部意味着什么

      游戏把「管理一支职业电竞队」拆成几条互相牵制的线：

      - **招募**：在选手池里挖人，看的是当前能力、天赋上限与薪资要求的三方权衡；
      - **合同**：期限、工资、转会条款都是要亲自谈的，谈崩了就换人；
      - **培养**：训练安排影响状态与成长，赛程密集时还要做取舍；
      - **编制**：教练、分析师等职员的聘用会实质影响战队表现；
      - **品牌**：赞助、曝光与运营收益决定俱乐部能不能长期养住阵容。

      目标只有一个：把夺冠变成可复现的结果，而不是一次运气。

      ## 发售信息

      Neurona Games 开发、indie.io 发行，2026 年 7 月 6 日在 Steam 上线。Steam 评测近期偏向正面（近 30 天 340 篇中 76% 好评），简体中文区评价则偏两极（469 篇中 47% 好评）。免费 Demo 早在 2025 年 12 月 8 日就已单独放出，可以先试再买。
