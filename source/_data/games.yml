    status: 在玩
    summary: 最好玩的海斗启动器
    gameplay: |-
      ## 海斗之神

      现在压根不打排位了，基本上只打海斗，偶尔来个3v3或者无限火力会玩一下，战斗爽，排位压力太大，也没时间琢磨新机制了。可以一起玩。

      海斗里面感觉自己打的还可以吧，也是有操作的，哈哈哈哈。

      ## 比赛

      每年秋天的全球总决赛还是会看。自己打得少了，但会看比赛，云玩家这一块哈哈哈。

      ## 2026全球总决赛：BLG夺冠

      ![BLG全队再次捧起召唤师奖杯](/img/games/blg-s16/06-trophy-yonhap.jpg)

      2026年11月15日，BLG在纽约布鲁克林的巴克莱中心（Barclays Center）3-1战胜Gen.G，拿下队史第一座召唤师奖杯。这是LPL时隔五年再夺世界冠军，Knight拿下总决赛MVP。

      这场决赛我做了个专题页，四局的阵容、战绩和照片都在里面：[BLG夺冠：3-1战胜Gen.G，队史首冠 →](/blg-champion/)
