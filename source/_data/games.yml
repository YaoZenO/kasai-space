  - title: Esports Manager 2026
    slug: esports-manager-2026
    date: 2026-10-18
    cover: /img/games/game-esports-manager-2026.jpg
    genre: 体育模拟
    platform: PC
    status: 在玩
    summary: 先玩了免费 Demo，覆盖了大约七成的系统，觉得对胃口才买的正式版。当经理不当选手，坐在教练席上看比赛是主要乐趣。
    gameplay: |-
      ## 为什么想玩这个呢

      看比赛看得多了，就想试试自己组俱乐部当老板是什么感觉。刚好这个游戏给的是就是这么一个玩法：不操作选手，但每一个回合都可以自己做决定——叫暂停、改经济策略、调整默认站位。

      ## 上瘾的原因

      自己看可以看选手的参数，然后出转会费买断，发薪资，到后面超巨全在自己队里简直不要太爽。
      主要还是可以组建自己的梦之队吧，让自己喜欢的选手可以圆梦，比如科隆之前的NiKo。。寒王、鸡哥。。对吧哈哈哈

      ## Mod

      小蜜蜂和老鼠没版权，但是可以通过官方的emdb.gg里面下载数据库，自己导入进去就正常了，当时看着载物变成栽种是真的难受，这里也能调选手参数，如果你想可以把apex、karrigan的参数拉到最大。。你懂的。

      社区也有在Nexus Mods上做了62个Mod，能替换赛事数据等一系列吧，有什么看不顺眼的就去找找Mod，基本上都能满足。这个在我站的收藏里有直链。

      ## 顺带一提

      简体中文的评测偏两极，我自己的体验倒是还好。建议先下Demo，别急着买。
