  - title: 守望先锋
    slug: overwatch
    date: 2026-10-18
    cover: /img/games/game-overwatch.jpg
    genre: 英雄射击
    platform: PC
    status: 在玩
    summary: 从买断制那年就在玩的老玩家。现在改回叫《守望先锋》了，倒是比 Overwatch 2 那会儿顺口。英雄换着玩，不固定位置。
    gameplay: |-
      ## 为什么还在玩

      和传统 FPS 最大的区别：换一个英雄就是换一种打法。上一局还在当重装顶在前面，下一局就能换支援在后方奶人——同一张地图能玩出完全不同的体验，这个新鲜感很难腻。

      ## 我现在怎么玩

      位置不固定，三个位置都玩。重装、输出、支援轮着来，哪个位置排得快打哪个。快速游戏为主，偶尔进竞技。

      英雄试得比较杂，但真正打得舒服的还是那几个技能组简单、不怎么吃操作的。新英雄出来会试两把，不好驾驭就放回去。

      ## 关于改名

      2022 年 10 月变成《Overwatch 2》接手运营，免费化，还从 6v6 改成了 5v5——少一个坦克位，每个人的存在感强了不少。2026 年 2 月原作十周年，官方把名字里的「2」去掉了，又叫回《守望先锋》。我倒是觉得现在这名字更顺口。

      ## 卡在哪

      英雄太多，三十多个，每个都要重新熟悉技能和节奏。玩杂了的代价是哪个都玩得不精，遇到专精玩家就被明显压制。

      ## 顺带一提

      跨平台进度互通做得不错，Steam 和 Battle.net 之间切来切去不丢东西。
    links:
