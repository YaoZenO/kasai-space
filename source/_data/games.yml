  - title: 绝地求生
    slug: pubg
    date: 2026-10-18
    cover: ""
    genre: 大逃杀
    platform: PC
    status: 在玩
    summary: 开启大逃杀热潮的 100 人战术竞技，2017 年 12 月 21 日上线，2022 年转为免费。缩圈逼着所有人不断移动、相遇、交火。
    gameplay: |-
      ## 一百人，一个赢家

      一百名玩家空降落到一张地图上，物资全靠现场捡。随着时间推移，可活动区域被蓝圈不断压缩，圈外的玩家持续掉血；圈越小，相遇越无法避免，直到最后一个站着的人或队伍吃鸡。单局地图覆盖城镇、山地、平原、水域，落点选择本身就是第一层决策。

      ## 几种主要玩法

      - **竞技 / 排位**：第一人称或第三人称、单排或四排，按名次得分，含全球与地区排行榜；
      - **快速加入**：时长更短的休闲对局；
      - **街机与吃鸡实验室**：8v8 团队殊死战、蓝圈模式、硬核大逃杀等轮换实验玩法；
      - **自定义与沙盒**：自建房间调参数，练枪或做地图设计。

      ## 从买断到免费之后

      2022 年 1 月转为免费游玩，同时把第一届全球总决赛落地杜拜，向线下与线上观众开放。此后「PUBG Mobile」等衍生版本各自走移动端路线，由魁匠团（KRAFTON）运营至今。武器配件、倍镜与背包系统的取舍，加上子弹下坠与弹道计算，构成了它和同类游戏拉开差异的地方。
    links:
