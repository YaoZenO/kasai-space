items:
  - title: 英雄联盟
    slug: lol
    date: 2026-10-18
    cover: "/img/games/202610180235-v2-1681ff26afbd5f92aa5790b4dee6a63f-1440.jpg"
    genre: MOBA
    platform: PC
    status: 在玩
    summary: 拳头自研的 5v5 多人在线战术竞技场游戏，进攻与防守在召唤师峡谷两端同时进行，胜负最终落到一座水晶上。
    gameplay: |-
      ## 一局里发生什么

      十名玩家分成两队，在召唤师峡谷的斜对角出生，各自守着自己的基地水晶。开局所有人都是 1 级、一把多兰，经济全部来自补刀、野怪、击杀和防御塔——推掉对面的水晶就赢，被推掉就输。

      单局时长一般在 25 到 45 分钟，节奏分三段：

      1. **对线期（前 15 分钟）**：上下路各两人、中路单人，再加上一个游走的打野。补刀决定经济，换血决定血量，回家时机决定能不能把优势换成装备。
      2. **中期（15–30 分钟）**：防御塔开始成片掉落，小龙与峡谷先锋这类中立资源成为团战导火索，视野从兵线扩展到野区。
      3. **后期（30 分钟后）**：英雄等级接近 18 级上限，装备成型，一波团战的胜负能直接决定整局。

      ## 三条互锁的系统

      - **等级与经济**：每局从零开始。经验升级解锁技能点，金币购买装备，二者都随对局重置——所以输了一局不代表下一局带着劣势进场。
      - **英雄克制**：一百六十多个英雄各有定位，战士、刺客、法师、射手、辅助、坦克之间的克制关系让阵容选择成为开局前的第一层博弈。
      - **召唤师系统**：同一套账号等级、符文页与召唤师技能跨局生效，这是唯一会在单局之外累积的东西。

      ## 地图之外

      除了召唤师峡谷，还有嚎哭深渊这条大乱斗单线、极地大乱斗式轮换玩法，以及自走棋形式的云顶之弈。英雄联盟的全球总决赛每年秋天举行，是观赛人数最多的电竞赛事之一：2019 年决赛同时在线观看超过 4400 万人。

      > 国内由腾讯运营，客户端在 [英雄联盟官网](https://lol.qq.com/) 下载。
    links:
      - label: 官方网站
        url: "https://lol.qq.com/"

  - title: Counter-Strike 2
    slug: cs2
    date: 2026-10-18
    cover: ""
    genre: FPS
    platform: PC
    status: 在玩
    summary: Valve 用 Source 2 重做的 CS 系列第五作，2023 年 9 月 27 日上线并取代 CS:GO，烟雾弹第一次可以被子弹和手雷改变。
    gameplay: |-
      ## 规则骨架

      反恐精英与恐怖分子两方按模式对抗，绝大多数时间里每回合只有一条命，死了就在旁边看着。回合开始前买枪买甲，胜负看目标而非人头：一方安放并引爆 C4，另一方拆掉它，或者干脆把对面清干净。

      正式模式是 5v5 竞技与 Premier，24 回合制，先拿 13 分者胜。Premier 不指定地图，改为投票禁选，并换成了数字评分排位，设有全球与地区榜单。休闲 10v10，还有 2v2 搭档、军备竞赛、死亡竞赛等模式。

      ## 和前作不一样的地方

      - **引擎换成 Source 2**：光影、贴图、地图全部重做，CS:GO 的饰品原样继承，部分武器模型随默认武器一起更新。
      - **响应式烟雾**：烟雾弹的烟可以被子弹穿透、被手雷和爆炸吹散、被射线扫出空隙。过去的「封一颗烟就封死一条路」不再成立，烟雾本身成了可操作的战场变量。
      - **子刷新频率（sub-tick）**：服务器更细地记录输入时刻，移动与射击的判断不再受 tickrate 限制。

      ## 竞技与市场

      CS 系列有二十多年积累的比赛生态，饰品的二级市场也随之成为一个独立经济体。2025 年 10 月 Valve 上线「五件红皮合成一件金刀/金手套」后，饰品总市值在一天内从约 60 亿美元缩到 30 亿美元附近，热门刀型跌幅接近 75%。同期上线的还有交易后 7 天保护期，以及 2025 年 1 月投入使用、引入机器学习检测作弊的 VAC 3.0。
    links:
      - label: Steam 商店
        url: "https://store.steampowered.com/app/730/CounterStrike_2/"
      - label: 官方网站
        url: "https://www.counter-strike.net/"

  - title: 守望先锋
    slug: overwatch
    date: 2026-10-18
    cover: ""
    genre: 英雄射击
    platform: PC
    status: 在玩
    summary: 暴雪的免费团队射击游戏，2026 年 2 月十周年之际把名字从「Overwatch 2」改回了《守望先锋》，英雄分坦克、输出、支援三类。
    gameplay: |-
      ## 一局的结构

      两支队伍在确定的地图上争夺目标，按打法分为四类：**运载目标**（护送车到终点）、**占领要点**（抢点三局两胜）、**攻防作战**（抢点后守点）、**攻击/护送**（先抢点再推车）。快速游戏和竞技之外，还有街机模式里轮换的死斗、决斗先锋、战斗狂欢，以及可以改重力、血量、技能冷却的自定义模式与地图工坊。

      ## 英雄才是核心变量

      三十多位英雄按职责分成三档，队伍获胜往往取决于分配：

      - **坦克**：血量厚、有护盾或突进，负责冲在前面打开阵线；
      - **输出**：伤害高但脆，需要队友保护才能持续输出；
      - **支援**：治疗、护盾、加速或干扰，是全队生存的地基。

      同一个目标因为换了执行的英雄会完全不同打法——这是英雄射击与传统 FPS 最大的分野。跨平台进度互通，Steam、Battle.net、主机之间可以一起组队。

      ## 名字的来去

      2016 年 5 月 24 日发售的原作在 2022 年 10 月 4 日被《Overwatch 2》取代；2026 年 2 月原作十周年时，官方宣布去掉「2」，游戏重新叫回《守望先锋》。运营形式也早已从买断制转为免费加赛季通行证，赛季、活动英雄和联动皮肤持续更新。
    links:
