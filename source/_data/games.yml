  - title: Esports Manager 2026
    slug: esports-manager-2026
    date: 2026-10-18
    cover: /img/games/game-esports-manager-2026.jpg
    genre: 体育模拟
    platform: PC
    status: 在玩
    summary: 先玩了免费 Demo，覆盖了大约七成的系统，觉得对胃口才买的正式版。当经理不当选手，坐在教练席上看比赛是主要乐趣。
    gameplay: |-
      ## 为什么想玩这个

      看比赛看得多了，自然想试试站在俱乐部那一侧是什么感觉。这款游戏给的是「教练席视角」：不操作选手，但每一个回合都要做决定——叫暂停、改经济策略、调整默认站位。

      ## 我先玩了 Demo

      Steam 上单独放了免费 Demo，能体验到大约 70% 的系统：招募、谈合同、组阵容、雇职员、看比赛模拟。觉得对胃口才买的正式版，这种先试后买的方式挺合适的。

      ## 现在在玩什么

      - **招募和合同**：看选手的能力评分、武器强项、性格和薪资要求，然后决定签不签、签几年。
      - **培养**：安排每周训练，瞄准、地图理解、心理状态，把有潜力的新人练出来。
      - **看比赛**：这是最上瘾的部分。实时比分、经济面板、回合事件，比自己上手还紧张。

      ## Mod 也装了

      官方不提供 mod 支持，但社区自己在 Nexus Mods 上做了 62 个 mod。其中 EM Mod Loader 解决了 Unity 6000.5.10 / metadata v107 补丁后的崩溃问题，装上之后才稳定跑起来。

      ## 顺带一提

      简体中文的评测偏两极，我自己的体验倒是还好。建议先下 Demo，别急着买。
