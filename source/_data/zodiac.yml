    culture: '<h2>鸡鸣与阳气</h2><p>古人把鸡鸣看作一天开始的信号，也相信它能驱散夜间邪祟——光明战胜黑暗的意象，让鸡成了守时与勤快的象征。传统剪纸里的公鸡多与「冠（官）」谐音的吉利用法有关。</p><h2>形似雄鸡的土地</h2><p>中国人常说起国土轮廓像一只雄鸡：东北是鸡头，沿海各省构成鸡胸，西部地区是鸡尾。这个比喻强化了雄鸡作为国家形象象征的地位。前一位是<a class="z-link" href="/zodiac/monkey/">猴年</a>，后一位是<a class="z-link" href="/zodiac/dog/">狗年</a>。</p>'

