      - id: "word"
        title: "「猴」字怎么写"
        body: '<p>「猴」是形声字：左边「犭」（犬旁）表明属于兽类，右边「侯」提示读音；简体与繁体同形，共十二画。猴在古代还有别称：「猢狲」是唐宋时期的常见叫法，「申猴」则取地支对应。</p>'
      - id: "language"
        title: "汉语里的猴"
        body: '<p>「猴」是生肖用字，口语里也说「猴子」。与猴有关的词多讲机灵：「猴精」形容人精明，「尖嘴猴腮」形容面相瘦削。英文学的 monkey 一词据说源自意大利语的同名猴子，与生肖无关。</p>'
      - id: "meaning"
        title: "猴的寓意"
        body: '<p>猴象征聪明、机智、好奇与适应力，传统上被认为善交际、爱探索。属猴的人常被形容聪明、风趣，也可能被形容冲动或固执；这类说法属民间流传，并无统一出处。</p>'
      - id: "tales"
        title: "与猴有关的传统和传说"
        body: '<p>渡河比赛的传说里，猴与鸡、羊合作：鸡找来木筏，羊和猴把木筏抬下水并清理障碍，猴最终得了第九名。故事体现的是合作与机灵。</p><p>中国文学里最著名的猴是《西游记》的美猴王孙悟空——机智、叛逆、本领高强。他的人气让猴的形象在故事、戏曲、动画和大众文化里格外醒目，也让「机灵」成了这个属相最常用的注脚。</p>'
      - id: "vocab"
        title: "猴年相关词汇"
        body: '<p>下面这些词能帮你谈论猴年、生肖与《西游记》。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>猴年讲的是灵动：从渡河比赛里的合作者，到石板里蹦出来的美猴王。下一个猴年从 2040 年 2 月 12 日开始。</p>'
    vocab:
      - { t: "猴", p: "hóu", m: "猴子", n: "生肖第九位" }
      - { t: "猴子", p: "hóuzi", m: "猴（口语）", n: "" }
