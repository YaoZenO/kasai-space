  # ============ 10 鸡 ============
  - key: "rooster"
    animal: "鸡"
    pinyin: "jī"
    english: "Rooster"
    featured: 2029
    intro: "鸡是十二生肖的第十位，对应十二地支的「酉」。鸡在中国文化里是守时与勤奋的象征，也是唯一进了家门的生肖。"
    luck:
      numbers: "5 · 7 · 8"
      avoidNumbers: "1 · 3 · 9"
