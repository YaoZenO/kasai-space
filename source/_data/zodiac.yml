      - { t: "羊城", p: "Yángchéng", m: "广州的别称", n: "源自五羊传说" }
      - { t: "五羊雕像", p: "Wǔyáng Diāoxiàng", m: "广州越秀公园的五羊石像", n: "城市地标" }
      - { t: "温柔", p: "wēnróu", m: "温和", n: "属羊人的常见形容" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
    faq:
      - q: "2027 年的羊年从哪天开始？"
        a: "2027 年 2 月 6 日的春节当天开始，到 2028 年 1 月 25 日结束。"
      - q: "火羊年多少年出现一次？"
        a: "丁未组合六十年一轮：上一个火羊年是 1967 年，下一个要等到 2087 年。"
