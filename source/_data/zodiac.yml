    culture: '<h2>玉兔与月亮</h2><p>西方人看月亮会想到「月亮里的人」，中国人多半会看到玉兔。最常见的版本里，玉皇大帝化身乞丐试探动物，兔子舍身投火，被救后带到月宫捣药。中秋夜的兔儿爷泥塑、孩子提的兔子灯，都是这个意象的民俗形态。</p><h2>属兔的名人与渡河传说</h2><p>篮球明星迈克尔·乔丹生于 1963 年，是最常被提到的属兔名人。渡河赛跑的传说里，兔子靠抓住一根浮木上岸，因此在十二生肖里常被看作好运的象征。前一位是<a class="z-link" href="/zodiac/tiger/">虎年</a>，后一位是<a class="z-link" href="/zodiac/dragon/">龙年</a>。</p>'

