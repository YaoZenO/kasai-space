animals:
  # ============ 1 鼠 ============
  - key: "rat"
    animal: "鼠"
    pinyin: "shǔ"
    english: "Rat"
    featured: 2032
    intro: "鼠是十二生肖的第一位，对应十二地支的「子」。鼠年每十二年轮回一次；同一个干支组合要六十年才再出现一次。"
    luck:
      numbers: "1 · 6"
      avoidNumbers: ""
      colors: "黑、深蓝"
      avoidColors: ""
      flowers: ""
      directions: "北"
      avoidDirections: ""
      note: "子属水，传统河图以水数为一、六，方位应北、颜色应黑——这是有传统依据的对应，不是民间吉凶数。"
    sections:
      - id: "what"
        title: "什么是鼠年"
        years: true
        body: '<p>生肖以十二年为一个周期，春节当天更替一位。出生在鼠年的人属鼠，年份从 1948 年起每十二年一轮。眼下的鼠年是 2032 年：从 2032 年 2 月 11 日的春节开始，到 2033 年 1 月 30 日结束，干支写作壬子，按天干五行属水，所以也叫水鼠年。同一个干支组合六十年出现一次，上一个壬子年是 1972 年，下一个要等到 2092 年。</p><h3>年初出生的人怎么算</h3><p>生肖年从正月初一起算，不从 1 月 1 日算。1 月或 2 月初出生的人，属相可能属于上一年，需要核对出生当年的春节日期。另有一种从立春起算的算法，属于四柱八字的命理体系，只在排八字时使用；两种算法只影响 1 月下旬到 2 月上旬出生的人，且两个日期谁先谁后每年不一样。</p>'
      - id: "word"
        title: "「鼠」字怎么写"
        body: '<p>「鼠」是象形字，古老的字形画出老鼠的轮廓，突出尖嘴、小耳与尾巴；简体与繁体同形，共十三画。由它组成的字大多与啮齿小动物有关：松鼠、仓鼠、田鼠，乃至并不沾边的袋鼠。</p>'
      - id: "language"
        title: "汉语里的鼠"
        body: '<p>生肖和书面语用「鼠」，日常口语多说「老鼠」，方言里还有「耗子」——后者源自明代一种补贴粮损的税目「鼠耗」，税因老鼠得名，老鼠又把名字从税那里拿了回来。</p><p>与鼠有关的成语大多带贬义：胆小如鼠、鼠目寸光、抱头鼠窜、首鼠两端、投鼠忌器。例外出自《庄子》——「偃鼠饮河」说的是所需极少。有两处常被译错：首鼠两端是在两个选择之间犹豫，不是「两面三刀」；投鼠忌器讲的是克制，想除掉祸害又怕误伤旁边的瓷器。</p>'
      - id: "meaning"
        title: "鼠的寓意"
        body: '<p>鼠在民间艺术里是喜庆形象。地支「子」与「孩子」的「子」同字，瓜和葡萄又果实多籽——「籽」与「子」谐音——因此鼠配瓜、瓜多籽的图案寓意多子多福，是传统的祈子题材。明代《苦瓜鼠图》就被认为寄托了祈求皇嗣平安的心愿。</p><h3>老鼠嫁女</h3><p>「老鼠嫁女」是流传很广的民间题材，正月里举行，借「嫁」送走鼠患，各地日期不一。这个题材进了年画、剪纸和民俗学研究，也是小学课本里的常客。</p>'
      - id: "tales"
        title: "与鼠有关的传统和传说"
        body: '<p>解释鼠为什么排第一，最著名的传说是渡河比赛：老鼠趁牛不备跳到前面，抢了第一名。故事当然是附会——鼠对应地支第一位「子」，而地支的顺序比动物名单更古老。湖北睡虎地一座公元前 217 年的秦墓竹简上，地支与动物的对照表已经很像今天的生肖：鼠的位置当时已经固定，但马的位置上是鹿。</p><h3>莫扎特属什么</h3><p>莫扎特常被列属鼠，但他生于 1756 年 1 月 27 日，那年的鼠年要到 1 月 31 日才开始——按通行算法和八字算法，他都属<a class="z-link" href="/zodiac/pig/">猪年</a>。这也是年初出生的人必须核对春节日期的经典例子。</p>'
      - id: "vocab"
        title: "鼠年相关词汇"
        body: '<p>下面这些词能帮你读懂生肖话题、节日文章和日常寒暄。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>鼠年不只是日历上的一位。它连着干支纪年的规矩、汉语里层次分明的用词、一批带刺的成语，还有一个送了上千年嫁女的民俗题材。下一个鼠年从 2032 年 2 月 11 日开始——到时候又轮到属鼠的人过本命年。</p>'
    figures:
      - section: "meaning"
        layout: "inline"
        file: "/img/zodiac/rat-stone.jpg"
        width: 960
        height: 703
        alt: "明宣宗朱瞻基《鼠石图》，老鼠立于石畔，旁有瓜叶"
        caption: "明宣宗朱瞻基《鼠石图》：老鼠、石与瓜叶同框——与民间「鼠配瓜」的多子祈盼同属明代鼠画题材。"
        author: "朱瞻基（明宣宗）"
        license: "Public domain"
        page: "https://commons.wikimedia.org/wiki/File:Zhu_Zhanji-Mouse_and_Stone.jpg"
      - section: "tales"
        layout: "band"
        file: "/img/zodiac/rat-priest.jpg"
        width: 948
        height: 1400
        alt: "清代道教生肖神图，鼠首人身的鼠神立像"
        caption: "清代道教生肖神图中的鼠神：生肖后来进入道教星神体系，十二属相各配一位神将，大都会艺术博物馆藏。"
        author: "佚名（清代）"
        license: "CC0"
        page: "https://commons.wikimedia.org/wiki/File:Daoist_Priest_with_Zodiac_Animal,_Rat_MET_DP-18670-001.jpg"
    vocab:
      - { t: "鼠", p: "shǔ", m: "老鼠；生肖鼠", n: "也指松鼠、仓鼠等" }
      - { t: "老鼠", p: "lǎoshǔ", m: "老鼠（日常说法）", n: "「老」是前缀，不是年老" }
      - { t: "耗子", p: "hàozi", m: "老鼠（方言说法）", n: "源自明代粮税「鼠耗」" }
      - { t: "属鼠", p: "shǔ shǔ", m: "属相是鼠", n: "生肖义里「属」读 shǔ" }
      - { t: "壬子", p: "rénzǐ", m: "壬子年", n: "2032 年的干支，水鼠" }
      - { t: "立春", p: "lìchūn", m: "立春（节气）", n: "2 月 4 日或 5 日" }
      - { t: "干支", p: "gānzhī", m: "天干地支纪年", n: "六十年一周" }
      - { t: "八字", p: "bāzì", m: "四柱八字", n: "命理体系，从立春起算" }
      - { t: "子时", p: "zǐshí", m: "夜里 11 点到凌晨 1 点", n: "十二时辰之一" }
      - { t: "胆小如鼠", p: "dǎn xiǎo rú shǔ", m: "胆小到极点", n: "成语" }
      - { t: "鼠目寸光", p: "shǔ mù cùn guāng", m: "目光短浅", n: "成语" }
      - { t: "首鼠两端", p: "shǒu shǔ liǎng duān", m: "犹豫不决", n: "成语；不是「两面派」" }
      - { t: "投鼠忌器", p: "tóu shǔ jì qì", m: "想除害又怕误伤旁人", n: "成语" }
      - { t: "硕鼠", p: "shuò shǔ", m: "大老鼠；指贪吏", n: "成语，出自《诗经》" }
      - { t: "偃鼠饮河", p: "yǎn shǔ yǐn hé", m: "所需极少", n: "成语，出自《庄子》" }
      - { t: "老鼠嫁女", p: "lǎoshǔ jià nǚ", m: "正月送鼠的民俗题材", n: "年画与剪纸常见" }
      - { t: "鼠标", p: "shǔbiāo", m: "电脑鼠标", n: "现代借词" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
      - { t: "太岁", p: "tàisuì", m: "值年星神", n: "本命年「冲犯太岁」之说" }
    faq:
      - q: "2032 年的鼠年从哪天开始？"
        a: "2032 年 2 月 11 日，也就是春节当天；到 2033 年 1 月 30 日结束。"
      - q: "水鼠年多少年出现一次？"
        a: "壬子组合六十年一轮：1972 年之后是 2032 年，下一次要等到 2092 年。"
      - q: "为什么鼠排在十二生肖第一位？"
        a: "因为它对应十二地支的第一位「子」。干支记日在商代甲骨文里已经使用，十二种动物是后来配上去的；「赛跑抢第一」的故事是后世附会的解释。"
      - q: "1 月底 2 月初出生的人怎么定属相？"
        a: "以春节为界。2032 年立春（2 月 4 日）在春节（2 月 11 日）之前，2 月 4 日至 10 日出生的人按八字算法已属鼠，按通行算法仍属猪。"

  # ============ 2 牛 ============
  - key: "ox"
    animal: "牛"
    pinyin: "niú"
    english: "Ox"
    featured: 2021
    intro: "牛是十二生肖的第二位，对应十二地支的「丑」。在中国传统里，牛是农耕社会的劳力底子，也是勤劳与可靠的代名词。"
    luck:
      numbers: ""
      avoidNumbers: ""
      colors: ""
      avoidColors: ""
      flowers: ""
      directions: ""
      avoidDirections: ""
      note: ""
    sections:
      - id: "what"
        title: "什么是牛年"
        years: true
        body: '<p>牛年每十二年一轮，从 1949 年起依次为 1961、1973、1985、1997、2009、2021。眼下的牛年是 2021 年：从 2021 年 2 月 12 日的春节开始，到 2022 年 1 月 31 日结束，干支写作辛丑，按天干五行属金，所以也称金牛年。上一个辛丑年是 1961 年，下一个要等到 2081 年。</p><h3>年初出生的人怎么算</h3><p>牛年按春节起算。例如 1997 年 1 月出生的人，春节（2 月 7 日）还没到，属相仍属于上一年——鼠。</p>'
      - id: "word"
        title: "「牛」字怎么写"
        body: '<p>「牛」是象形字，古字形像牛头正面，突出向上弯的牛角；简体与繁体同形，共四画。这个字涵盖牛科多种动物：黄牛、水牛、牦牛都可以叫牛。</p>'
      - id: "language"
        title: "汉语里的牛"
        body: '<p>中文的「牛」按语境可以指牛类、耕牛、公牛，也可以指母牛、水牛。英文按传统译作 Year of the Ox（Ox 指阉割的役用公牛），与农耕、耐力的形象更贴合，也是沿用已久的通行译法。</p><p>口语里「你很牛」是一句常见夸奖，字面直译成英文会闹笑话，意思其实是「你真厉害」。拜年时说的「牛年大吉」，则是生肖年里最顺口的祝福之一。</p>'
      - id: "meaning"
        title: "牛的寓意"
        body: '<p>牛是最早被驯化的家畜之一，在农耕、运输和乡村生活里长期承担主要劳力。因此传统上，牛象征勤劳、可靠和默默奉献——力气大、步伐稳，不抢风头。属牛的人常被形容可靠、有耐心，也可能被形容固执；这类说法属民间流传，各来源措辞相近，并无统一出处。</p>'
      - id: "tales"
        title: "与牛有关的传统和传说"
        body: '<p>解释生肖顺序的渡河比赛里，牛力气大、步伐稳健，本该稳拿第一；老鼠趁牛不备跳到前面，牛屈居第二。故事解释了顺序，也把「踏实却输给机灵」的意象留在了语汇里。</p><p>立春时节，民间有「打春牛」的旧俗：用泥塑或纸糊的春牛迎春，寓意劝农耕作。这个习俗如今多留在文献与民俗表演里。</p>'
      - id: "vocab"
        title: "牛年相关词汇"
        body: '<p>下面这些词能帮你用中文谈论牛年、生肖与春节。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>牛年排在十二生肖第二位，讲的是同一套道理：属相连着农历、连着农耕社会的记忆，也连着汉语里「你很牛」这样的现代用法。下一个牛年从 2033 年 1 月 31 日开始。</p>'
    vocab:
      - { t: "牛", p: "niú", m: "牛；牛科动物统称", n: "也指黄牛、水牛" }
      - { t: "牛年", p: "niúnián", m: "牛年", n: "生肖第二位" }
      - { t: "属牛", p: "shǔ niú", m: "属相是牛", n: "" }
      - { t: "金牛", p: "jīnniú", m: "金牛", n: "2021 年的干支辛丑" }
      - { t: "辛丑", p: "xīnchǒu", m: "辛丑年", n: "2021 年的传统纪年" }
      - { t: "水牛", p: "shuǐniú", m: "水牛", n: "传统农业的重要畜力" }
      - { t: "春牛", p: "chūnniú", m: "立春迎春的土牛、纸牛", n: "旧时劝农之俗" }
      - { t: "勤劳", p: "qínláo", m: "勤劳", n: "属牛人的常见形容" }
      - { t: "可靠", p: "kěkào", m: "可靠", n: "" }
      - { t: "固执", p: "gùzhí", m: "固执", n: "常见短板说法" }
      - { t: "你很牛", p: "nǐ hěn niú", m: "你很厉害", n: "口语夸奖" }
      - { t: "牛年大吉", p: "niúnián dàjí", m: "牛年大吉", n: "拜年语" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
    faq:
      - q: "2021 年的牛年从哪天开始？"
        a: "2021 年 2 月 12 日的春节当天开始，到 2022 年 1 月 31 日结束。"
      - q: "金牛年多少年出现一次？"
        a: "辛丑组合六十年一轮：上一个金牛年是 1961 年，下一个要等到 2081 年。"
      - q: "为什么英文是 Year of the Ox 而不是 Cow？"
        a: "「牛」字涵盖牛科多种动物，英文按传统译作 Ox（阉割役牛），与农耕、耐力的形象更贴合，也是通行译法。"
      - q: "属牛的人传统上被形容成什么样？"
        a: "可靠、勤勉、诚实、有耐心，也可能被形容固执、不愿改变。这类说法属民间流传，当作文化话题看即可。"

  # ============ 3 虎 ============
  - key: "tiger"
    animal: "虎"
    pinyin: "hǔ"
    english: "Tiger"
    featured: 2022
    intro: "虎是十二生肖的第三位，对应十二地支的「寅」。虎在中国文化里是勇气与力量的象征，也是少数进了神话体系的生肖。"
    luck:
      numbers: "1 · 3 · 4"
      avoidNumbers: "6 · 7 · 8"
      colors: "蓝、灰、橙"
      avoidColors: "棕"
      flowers: ""
      directions: ""
      avoidDirections: ""
      note: "民间流行说法，各来源互有出入，只作参考。"
    sections:
      - id: "what"
        title: "什么是虎年"
        years: true
        body: '<p>虎年每十二年一轮，从 1950 年起依次为 1962、1974、1986、1998、2010、2022。眼下的虎年是 2022 年：从 2022 年 2 月 1 日的春节开始，到 2023 年 1 月 21 日结束，干支写作壬寅，按天干五行属水，所以也称水虎年。上一个壬寅年是 1962 年，下一个要等到 2082 年。</p>'
      - id: "word"
        title: "「虎」字怎么写"
        body: '<p>「虎」是象形字，古字形像张口立目的猛虎；简体与繁体同形，共八画。虎在古代还有别称：「大虫」是唐宋时期的常见叫法，「山君」则是笔记小说里的雅称。</p>'
      - id: "language"
        title: "汉语里的虎"
        body: '<p>「虎」在口语里常说「老虎」——「老」是前缀，能把单音节词变成双音节词，老虎、老鹰里的「老」都是这个用法。成语「骑虎难下」说的是事情做到一半、想停已经很难，与虎有关的成语多半讲气势与凶险。</p><p>江西的龙虎山（Lónghǔ Shān）被认为是道教发源地之一，山名里的「龙虎」常被用来给男孩取名，取的是龙虎精神。</p>'
      - id: "meaning"
        title: "虎的寓意"
        body: '<p>虎象征勇敢、自信与领导力，传统上被认为强大而有时难以捉摸。属虎的人常被形容大胆、有领袖气质，也可能被形容情绪化、脾气急躁——这类说法属民间流传，并无统一出处。</p><p>在传统道教信仰里，虎是替天行道的正义使者，能驱邪，道观的墙壁上常绘有虎。中医古籍里有虎骨入药的记载，那是旧时代的做法；今天虎是保护动物，偷猎与交易属于违法。</p>'
      - id: "tales"
        title: "与虎有关的传统和传说"
        body: '<p>渡河比赛的传说里，虎凭着好胜的天性和惊人的速度拿了第三，从此稳居生肖第三位。</p><p>民间相信虎能吓退夜游的邪祟，旧时产妇住的房门上贴「艾虎」图，端午也有布老虎、虎头鞋、虎头帽——借虎的威势护孩子平安。这些习俗今天多留在民俗工艺品里。</p>'
      - id: "famous"
        title: "属虎的名人"
        body: '<p>常被提到的虎年名人有英国女王伊丽莎白二世（1926）、演员兼歌手玛丽莲·梦露（1926）、古巴前领导人菲德尔·卡斯特罗（1926）和短跑冠军尤塞恩·博尔特（1986）。</p>'
      - id: "vocab"
        title: "虎年相关词汇"
        body: '<p>下面这些词能帮你谈论虎年、生肖与相关传统。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>虎年讲的不只是「勇敢」两个字。它连着道观的壁画、端午的布老虎、一个骑虎难下的成语，还有一批生于虎年的名人。下一个虎年从 2034 年 2 月 19 日开始。</p>'
    vocab:
      - { t: "生肖", p: "shēngxiào", m: "生肖", n: "十二种动物的纪年体系" }
      - { t: "虎", p: "hǔ", m: "老虎", n: "生肖第三位" }
      - { t: "老虎", p: "lǎohǔ", m: "老虎（口语）", n: "「老」是前缀" }
      - { t: "虎年", p: "hǔnián", m: "虎年", n: "" }
      - { t: "属虎", p: "shǔ hǔ", m: "属相是虎", n: "" }
      - { t: "壬寅", p: "rényín", m: "壬寅年", n: "2022 年的干支，水虎" }
      - { t: "骑虎难下", p: "qí hǔ nán xià", m: "事情进行到一半难以罢手", n: "成语" }
      - { t: "大虫", p: "dàchóng", m: "虎（古称）", n: "唐宋时期常见叫法" }
      - { t: "山君", p: "shānjūn", m: "虎（雅称）", n: "笔记小说常用" }
      - { t: "龙虎山", p: "Lónghǔ Shān", m: "龙虎山", n: "江西，道教发源地之一" }
      - { t: "艾虎", p: "àihǔ", m: "端午辟邪的虎形图样", n: "旧俗贴于房门" }
      - { t: "布老虎", p: "bù lǎohǔ", m: "布缝的老虎玩具", n: "端午与孩童用品" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
    faq:
      - q: "2022 年的虎年从哪天开始？"
        a: "2022 年 2 月 1 日的春节当天开始，到 2023 年 1 月 21 日结束。"
      - q: "水虎年多少年出现一次？"
        a: "壬寅组合六十年一轮：上一个水虎年是 1962 年，下一个要等到 2082 年。"
      - q: "虎在道教里是什么形象？"
        a: "传统道教信仰中虎是替天行道的正义使者，能驱邪，道观墙壁常绘虎；江西龙虎山被认为是道教发源地之一。"
      - q: "属虎的幸运数字和颜色有什么说法？"
        a: "民间说法里 1、3、4 为吉数，6、7、8 宜避；蓝、灰、橙为幸运色，棕色宜避。这类说法各来源不一，只作参考。"

  # ============ 4 兔 ============
  - key: "rabbit"
    animal: "兔"
    pinyin: "tù"
    english: "Rabbit"
    featured: 2023
    intro: "兔是十二生肖的第四位，对应十二地支的「卯」。兔在中国文化里与月亮绑定，也是传统上最讨喜的属相之一。"
    luck:
      numbers: ""
      avoidNumbers: ""
      colors: ""
      avoidColors: ""
      flowers: ""
      directions: ""
      avoidDirections: ""
      note: ""
    sections:
      - id: "what"
        title: "什么是兔年"
        years: true
        body: '<p>兔年每十二年一轮，从 1951 年起依次为 1963、1975、1987、1999、2011、2023。眼下的兔年是 2023 年：从 2023 年 1 月 22 日的春节开始，到 2024 年 2 月 9 日结束，干支写作癸卯，按天干五行属水，所以也称水兔年。上一个癸卯年是 1963 年，下一个要等到 2083 年。</p>'
      - id: "word"
        title: "「兔」字怎么写"
        body: '<p>「兔」是象形字，古字形像蹲坐的兔子，突出长耳与短尾；简体与繁体同形，共八画。口语里多说「兔子」，民俗里还有「兔儿爷」——老北京中秋的泥塑，人形兔耳，是玉兔信仰的世俗版。</p>'
      - id: "language"
        title: "汉语里的兔"
        body: '<p>「兔」是生肖与书面用字，日常口语说「兔子」。与兔有关的词大多温和：兔唇是医学术语，今多用「唇裂」；「动如脱兔」讲速度。英文的 Year of the Rabbit 是通行译法。</p>'
      - id: "meaning"
        title: "兔的寓意"
        body: '<p>兔象征温和、善良与艺术气质，传统上也被看作好运的象征——渡河比赛的传说里，兔子靠抓住一根浮木上岸，因此在十二生肖里常被归入最吉利的属相。属兔的人常被形容温和、善于倾听，也可能被形容犹豫、回避冲突；这类说法属民间流传，并无统一出处。</p><h3>兔年宝宝取名</h3><p>民间给兔年出生的孩子取名，常挑带「艹」（草，兔食草）、「彡」（毛色）、「口」（洞穴，兔有安全的窝）部首的字，寄托衣食丰足的心愿。</p>'
      - id: "tales"
        title: "与兔有关的传统和传说"
        body: '<p>玉兔的传说最常见的一个版本：玉皇大帝化身乞丐试探动物，兔子舍身投火，被救后带到月宫捣药，陪伴嫦娥。中国人望月，多半会看到这只兔子——它至今还在桂树下捣着仙药。</p><p>中秋节是兔意象最盛的时节：老北京有兔儿爷泥塑，孩子提纸扎的兔子灯登山赏月。西北一些地区的婚礼上，母亲会蒸兔子形状的馒头给女儿带给夫家，盼早生贵子。旧俗还有劝孕妇忌食兔肉的说法，担心孩子兔唇——现代医学已不认可，知道有这个说法即可。</p>'
      - id: "famous"
        title: "属兔的名人"
        body: '<p>最常被提到的属兔名人是篮球明星迈克尔·乔丹（1963）。</p>'
      - id: "vocab"
        title: "兔年相关词汇"
        body: '<p>下面这些词能帮你谈论兔年、玉兔传说与中秋节。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>兔年连着月亮、连着中秋的兔儿爷与兔子灯，也连着取名时那几个挑出来的部首。下一个兔年从 2035 年 2 月 8 日开始。</p>'
    vocab:
      - { t: "兔", p: "tù", m: "兔子", n: "生肖第四位" }
      - { t: "兔子", p: "tùzǐ", m: "兔（动物）", n: "日常口语" }
      - { t: "兔年", p: "tùnián", m: "兔年", n: "" }
      - { t: "属兔", p: "shǔ tù", m: "属相是兔", n: "" }
      - { t: "癸卯", p: "guǐmǎo", m: "癸卯年", n: "2023 年的干支，水兔" }
      - { t: "玉兔", p: "Yùtù", m: "月宫里的玉兔", n: "中秋意象" }
      - { t: "月宫", p: "yuègōng", m: "月宫", n: "嫦娥与玉兔居住的地方" }
      - { t: "嫦娥", p: "Cháng'é", m: "月宫仙子", n: "玉兔传说的另一位主角" }
      - { t: "兔儿爷", p: "tù'eryé", m: "中秋的兔形泥塑", n: "老北京民俗" }
      - { t: "中秋节", p: "Zhōngqiūjié", m: "中秋节", n: "农历八月十五" }
      - { t: "动如脱兔", p: "dòng rú tuō tù", m: "动作敏捷", n: "成语" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
    faq:
      - q: "2023 年的兔年从哪天开始？"
        a: "2023 年 1 月 22 日的春节当天开始，到 2024 年 2 月 9 日结束。"
      - q: "水兔年多少年出现一次？"
        a: "癸卯组合六十年一轮：上一个水兔年是 1963 年，下一个要等到 2083 年。"
      - q: "兔为什么和月亮联系在一起？"
        a: "源自玉兔的传说：玉兔在月宫桂树下捣制仙药，陪伴嫦娥。中秋的兔儿爷、兔子灯都从这个意象来。"
      - q: "兔年出生的宝宝取名有什么讲究？"
        a: "民间常挑带「艹」「彡」「口」部首的字，分别取草木丰足、毛色漂亮、有安身之所的意思。"

  # ============ 5 龙 ============
  - key: "dragon"
    animal: "龙"
    pinyin: "lóng"
    english: "Dragon"
    featured: 2024
    intro: "龙是十二生肖的第五位，对应十二地支的「辰」。龙是十二种动物里唯一的神话生物，也是象征意义最强的一个。"
    luck:
      numbers: "1 · 6 · 7"
      avoidNumbers: "3 · 8"
      colors: "金、白、灰"
      avoidColors: "蓝、绿"
      flowers: ""
      directions: "东、北、南"
      avoidDirections: "西北"
      note: "民间流行说法，各来源互有出入，只作参考。"
    sections:
      - id: "what"
        title: "什么是龙年"
        years: true
        body: '<p>龙年每十二年一轮，从 1952 年起依次为 1964、1976、1988、2000、2012、2024。眼下的龙年是 2024 年：从 2024 年 2 月 10 日的春节开始，到 2025 年 1 月 27 日结束，干支写作甲辰，按天干五行属木，所以也称木龙年。上一个甲辰年是 1964 年，下一个要等到 2084 年。</p>'
      - id: "word"
        title: "「龙」字怎么写"
        body: '<p>「龙」是象形字，古字形像张口蜷身的神兽；简体五画，繁体作「龍」。与龙有关的字大多取威势：龙王、龙脉、龙舟。</p>'
      - id: "language"
        title: "汉语里的龙"
        body: '<p>「龙」既是生肖也是文化符号：龙王管水，龙舟竞渡，龙脉堪舆。问对方「你属什么」是中国人推算年龄的惯用问法——看到属龙的回答，大致就能猜出对方生于哪个龙年。龙年的拜年话也格外热闹：「龙腾虎跃」「龙马精神」都是常见祝颂。</p>'
      - id: "meaning"
        title: "龙的寓意"
        body: '<p>龙象征力量、吉祥与尊贵，是十二生肖里唯一不存在的动物。属龙的人常被形容自信、有领导力，也可能被形容急躁、听不得批评——这类说法属民间流传，并无统一出处。</p><h3>龙宝宝</h3><p>龙被看作最吉利的属相，一些家庭会特意安排在龙年生孩子，龙年屡屡出现生育高峰。有研究跟踪了龙年出生的孩子，发现他们后来的学业优势在计入父母的期待之后就消失了——影响来自期望本身，不来自生肖。</p>'
      - id: "tales"
        title: "与龙有关的传统和传说"
        body: '<p>流传最广的龙神话与一场大旱有关：海里四条龙取水洒向人间，被玉皇大帝压在山下，山中涌出黄河、长江、珠江和黑龙江四条大河。龙的形象还进了节庆：端午赛龙舟、正月舞龙灯，都是借龙的威势祈晴雨、纳吉祥。</p>'
      - id: "famous"
        title: "属龙的名人"
        body: '<p>常被提到的龙年名人有李小龙（1940）、马丁·路德·金（1929）、马云（1964）和李嘉诚（1928）。</p>'
      - id: "vocab"
        title: "龙年相关词汇"
        body: '<p>下面这些词能帮你谈论龙年、生肖与相关祝颂。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>龙年是十二生肖里最热闹的一个：唯一的神话动物、唯一的生育高峰、唯一的四海龙王神话。下一个龙年从 2036 年 1 月 28 日开始。</p>'
    figures:
      - section: "meaning"
        layout: "inline"
        file: "/img/zodiac/dragon-jade.jpg"
        width: 933
        height: 1400
        alt: "红山文化玉猪龙，蜷体玉龙"
        caption: "红山文化玉猪龙：五千多年前的蜷体玉龙，被认为是中华龙形象的源头之一，中国国家博物馆藏。"
        author: "MarginalCost（摄）"
        license: "CC0"
        page: "https://commons.wikimedia.org/wiki/File:Hongshan_Jade_Pig-dragon.jpg"
      - section: "tales"
        layout: "band"
        file: "/img/zodiac/dragon-parade.jpg"
        width: 1200
        height: 919
        alt: "约 1900 年海外华埠的舞龙游行老照片"
        caption: "约 1900 年的舞龙队：正月舞龙灯的民俗随华侨漂洋过海，这张百年前的照片记录了海外游龙的样子。"
        author: "C. C. Pierce"
        license: "Public domain"
        page: "https://commons.wikimedia.org/wiki/File:Chinese_dragon_in_a_parade,_ca.1900_(CHS-1687).jpg"
    vocab:
      - { t: "龙", p: "lóng", m: "龙", n: "十二生肖中唯一的神话动物" }
      - { t: "龙年", p: "lóngnián", m: "龙年", n: "" }
