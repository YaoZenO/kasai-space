      - id: "what"
        title: "什么是鸡年"
        years: true
        body: '<p>鸡年每十二年一轮，从 1957 年起依次为 1969、1981、1993、2005、2017、2029。眼下的鸡年是 2029 年：从 2029 年 2 月 13 日的春节开始，到 2030 年 2 月 2 日结束，干支写作己酉，按天干五行属土，所以也称土鸡年。上一个己酉年是 1969 年，下一个要等到 2089 年。</p>'
      - id: "word"
        title: "「鸡」字怎么写"
        body: '<p>「鸡」是形声字：右边「鸟」表明属于鸟类，左边「又」提示读音；简体七画，繁体作「雞」。鸡在古代还有别称：「酉鸡」取地支对应，「司晨」则取其报晓的本分。</p>'
      - id: "language"
        title: "汉语里的鸡"
        body: '<p>「鸡」是生肖与日常用字：公鸡、母鸡、鸡冠、鸡蛋。与鸡有关的成语多讲小利与场面：「鸡毛蒜皮」说事情琐碎，「鸡飞狗跳」形容混乱。英文的 Year of the Rooster 是通行译法，也译作 Year of the Chicken。</p>'
      - id: "meaning"
        title: "鸡的寓意"
        body: '<p>鸡象征守时、可靠与黎明时分的朝气。古人把鸡鸣看作一天开始的信号，也相信清晨鸡鸣能驱走夜间游荡的邪祟——光明与阳气战胜黑暗。属鸡的人常被形容勤奋、观察力强，也可能被形容过于看重物质；这类说法属民间流传，并无统一出处。</p>'
      - id: "tales"
        title: "与鸡有关的传统和传说"
        body: '<p>鸡「冠」与官「官」谐音，因此鸡被寄托了事业有成、步步高升的寓意——传统剪纸里的公鸡多取这个意思，画的是官运。</p><p>中国人常说起国土轮廓像一只雄鸡：东北是鸡头，沿海各省构成鸡胸，西部地区是鸡尾。这个比喻强化了雄鸡作为国家形象象征的地位，也让「金鸡」成了地图爱好者的俗称。</p>'
      - id: "vocab"
        title: "鸡年相关词汇"
        body: '<p>下面这些词能帮你谈论鸡年、生肖与相关传统。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>鸡年讲的是勤快：从报晓的司晨，到谐音「官」的剪纸，再到形似雄鸡的土地。下一个鸡年从 2041 年 2 月 1 日开始。</p>'
    vocab:
      - { t: "生肖", p: "shēngxiào", m: "生肖", n: "十二种动物的纪年体系" }
      - { t: "鸡", p: "jī", m: "鸡", n: "生肖第十位" }
