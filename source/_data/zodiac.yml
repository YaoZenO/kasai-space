        a: "不是。2007 年是丁亥，按天干属火、按纳音属土。真正的金猪年是 1911、1971 和 2031 年。当年预测的「金猪宝宝潮」也没有出现——大陆出生人数只增长 0.6%，属正常年度波动。"
      - q: "猪为什么代表富足？"
        a: "猪是最早被驯化的家畜之一，家里有猪意味着有余粮，考古证据可追溯到约九千年前。汉语里「猪」字本身不是骂人的话，贬义只出现在少数复合词里。"
    culture: '<h2>猪与富足</h2><p>在十二生肖里，猪首先代表富足：家中有猪，就是家中有余粮。新石器时代的考古遗址里，猪骨是最常见的家畜遗存之一，驯化史可追溯到约九千年前。贬义集中在少数复合词里，词典给「猪」列的是动物和生肖义项，没有粗俗义。</p><h2>2007 年的「金猪年」传闻</h2><p>2006 年底起，各地报纸预热「六十年一遇的金猪年」，预测的生育高峰最终没有出现：大陆出生人数增长 0.6%，在正常波动范围内。真正有数据支撑的生肖生育效应属于龙年——而研究显示，龙年孩子的学业优势在计入父母期待后就消失了。1911 年的辛亥年，就是终结清朝的辛亥革命。前一位是<a class="z-link" href="/zodiac/dog/">狗年</a>，下一个轮回从<a class="z-link" href="/zodiac/rat/">鼠年</a>开始。</p>'
