        a: "戊申组合六十年一轮：上一个土猴年是 1968 年，下一个要等到 2088 年。"
      - q: "猴在渡河比赛的传说里怎么过的河？"
        a: "常见版本里，鸡找来木筏，羊和猴把木筏抬下水并清理障碍，猴因此得了第九名。故事体现的是合作与机灵。"
      - q: "属猴的人传统上被形容成什么样？"
        a: "聪明、机智、好奇、善交际、适应力强，也可能被形容冲动或固执。"
    culture: '<h2>孙悟空与《西游记》</h2><p>中国文学里最著名的猴是《西游记》的美猴王孙悟空——机智、叛逆、本领高强。他的人气让猴的形象在故事、戏曲、动画和大众文化里格外醒目，也让「机灵」成了这个属相最常用的注脚。</p><h2>渡河比赛里的合作者</h2><p>生肖排位的渡河传说中，猴与鸡、羊合作：鸡找到木筏，羊和猴抬筏、清障，猴最终得了第九。属猴的名人例子常提到各领域的创作者与策略家。前一位是<a class="z-link" href="/zodiac/goat/">羊年</a>，后一位是<a class="z-link" href="/zodiac/rooster/">鸡年</a>。</p>'

