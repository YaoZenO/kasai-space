        a: "癸卯组合六十年一轮：上一个水兔年是 1963 年，下一个要等到 2083 年。"
      - q: "兔为什么和月亮联系在一起？"
        a: "源自玉兔的传说：玉兔在月宫桂树下捣制仙药，陪伴嫦娥。中秋节的泥塑兔儿爷、兔子灯都从这个意象来。"
