        a: "三种译法都通行，因为汉语「羊」泛指山羊、绵羊和公羊。Goat 是目前最常见的英文译法。"
      - q: "羊为什么和吉祥联系在一起？"
        a: "「羊」与「祥」古音相近，「美」「善」等含美好义的字也从「羊」得义。广州别称「羊城」，源自五羊衔谷而来的传说。"

