    faq:
      - q: "2032 年的鼠年从哪天开始？"
        a: "2032 年 2 月 11 日，也就是春节当天；到 2033 年 1 月 30 日结束。"
      - q: "水鼠年多少年出现一次？"
        a: "壬子组合六十年一轮：1972 年之后是 2032 年，下一次要等到 2092 年。"
      - q: "为什么鼠排在十二生肖第一位？"
        a: "因为它对应十二地支的第一位「子」。干支记日在商代甲骨文里已经使用，十二种动物是后来配上去的；「赛跑抢第一」的故事是后世附会的解释。"
      - q: "1 月底 2 月初出生的人怎么定属相？"
        a: "以春节为界。2032 年立春（2 月 4 日）在春节（2 月 11 日）之前，2 月 4 日至 10 日出生的人按八字算法已属鼠，按通行算法仍属猪。"
    culture: '<h2>汉语里的鼠</h2><p>「鼠」是生肖与书面语用字，日常口语多说「老鼠」，方言里还有「耗子」——后者源自明代一种补贴粮损的税目「鼠耗」。与鼠有关的成语多带贬义，但也有例外：《庄子》里的「偃鼠饮河」说的是所需极少。地支「子」与「孩子」的「子」同字，因此鼠配瓜、瓜多籽的图案寓意「多子」。</p><h2>为什么排第一</h2><p>地支的顺序比动物名单更古老。湖北睡虎地一座公元前 217 年的秦墓竹简上，地支与动物的对照表已经很像今天的生肖，但马的位置上是鹿，鼠的位置当时已经固定。莫扎特常被列属鼠，但他生于 1756 年 1 月 27 日，那年的鼠年要到 1 月 31 日才开始——按两种算法他都属<a class="z-link" href="/zodiac/pig/">猪年</a>。</p>'

