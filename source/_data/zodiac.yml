        title: "什么是马年"
        years: true
        body: '<p>马年每十二年一轮，从 1954 年起依次为 1966、1978、1990、2002、2014、2026。眼下的马年是 2026 年：从 2026 年 2 月 17 日的春节开始，到 2027 年 2 月 5 日结束，干支写作丙午，按天干五行属火，所以也称火马年。同一个干支组合六十年出现一次，上一个丙午年是 1966 年，下一个要等到 2086 年。属马的人在马年过本命年。</p>'
      - id: "word"
        title: "「马」字怎么写"
        body: '<p>「马」是象形字的经典例子：古老的甲骨文画出马的侧面，突出鬃毛与有力的四肢；繁体「馬」保留了这个轮廓，简体「马」为书写方便作了简化，简体三画。</p>'
      - id: "language"
        title: "汉语里的马"
        body: '<p>「马」既是属相也是坐骑：马路、马桶、马上——「马上」用的是「立刻」的意思，与马的速度有关。与马有关的成语多讲顺利与精神：马到成功、一马当先、龙马精神。</p>'
      - id: "meaning"
        title: "马的寓意"
        body: '<p>马象征自由、热情和无穷活力。传说周穆王有八匹骏马，一日可行千里，马与耐力、速度的联系由此深入人心。属马的人常被形容精力充沛、独立自主，也可能被形容缺乏耐心；这类说法属民间流传，并无统一出处。</p>'
      - id: "tales"
        title: "与马有关的传统和传说"
        body: '<p>徐悲鸿画马，画的是奔腾与风骨；昭陵六骏刻的是唐太宗的六匹战马，每一匹对应一场开国战役——马在中国文化里从来不只是坐骑，也是功业与速度的见证。</p><p>属马的人在马年过本命年。民间传统认为本命年运势起伏，常见的化解办法是穿戴红色衣物或饰物——红内衣、红腰带、红绳，各地讲究不一。</p>'
      - id: "vocab"
        title: "马年相关词汇"
        body: '<p>下面这些词能帮你谈论马年、生肖与相关成语。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>马年讲的是行动：从甲骨文里的马形，到「马到成功」的祝愿，再到本命年的一袭红。下一个马年从 2038 年 2 月 4 日开始。</p>'
    figures:
      - section: "meaning"
        layout: "inline"
