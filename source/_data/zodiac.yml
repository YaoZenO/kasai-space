      - q: "2026 年的马年从哪天开始？"
        a: "2026 年 2 月 17 日的春节当天开始，到 2027 年 2 月 5 日结束。具体日期见本站节假日页。"
      - q: "火马年多少年出现一次？"
        a: "丙午组合六十年一轮：上一个火马年是 1966 年，下一个要等到 2086 年。"
      - q: "1990 年出生的是什么马？"
        a: "庚午金马。天干每十年换一个五行，所以 1990、2002（壬午水马）、2014（甲午木马）各有不同的五行称号。"
      - q: "属马的幸运数字和颜色有什么说法？"
        a: "民间说法里 2、3、7 为吉数，1、6 宜避；红、紫、粉、橙与属火的绿色为幸运色，黑、灰宜避。这类说法各来源不一，只作参考。"

  # ============ 8 羊 ============
  - key: "goat"
    animal: "羊"
    pinyin: "yáng"
    english: "Goat"
    featured: 2027
    intro: "羊是十二生肖的第八位，对应十二地支的「未」。羊在中国文化里与吉祥同源，也是最温和的属相之一。"
    luck:
      numbers: "3 · 7"
      avoidNumbers: "4"
      colors: "绿、粉、紫"
      avoidColors: ""
      flowers: "康乃馨、报春花"
      directions: "北、西北"
      avoidDirections: ""
      note: "民间流行说法，各来源互有出入，只作参考。"
    sections:
      - id: "what"
        title: "什么是羊年"
        years: true
        body: '<p>羊年每十二年一轮，从 1955 年起依次为 1967、1979、1991、2003、2015、2027。眼下的羊年是 2027 年：从 2027 年 2 月 6 日的春节开始，到 2028 年 1 月 25 日结束，干支写作丁未，按天干五行属火，所以也称火羊年。上一个丁未年是 1967 年，下一个要等到 2087 年。</p>'
      - id: "word"
        title: "「羊」字怎么写"
        body: '<p>「羊」是象形字，古字形像羊头，突出向下弯的羊角——与向上弯的「牛」正好相反；简体与繁体同形，共六画。这个字是多个美好字的来源：「美」是羊大，「祥」古音与羊近，「善」也从羊得义。</p>'
      - id: "language"
        title: "是山羊、绵羊还是公羊"
        body: '<p>汉语的「羊」按语境可以指山羊、绵羊或公羊，所以羊年有时被译作 Year of the Goat、Year of the Sheep 或 Year of the Ram。Goat 是目前最常见的英文译法。想说得更具体，可以用「山羊」（shānyáng）或「绵羊」（miányáng）。</p>'
      - id: "meaning"
        title: "羊的寓意"
        body: '<p>羊与「祥」古音相近，「美」「善」也从羊得义——羊在中国象征思维里与美好、吉祥绑定。羊又是最早被驯化的动物之一，与富足、滋养的联系很强。属羊的人常被形容温和、有创造力，也可能被形容敏感、犹豫；这类说法属民间流传，并无统一出处。</p><p>羊在生肖里排第八，而「八」在中国数字文化里格外吉利，这也让羊年多了一层讨喜。</p>'
      - id: "tales"
        title: "与羊有关的传统和传说"
        body: '<h3>汉代的「送羊」</h3><p>汉代黄河流域有一种「送羊」习俗：舅家在农历六月或七月给外甥送羊，与沉香救母的故事相连——送羊是象征性的举动，与孝道和追思绑定。</p><h3>藏族羊日</h3><p>青海一些藏族聚居区，每个农历月的初六和初九是羊日。羊提供奶、奶酪和酸奶，是生活必需品；这些日子里按传统不捕捉羊。</p><h3>西部与内蒙古</h3><p>在新疆、内蒙古的哈萨克族、蒙古族群体里，与羊有关的马上游戏是节庆生活的一部分，集骑术、竞技与庆祝于一体。</p><h3>广州羊城</h3><p>广州别称「羊城」，源自五羊传说：五位仙人骑羊而来，给百姓带来谷穗度过饥荒，走后五羊化为石头。越秀公园的五羊雕像至今是这座城市的地标。</p>'
      - id: "famous"
        title: "属羊的名人"
        body: '<p>常被提到的属羊名人有史蒂夫·乔布斯（1955）和章子怡（1979）。</p>'
      - id: "vocab"
        title: "羊年相关词汇"
        body: '<p>下面这些词能帮你谈论羊年、生肖与相关寓意。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>羊年讲的不是柔弱：从「美」「祥」「善」的字源，到五羊衔谷的传说，再到各地与羊有关的节俗。下一个羊年从 2039 年 2 月 19 日开始。</p>'
    vocab:
      - { t: "羊", p: "yáng", m: "山羊、绵羊、公羊的统称", n: "具体所指看语境" }
      - { t: "羊年", p: "yángnián", m: "羊年", n: "英文也译 Year of the Sheep / Ram" }
      - { t: "属羊", p: "shǔ yáng", m: "属相是羊", n: "" }
      - { t: "山羊", p: "shānyáng", m: "山羊", n: "" }
      - { t: "绵羊", p: "miányáng", m: "绵羊", n: "" }
      - { t: "火羊", p: "huǒ yáng", m: "火羊", n: "2027 年的干支丁未" }
      - { t: "丁未", p: "dīngwèi", m: "丁未年", n: "2027 年的传统纪年" }
      - { t: "美", p: "měi", m: "美丽", n: "从「羊」得义的字" }
