    culture: '<h2>牛与传统农耕</h2><p>牛是最早被驯化的动物之一，在农耕、运输和乡村生活里长期承担主要劳力，因此传统上象征勤劳、可靠和默默奉献。现代汉语里的「你很牛」是一句常见夸奖，字面直译成英文会闹笑话，意思其实是「你真厉害」。</p><h2>大赛跑与屈居第二的牛</h2><p>解释生肖顺序最著名的传说是玉皇大帝召集的渡河比赛：老鼠趁牛不备跳到了前面，牛屈居第二。故事当然是附会，却解释了顺序，也把「踏实却输给机灵」的意象留在了语汇里。前一位是<a class="z-link" href="/zodiac/rat/">鼠年</a>，后一位是<a class="z-link" href="/zodiac/tiger/">虎年</a>。</p>'

