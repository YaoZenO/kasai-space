# 生肖数据 —— /zodiac/ 页面族（/zodiac/<动物>/）的唯一数据源
#
# 2026-10-25 重构（主人反馈）：页面从「某一年专页」改为「生肖主题页」——
#   标题只写生肖名（「鼠年」），内容讲生肖本身；删除性格优缺点板块；
#   每页 8-9 节：是什么 / 汉字 / 用词 / 寓意 / 传统与传说 / 名人 / 词汇 / 常见问题 / 结语。
#   目录由 JS 从 sections 的标题自动生成（见 zodiac.ejs / source/js/zodiac.js），
#   这里不维护目录列表——sections 的顺序就是目录顺序。
#
# 结构：meta（春节日期表 / 五行对应 / 配图授权 / 索引页文案）+ animals[]
# 纪律（与 holidays.yml 相同，违反任何一个都有对应的测试断言）：
#   1. 日期一律写成带引号的 "YYYY-MM-DD"。不加引号时 js-yaml 会解析成 Date 对象（E-028）。
#   2. 中文长文案一律写单行，不用折叠标量 —— 折行处会被插进空格（E-042）。
#      含 HTML 的正文用单引号 YAML 字符串整行书写，换行只允许出现在标签之间。
#   3. 页面上的每一个日期由 helper 从 featured 与 meta.springFestival 算出，模板不含手写日期。
#   4. featured = 该生肖本轮对应的公历年份（2021-2032，与节假日页年份范围衔接）。
#   5. 幸运数字/颜色只录有出处的民间说法；没有的一律留空，页面自动少渲染一行，
#      并显示「各来源说法不一」的说明——不为了填满版面编数据。
#   6. 配图授权走 Wikimedia Commons（作者 / 授权 / 原文件页三要素齐全，与节假日页同律），
#      测试锁死；源站图片是其自有上传，不复制。
#
# 正文配图 figures（2026-11-11 新增，见 ZODIAC-IMAGERY-PLAN-2026-11-11.md）：
#   1. figures 与 sections 平级，挂在 animals[] 下；每条必须带 section/layout/file/alt/caption/author/license/page。
#   2. section 必须是该页 sections[].id 之一——写错构建不报错、图不出现，由测试兜底。
#   3. layout 只允许 inline（章节内右浮）/ band（章节后图集带）两个值，其它值测试判红。
#   4. author/license/page 与 alt/caption 缺一不可，与 meta.images 同律；file 一律 /img/zodiac/<slug>.jpg。

meta:
  updated: "2026-10-25"
  # 索引页引导段（单行）
  lede: "十二生肖以十二年为一个周期，从鼠到猪，春节当天更替。每个生肖还有干支与五行的称号——同一个生肖十二年回来一次，同一个干支组合要六十年才再现。本页汇总十二生肖的年份对照、五行对应与传统配对；点右侧生肖或下方表格，进入对应的生肖页。"
  # 春节（农历正月初一）公历日期，2021-2033。生肖年从当天起算、到次年春节前一天止。
  # 2033 是最后一个生肖 featured 年（2032 鼠年）的结束边界，必须比数据里任何一个 featured 年份多一年。
  springFestival:
    "2021": "2021-02-12"
    "2022": "2022-02-01"
    "2023": "2023-01-22"
    "2024": "2024-02-10"
    "2025": "2025-01-28"
    "2026": "2026-02-17"
    "2027": "2027-02-06"
    "2028": "2028-01-26"
    "2029": "2029-02-13"
    "2030": "2030-02-03"
    "2031": "2031-01-23"
    "2032": "2032-02-11"
    "2033": "2033-01-31"
  # 五行与传统方位、颜色的对应（《黄帝内经》以来的传统说法，非命理吉凶）
  elements:
    - element: "木"
      stems: "甲 · 乙"
      direction: "东"
      color: "青、绿"
    - element: "火"
      stems: "丙 · 丁"
      direction: "南"
      color: "赤、红"
    - element: "土"
      stems: "戊 · 己"
      direction: "中"
      color: "黄"
    - element: "金"
      stems: "庚 · 辛"
      direction: "西"
      color: "白"
    - element: "水"
      stems: "壬 · 癸"
      direction: "北"
      color: "黑"
  # 索引页正文（单行，换行只出现在标签之间）
  prose: '<h2>生肖是什么</h2><p>生肖以十二年为一个周期，每一年对应一种动物，固定顺序为鼠、牛、虎、兔、龙、蛇、马、羊、猴、鸡、狗、猪。春节一到，生肖就换一位。出生年份的属相是中国人寒暄里最常问的问题之一——问「你属什么」，不用直接问年龄就能大致推算出对方的岁数。</p><h2>为什么一入春节就换属相</h2><p>生肖年按农历划分，不从 1 月 1 日算起。国家标准 GB/T 33661-2017《农历的编算和颁行》规定，生肖年自农历正月初一起始、至次年除夕结束。另有一种从立春（2 月 4 日或 5 日）起算的算法，属于四柱八字的命理体系，只在排八字时使用。两种算法只影响 1 月下旬到 2 月上旬出生的人，且两个日期谁先谁后每年不一样，所以年初出生的人需要核对出生当年的春节日期。</p><h2>六十年周期的由来</h2><p>十个天干与十二个地支配对，组成六十甲子，六十年循环一次。生肖对应地支，每十二年轮回；五行对应天干，每十年一轮。两者叠起来，才有了「火马」「水鼠」这样的区分——同一个生肖每十二年回来一次，同一个干支组合要六十年才再现。</p>'
  faq:
    - q: "2026 年是什么生肖年？"
      a: "丙午火马年，从 2026 年 2 月 17 日的春节开始，到 2027 年 2 月 5 日结束。"
    - q: "生肖年从春节还是立春算起？"
      a: "通行算法以春节（正月初一）为界，国家标准 GB/T 33661-2017 也是这样规定的；立春起算法属于四柱八字命理，只在排八字时用。只影响 1 月下旬到 2 月上旬出生的人。"
    - q: "为什么同一个马年有火马、金马之分？"
      a: "天干每十年配一个五行，地支每十二年配一个生肖。2026 年的天干是丙（属火），地支是午（属马），合称丙午，所以是火马；上一个丙午年是 1966 年，下一个要等到 2086 年。"
    - q: "本命年是什么意思？"
      a: "生肖与出生那年相同的农历年，每十二年一次。民间传统认为本命年运势起伏，常见的化解办法是穿戴红色衣物或饰物。"
    - q: "页面上的性格描述是传统说法吗？"
      a: "是民间流传的概括，各来源措辞相近但并无统一出处；古典命理看的是整张命盘，不以生肖一句定论。当作文化话题看即可。"
  # 配图：Wikimedia Commons 自由授权图，键为生肖 slug（模板按动物取用）。
  # 三要素（作者 / 授权 / 原文件页）任何一样缺失，测试直接判失败——
  # 那是 CC 授权的前提条件，少了图就成了无授权使用。
  # 12 张均为洛杉矶县立艺术博物馆（LACMA）藏元代陶俑「十二生肖俑」套组
  # （M.90.80a-l）的藏品照片，公有领域。整套同源，视觉才统一。
