      - id: "word"
        title: "「狗」字怎么写"
        body: '<p>「狗」是形声字：左边「犭」（犬旁）表明属于兽类，右边「句」提示读音；简体与繁体同形，共八画。狗在古代还有别称：「犬」是书面统称，「戌狗」取地支对应。</p>'
      - id: "language"
        title: "汉语里的狗"
        body: '<p>「狗」是日常用字，「犬」多用于书面与合成词：犬齿、猎犬、警犬。与狗有关的成语多带贬义——「狗腿子」指帮凶，「走狗」指爪牙——这与属相文化是两回事：生肖里的狗是忠诚的象征，骂人话里的狗是另一套语汇。</p>'
      - id: "meaning"
        title: "狗的寓意"
        body: '<p>狗象征忠诚、诚实与保护欲。狗是人类最早驯化的动物之一，长司看家护院，因此传统上属狗的人常被形容可靠、真诚，也可能被形容爱评判他人或悲观；这类说法属民间流传，并无统一出处。</p>'
      - id: "tales"
        title: "与狗有关的传统和传说"
        body: '<p>解释狗排位的传说是：赴玉皇大帝的宴席路上，狗先下河洗了个澡，赶到时已经有十种动物先到，只拿到第十一位。故事给勤快的形象添了一层自嘲式的解释。</p><p>民俗里，狗看家护院，也被认为能辟邪——旧时门槛上贴「天狗食月」的禳解话、门楣挂桃符，都借狗性镇宅。这些今天多留在俗语里。</p>'
      - id: "vocab"
        title: "狗年相关词汇"
        body: '<p>下面这些词能帮你谈论狗年、生肖与相关语汇。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>狗年讲的是忠诚：从迟到一步的传说，到看家护院的本分，再到语汇里两套并存的形象。下一个狗年从 2042 年 2 月 10 日开始。</p>'
    vocab:
      - { t: "狗", p: "gǒu", m: "狗", n: "生肖第十一位" }
      - { t: "狗年", p: "gǒunián", m: "狗年", n: "" }
      - { t: "属狗", p: "shǔ gǒu", m: "属相是狗", n: "" }
      - { t: "庚戌", p: "gēngxū", m: "庚戌年", n: "2030 年的干支，金狗" }
      - { t: "犬", p: "quǎn", m: "狗（书面）", n: "多用于合成词" }
      - { t: "戌狗", p: "xūgǒu", m: "地支与生肖的对应说法", n: "戌对狗" }
      - { t: "忠诚", p: "zhōngchéng", m: "忠诚", n: "属狗人的核心形容" }
      - { t: "诚实", p: "chéngshí", m: "诚实", n: "" }
      - { t: "天狗食月", p: "tiāngǒu shí yuè", m: "月食的旧称", n: "民间敲盆救月之俗" }
      - { t: "看家", p: "kānjiā", m: "看守门户", n: "狗的本分" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
    faq:
      - q: "2030 年的狗年从哪天开始？"
        a: "2030 年 2 月 3 日的春节当天开始，到 2031 年 1 月 22 日结束。"
      - q: "金狗年多少年出现一次？"
        a: "庚戌组合六十年一轮：上一个金狗年是 1970 年，下一个要等到 2090 年。"
      - q: "狗为什么排在第十一位？"
        a: "渡河比赛的传说里，狗在路上先去河里洗了个澡，赶到时已经有十种动物先到，于是排第十一。"
      - q: "属狗的人传统上被形容成什么样？"
        a: "忠诚、诚实、有保护欲、可靠，也可能被形容爱评判他人或悲观。"

  # ============ 12 猪 ============
  - key: "pig"
    animal: "猪"
    pinyin: "zhū"
    english: "Pig"
    featured: 2031
    intro: "猪是十二生肖的第十二位，对应十二地支的「亥」。猪在中国文化里首先代表富足，是十二生肖的收尾与轮回起点。"
    luck:
      numbers: ""
      avoidNumbers: ""
      colors: ""
      avoidColors: ""
      flowers: ""
      directions: ""
      avoidDirections: ""
      note: "流行页面上的幸运数字与颜色互相矛盾，本站不列——可考的是谐音与红色民俗，见正文。"
    sections:
      - id: "what"
        title: "什么是猪年"
        years: true
        body: '<p>猪年每十二年一轮，从 1959 年起依次为 1971、1983、1995、2007、2019、2031。眼下的猪年是 2031 年：从 2031 年 1 月 23 日的春节开始，到 2032 年 2 月 10 日结束，干支写作辛亥，按天干五行属金，所以也称金猪年。辛亥年在天干与纳音两种算法下都属金，是少有一致的年份；上一个辛亥年是 1971 年——1911 年的辛亥年，就是终结清朝的辛亥革命。</p>'
      - id: "word"
        title: "「猪」字怎么写"
        body: '<p>「猪」是形声字，左边「豕」（shǐ，猪的古字）表明义类，右边「者」提示读音；简体十一画，繁体作「豬」。「家」字是「宀」下加「豕」——屋里有猪，才算人家，这个字形本身就是农业社会给猪的地位作证。</p>'
      - id: "language"
        title: "汉语里的猪"
        body: '<p>「猪」本身不是骂人的话：词典给「猪」列的是动物和生肖义项，没有粗俗义，「我属猪」是任何场合都能用的中性自我介绍。贬义集中在少数复合词里——「猪脑子」说反应慢，亲近朋友之间是玩笑，对别人说就很失礼；「猪队友」说让你输掉比赛的同伴，由网络游戏传开，现在也用于办公室调侃。</p><p>《西游记》里的猪徒弟猪八戒，让「二师兄」成了猪的流行代称——2019 年猪肉价格大涨时，媒体就用「二师兄」指代猪。</p>'
      - id: "meaning"
        title: "猪的寓意"
        body: '<p>在十二生肖里，猪首先代表富足：家中有猪，就是家中有余粮。新石器时代的考古遗址里，猪骨是最常见的家畜遗存之一，驯化史可追溯到约九千年前。属猪的人常被形容慷慨、真诚、脾气好，也可能被形容太容易相信别人；这类说法属民间流传，并无统一出处。</p>'
      - id: "tales"
        title: "与猪有关的传统和传说"
        body: '<h3>并不存在的「金猪年」</h3><p>2006 年底起，各地报纸预热「六十年一遇的金猪年」，预测的生育高峰最终没有出现：2007 年大陆出生人数增长 0.6%，在正常波动范围内。2007 年是丁亥，按天干属火、按纳音属土；真正的金猪年是 1911、1971 和 2031 年。有数据支撑的生肖生育效应属于龙年——而研究显示，龙年孩子的学业优势在计入父母期待后就消失了。</p><h3>为什么猪排最后</h3><p>渡河比赛的传说里，猪吃饱了走不动，殿后过了河，于是排在第十二位。故事给「有福」的形象配了个懒洋洋的注脚。</p>'
      - id: "vocab"
        title: "猪年相关词汇"
        body: '<p>下面这些词能帮你谈论猪年、生肖与相关语汇。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>猪年是轮回的收尾：从「家」字里的那口猪，到一场没等来的生育高峰，再到 2031 年的辛亥金猪。下一个猪年过完，十二生肖又从<a class="z-link" href="/zodiac/rat/">鼠年</a>重新开始。</p>'
    vocab:
      - { t: "猪 / 豬", p: "zhū", m: "猪", n: "简体与繁体" }
      - { t: "猪年", p: "zhūnián", m: "猪年", n: "生肖第十二位" }
      - { t: "属猪", p: "shǔ zhū", m: "属相是猪", n: "" }
      - { t: "天干地支", p: "tiāngān dìzhī", m: "天干地支", n: "干支纪年" }
      - { t: "亥", p: "hài", m: "第十二个地支", n: "对应猪" }
      - { t: "辛亥", p: "xīnhài", m: "辛亥年", n: "2031 年的干支，金猪" }
      - { t: "豕", p: "shǐ", m: "猪（古字）", n: "「家」字从豕" }
      - { t: "纳音", p: "nàyīn", m: "纳音五行体系", n: "与天干算法并存的古说" }
      - { t: "辛亥革命", p: "Xīnhài Gémìng", m: "辛亥革命", n: "1911 年，农历辛亥年" }
      - { t: "我属猪", p: "wǒ shǔ zhū", m: "我属猪", n: "中性自我介绍" }
      - { t: "二师兄", p: "èr shīxiōng", m: "二师兄（猪八戒）", n: "《西游记》里的猪徒弟" }
      - { t: "猪队友", p: "zhū duìyǒu", m: "让你输掉比赛的同伴", n: "由网络游戏传开" }
      - { t: "鲁鱼亥豕", p: "lǔ yú hài shǐ", m: "字形相近造成的错误", n: "成语" }
      - { t: "一龙一猪", p: "yī lóng yī zhū", m: "起点相同，结果天差地别", n: "成语" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
    faq:
      - q: "2031 年的猪年从哪天开始？"
        a: "2031 年 1 月 23 日的春节当天开始，到 2032 年 2 月 10 日结束。"
      - q: "金猪年多少年出现一次？"
        a: "辛亥组合六十年一轮：1911、1971 年之后是 2031 年。辛亥年在天干与纳音两种算法下都属金，是少有一致的年份。"
      - q: "2007 年真的是「金猪年」吗？"
        a: "不是。2007 年是丁亥，按天干属火、按纳音属土。真正的金猪年是 1911、1971 和 2031 年。当年预测的「金猪宝宝潮」也没有出现——大陆出生人数只增长 0.6%，属正常波动。"
      - q: "猪为什么代表富足？"
        a: "猪是最早被驯化的家畜之一，家里有猪意味着有余粮，考古证据可追溯到约九千年前。汉语里「猪」字本身不是骂人的话，贬义只出现在少数复合词里。"
