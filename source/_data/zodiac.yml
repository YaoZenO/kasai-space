    culture: '<h2>迟到一步的传说</h2><p>解释狗排位的传说是：赴玉皇大帝的宴席路上，狗先下河洗了个澡，结果迟到了，只拿到第十一位。故事给狗的勤快形象添了一层自嘲式的解释。</p><h2>忠诚的象征</h2><p>狗在人类生活中长司看家护院，因此传统上象征忠诚、诚实与保护欲——属狗的人常被形容为可靠的朋友和细致的观察者。前一位是<a class="z-link" href="/zodiac/rooster/">鸡年</a>，后一位是<a class="z-link" href="/zodiac/pig/">猪年</a>。</p>'

