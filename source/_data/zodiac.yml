        alt: "唐韩幹《照夜白图》，唐玄宗名马奋蹄昂首"
        caption: "唐韩幹《照夜白图》：唐玄宗的名马照夜白奋蹄欲脱——马与自由、速度的联系，从此有了最著名的一个形象，大都会艺术博物馆藏。"
        author: "韩幹（唐）"
        license: "CC0"
        page: "https://commons.wikimedia.org/wiki/File:唐_韓幹_照夜白圖_卷-Night-Shining_White_MET_DP153679.jpg"
      - section: "tales"
