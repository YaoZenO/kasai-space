    culture: '<h2>中国文化里的虎</h2><p>虎在艺术、建筑和民间故事里随处可见。道教视其为驱邪的正义使者；中医古籍里有虎骨入药的记载，那是旧时代的做法，今天虎是保护动物，偷猎和交易属于违法。成语「骑虎难下」说的是一旦开始就很难停下来。</p><h2>属虎的名人</h2><p>常被提到的虎年名人有英国女王伊丽莎白二世、玛丽莲·梦露、菲德尔·卡斯特罗和短跑选手尤塞恩·博尔特。前一位是<a class="z-link" href="/zodiac/ox/">牛年</a>，后一位是<a class="z-link" href="/zodiac/rabbit/">兔年</a>。</p>'

