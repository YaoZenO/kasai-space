        a: "不是。龙是十二生肖中唯一的神话生物，其余十一种都是真实动物。"

  # ============ 6 蛇 ============
  - key: "snake"
    animal: "蛇"
    pinyin: "shé"
    english: "Snake"
    featured: 2025
    intro: "蛇是十二生肖的第六位，对应十二地支的「巳」。蛇在中国文化里是智慧与蜕变的象征，也是龙形象的原型候选。"
    luck:
      numbers: "2 · 8 · 9"
      avoidNumbers: "1 · 6 · 7"
      colors: "红、黑、浅黄"
      avoidColors: "白、金、棕"
      flowers: "兰花、仙人掌"
      directions: "东北、西南、南"
      avoidDirections: ""
      note: "民间流行说法，各来源互有出入，只作参考。"
    sections:
      - id: "what"
        title: "什么是蛇年"
        years: true
        body: '<p>蛇年每十二年一轮，从 1953 年起依次为 1965、1977、1989、2001、2013、2025。眼下的蛇年是 2025 年：从 2025 年 1 月 28 日的春节开始，到 2026 年 2 月 16 日结束，干支写作乙巳，按天干五行属木，所以也称木蛇年。上一个乙巳年是 1965 年，下一个要等到 2085 年。</p>'
      - id: "word"
        title: "「蛇」字怎么写"
        body: '<p>「蛇」是形声字：左边「虫」部表明属于虫蛇一类，右边「它」提示读音；简体与繁体同形，共十一画。蛇在古代还有别称：「小龙」取其灵异，「长虫」则是北方口语。</p>'
      - id: "language"
        title: "汉语里的蛇"
        body: '<p>「蛇」是生肖与书面用字。与蛇有关的成语讲的多是机灵与变幻莫测：「打草惊蛇」说惊动了对方，「画蛇添足」说多此一举。英文的 Year of the Snake 是通行译法。</p>'
      - id: "meaning"
        title: "蛇的寓意"
        body: '<p>蛇象征智慧、直觉与蜕变——蛇定期蜕去旧皮，因此蛇年常与转变、内省、告别旧习惯联系在一起。属蛇的人常被形容沉稳从容、思维敏锐，也可能被形容多疑、行事隐秘；这类说法属民间流传，并无统一出处。</p><h3>小龙</h3><p>传统艺术和民间传说常把蛇视为「小龙」，不少研究者认为想象中的龙以蛇为原型——龙的身形里能看到蛇的影子。</p>'
      - id: "tales"
        title: "与蛇有关的传统和传说"
        body: '<p>中国神话里最著名的蛇身形象是女娲——人首蛇身，用黄泥土造人。《白蛇传》讲蛇精与凡人的爱情，主题是因爱与牺牲而蜕变。在传统艺术里，蛇也是财宝与智慧的守护者，象征优雅与神秘。</p>'
      - id: "famous"
        title: "属蛇的名人"
        body: '<p>常被提到的蛇年名人有歌手泰勒·斯威夫特（1989）、圣雄甘地（1869）和作家 J·K·罗琳（1965）。</p>'
      - id: "vocab"
        title: "蛇年相关词汇"
        body: '<p>下面这些词能帮你谈论蛇年、生肖与相关成语。</p>'
      - id: "faq"
        title: "常见问题"
        body: ""
      - id: "end"
        title: "结语"
        body: '<p>蛇年讲的是蜕变：从女娲的神话到白蛇传的爱情，从「小龙」的别称到蜕皮的意象。下一个蛇年从 2037 年 2 月 15 日开始。</p>'
    vocab:
      - { t: "蛇", p: "shé", m: "蛇", n: "生肖第六位" }
      - { t: "蛇年", p: "shénián", m: "蛇年", n: "" }
