      - { t: "乙巳", p: "yǐsì", m: "乙巳年", n: "2025 年的传统纪年" }
      - { t: "小龙", p: "xiǎolóng", m: "蛇的别称", n: "取其灵异" }
      - { t: "长虫", p: "chángchóng", m: "蛇（北方口语）", n: "" }
      - { t: "打草惊蛇", p: "dǎ cǎo jīng shé", m: "惊动了对方", n: "成语" }
      - { t: "画蛇添足", p: "huà shé tiān zú", m: "多此一举", n: "成语" }
      - { t: "女娲", p: "Nǚwā", m: "人首蛇身的创世女神", n: "用黄泥造人" }
      - { t: "白蛇传", p: "Bái Shé Zhuàn", m: "蛇精与凡人的爱情故事", n: "民间传说" }
      - { t: "本命年", p: "běnmìngnián", m: "生肖与出生年相同之年", n: "每 12 年一次" }
    faq:
      - q: "2025 年的蛇年从哪天开始？"
        a: "2025 年 1 月 28 日的春节当天开始，到 2026 年 2 月 16 日结束。"
      - q: "木蛇年多少年出现一次？"
        a: "乙巳组合六十年一轮：上一个木蛇年是 1965 年，下一个要等到 2085 年。"
      - q: "「蛇」字是怎么构成的？"
        a: "左边是「虫」部，表明属于虫蛇一类；右边是「它」，提示读音。全字十一画，简体与繁体同形。"
      - q: "蛇为什么又叫「小龙」？"
        a: "传统艺术和民间传说常把蛇视为「小龙」，不少研究者认为想象中的龙以蛇为原型。"

  # ============ 7 马 ============
