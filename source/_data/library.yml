  # ============ 专题四：城市排行榜 ============
  # 页面在 /cityrank/（数据驱动生成，不在 /library/ 下）；
  # 名次由 cities.yml 的数据现算，yml 里不存名次（CITY-RANK-PRD §5.1 P0 铁律）。
  - key: "cityrank"
    title: "城市排行榜"
    kicker: "CITY RANK"
    desc: "城市榜单：本站计算的榜单指标与权重写在榜页上，名次由公开统计数据算出，可以自己复算；暂无权威标准的榜单列为参考榜。"
    link: "/cityrank/"
    linkText: "进入城市排行榜"
    entries:
      - { name: "中国十大经济强市", note: "按 2025 年地区生产总值计算", link: "/cityrank/jingji-qiangshi/" }
      - { name: "中国人口大市", note: "按 2025 年末常住人口计算", link: "/cityrank/renkou-dashi/" }

  # ============ 专题五：城市档案 ============
  # 与「城市排行榜」并列，不是它的子级（2026-11-04 主人指出：/city/ 的面包屑
  # 原本写成「资料库 / 城市排行榜 / 城市档案」，把城挂在了榜下面）。
  # 榜是榜（名次由数据现算），城是城（逐项标注来源的数值档案），两者互不隶属。
  - key: "city"
    title: "城市档案"
    kicker: "CITY"
    desc: "城市基础数据档案：GDP、人口、财政、气候、面积等字段逐项标注来源与年份；查不到权威来源的字段一律写「待补」，不做估算填充。"
    link: "/city/"
    linkText: "进入城市档案"
    entries:
      - { name: "上海", note: "直辖市", link: "/city/shanghai/" }
      - { name: "北京", note: "直辖市", link: "/city/beijing/" }
      - { name: "深圳", note: "广东省 · 计划单列市", link: "/city/shenzhen/" }

  # ============ 专题六：车牌字母编号 ============
  # 页面在 /plates/（数据驱动生成，不在 /library/ 下）；
  # 数据来源是公安部标准 GA 36-2018 附录 A 表 A.1，逐条转录，不掺民间说法。
  - key: "plates"
    title: "车牌字母编号"
    kicker: "PLATES"
    desc: "中国机动车号牌「省份简称 + 英文字母」的发牌机关代号怎么排：按公安部标准 GA 36-2018 附录 A 整理的各地代号与登记机关对照，直辖市 A 至 Z 全序列、特殊代号与编号规则。"
    link: "/plates/"
    linkText: "进入车牌字母编号探索"
    entries:
      - { name: "编号规则", note: "省会固定 A · 其余按启用顺序", link: "/plates/" }
      - { name: "各省对照表", note: "31 个省级行政区发牌机关代号", link: "/plates/" }
