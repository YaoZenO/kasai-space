      - { name: "中元节", note: "七月十五 · 祭祖放河灯 · 不放假", link: "/library/zhongyuan/" }
      - { name: "重阳节", note: "九月初九 · 登高敬老 · 不放假", link: "/library/chongyang/" }
      - { name: "冬至", note: "12月下旬 · 饺子与汤圆 · 不放假", link: "/library/dongzhi/" }
