# 城市基础数据集 —— 城市排行榜板块的唯一数据源
#
# 纪律（与 holidays.yml / zodiac.yml / library.yml 相同，另见 CITY-RANK-CONTENT §8）：
#   1. 中文长文案一律写单行（E-042）；
#   2. 每个数值字段必须写成 { v, unit, asOf, source } 四元组，缺 unit / asOf / source 任一即不合格；
#   3. 查不到权威来源的字段**不写该键**（页面渲染为 [待补]），严禁填估算值、邻城值、"约"值；
#   4. source 写 sources[] 里的 key，不在这里写长来源名；
#   5. 台湾 / 香港 / 澳门表述统一为「中国台湾地区 / 中国香港 / 中国澳门」，作为省级行政区列出。
#
# 数据状态（2026-10-29）：城市档案以榜单出现过的城市为收录范围，持续补齐，不写死座数；
# GDP / 常住人口 2025 已按各市统计公报交叉核验后入库；气候四字段（1 月 / 7 月气温、降水量、
# 日照时数）取自国家统计局《中国统计年鉴 2025》中国气象局提供的 2024 年实况值；
# 年份以字段级 asOf 为准，其余字段待采集后补，一律不填估算值（CITY-RANK-CONTENT §7 C-1）。

meta:
  updated: "2026-10-31"
  dataYear: "2025"
  note: "本站城市数据以政府统计口径为准，批量数据站只作交叉核对，不作唯一来源；气候类为国家统计局《中国统计年鉴 2025》中国气象局提供的 2024 年实况值，年份以字段 asOf 为准。"

sources:
  - key: "gdp2025"
    name: "各地 2025 年国民经济和社会发展统计公报（经公开 GDP 排行数据交叉核对）"
    asOf: "2025"
  - key: "pop2025"
    name: "各市统计局《2025 年国民经济和社会发展统计公报》发布的 2025 年末常住人口（部分城市依据 2025 年全国 1% 人口抽样调查推算；常住人口口径，含户籍人口与外来常住人口，不等于户籍人口或城区人口；单位万人；逐城来源见 tools/city-metrics-batches/pop-2025-sources.md）"
    asOf: "2025"
  - key: "areaGov"
    name: "各市人民政府网站公开的行政区域面积（如杭州市人民政府 16850 平方公里）"
    asOf: "2025"
  - key: "metro2025"
    name: "交通运输部《2025 年城市轨道交通运营数据速报》（截至 2025-12-31，含地铁、轻轨、单轨、有轨电车）"
    asOf: "2025"
  - key: "dfc2022"
    name: "教育部等公布的第二轮「双一流」建设高校名单（147 所，2022 年公布）"
    asOf: "2022"
  - key: "uni2022"
    name: "教育部全国高等学校名单（本科高校数，2021-09-30 版）"
    asOf: "2022"
  - key: "lat2024"
    name: "中国主要城市国家基本气象站经纬度（Atmosphere 期刊论文 Table 1，36 站）"
    asOf: "2024"
  - key: "port2025"
    name: "交通运输部 2025 年 1—10 月主要内河港口货物吞吐量（沿海大港不计入内河口径）"
    asOf: "2025"
  - key: "areaPub"
    name: "公开行政区划面积资料（核对自公开城市面积排行，标注为约数的按约数收录）"
    asOf: "2025"

  - key: "gdp2025prov"
    name: "各省统计局发布的 2025 年 1—12 月省内各市地区生产总值（浙江见湖州市统计局转载的《省内城市主要经济指标》；江苏、山东见各市统计公报与省内汇总，经两份以上来源交叉核对）"
    asOf: "2025"
  - key: "climateNBS2024"
    name: "国家统计局《中国统计年鉴2025》表 8-4 主要城市平均气温(2024年)、表 8-6 主要城市降水量(2024年)、表 8-7 主要城市日照时数(2024年)，数据由中国气象局提供（2024 年实况值，非多年平均）"
    asOf: "2024"
  - key: "airNBS2024"
    name: "国家统计局《中国统计年鉴2025》表 8-16 主要城市空气质量情况(2024年)：细颗粒物(PM2.5)年平均浓度、空气质量达到或好于二级的天数。原表标注为初步数据，覆盖 31 个主要城市"
    asOf: "2024"
  - key: "areaSD2018"
    name: "山东省统计局《山东统计年鉴2021》表 12-7 各市土地利用情况（2018 年）土地调查面积（公顷换算为平方公里；济南市含 2019 年并入的原莱芜市）"
    asOf: "2018"
  - key: "expressSPB2025"
    name: "国家邮政局《2025 年邮政行业运行情况》快递处理量前 50 位城市情况表（2025 年全年，单位万件；处理量＝快递业务量＋快递投递量）"
    asOf: "2025"
  - key: "scenic5aMCT2025"
    name: "文化和旅游部数据服务「国家5A级旅游景区」名单（数据截止 2025-03-11；按景区所在城市计数，名单标注的跨市景区按涉及城市各计 1 家）"
    asOf: "2025"
