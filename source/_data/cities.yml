# 城市基础数据集 —— 城市排行榜板块的唯一数据源
#
# 纪律（与 holidays.yml / zodiac.yml / library.yml 相同，另见 CITY-RANK-CONTENT §8）：
#   1. 中文长文案一律写单行（E-042）；
#   2. 每个数值字段必须写成 { v, unit, asOf, source } 四元组，缺 unit / asOf / source 任一即不合格；
#   3. 查不到权威来源的字段**不写该键**（页面渲染为 [待补]），严禁填估算值、邻城值、"约"值；
#   4. source 写 sources[] 里的 key，不在这里写长来源名；
#   5. 台湾 / 香港 / 澳门表述统一为「中国台湾地区 / 中国香港 / 中国澳门」，作为省级行政区列出。
#
# 数据状态（2026-10-28）：城市档案以「上榜城市」为收录范围，共 436 座；
# GDP 2025 已交叉核验（人民网 / 各地统计公报与公开排行站一致）的城市填了 gdp；
# 常住人口仅录入已见统计公报的城市；其余字段待采集后补，一律不填估算值。

meta:
  updated: "2026-10-28"
  dataYear: "2025"
  note: "本站城市数据以政府统计口径为准，批量数据站只作交叉核对，不作唯一来源。"

sources:
  - key: "gdp2025"
    name: "各地 2025 年国民经济和社会发展统计公报（经公开 GDP 排行数据交叉核对）"
    asOf: "2025"
  - key: "pop2025"
    name: "各地 2025 年国民经济和社会发展统计公报 / 2025 年全国人口十强城市统计"
    asOf: "2025"
  - key: "areaGov"
    name: "各市人民政府网站公开的行政区域面积（如杭州市人民政府 16850 平方公里）"
    asOf: "2025"
  - key: "metro2025"
    name: "交通运输部《2025 年城市轨道交通运营数据速报》（截至 2025-12-31，含地铁、轻轨、单轨、有轨电车）"
    asOf: "2025"
  - key: "dfc2022"
    name: "教育部等公布的第二轮「双一流」建设高校名单（147 所，2022 年公布）"
    asOf: "2022"
  - key: "uni2022"
    name: "教育部全国高等学校名单（本科高校数，2021-09-30 版）"
    asOf: "2022"
  - key: "lat2024"
    name: "中国主要城市国家基本气象站经纬度（Atmosphere 期刊论文 Table 1，36 站）"
    asOf: "2024"
  - key: "areaPub"
    name: "公开行政区划面积资料（核对自公开城市面积排行，标注为约数的按约数收录）"
    asOf: "2025"

