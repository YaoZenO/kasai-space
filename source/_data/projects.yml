# V3.1 首页扩展机制 · 项目模块（富文本）
# 新增条目：在 items 下按以下字段追加（仅 title 必传，其余可选）
#   slug      详情页地址 /projects/<slug>/；缺省由标题编码生成
#   title     项目名
#   date      日期，如 2026-10-12；参与首页「近期动态」聚合排序
#   summary   一句话简介（列表与详情页摘要）
#   cover     封面图路径，如 /img/projects/xxx.jpg（后台可直传到该目录）
#   link      仓库 / 演示 / 相关文章（http(s):// 或站内路径）
#   tags      标签数组，如 [Hexo, Node.js]
#   background / process / tech / outcome  四段 Markdown 长文（详情页分节展示）
# items 有内容时自动渲染到首页，并生成 /projects/ 列表页与各条目详情页；为空时整段不渲染

items:
  - title: Ties
    link: "https://github.com/YaoZenO/Ties"
