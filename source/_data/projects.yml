items:
  - title: Ties
    date: 2026-10-15
    summary: 私有、单人使用的本地关系管理系统：把「关系事实」当作数据基元，让半年后、两年后被问到的那一刻，能立刻找回。
    cover: ""
    link: ""
    tags: [Vue, Node.js, Express, SQLite]
    background: |-
      ## 它解决什么

      通讯录只有姓名和号码；日记按时间流走，搜不到人；笔记软件是自己画的任意结构，不成体系。

      Ties 把「关系事实」当作数据基元：见过几次、谁约的、上次见面是什么时候——全部从已有行为推导，不新增任何记录负担。

      核心判断是：**记录的价值不在记录的当下，而在半年后、两年后被问到的那一刻。**

      ## 四条设计原则

      1. **不打分**——查看界面不出现任何亲密度数字，用事实与文字描述关系；主观分值已整体下线，这也是「可截图」的前提；
      2. **零打卡**——所有统计由已有数据推导，不要求用户额外操作；
      3. **只庆祝、不惩罚**——没有进度条、没有连续签到、没有负面提醒；
      4. **可截图**——界面经得起给对方看，敏感信息只出现在详情页。
    process: |-
      ## 工程过程

      - **文档治理**：PRODUCT / PRD / DESIGN / ROADMAP / DECISIONS / AGENTS 各管一段，一个问题只有一份文档回答；历史稿统一归档，避免多份文档互相矛盾。
      - **数据库只走 migration**：增量脚本按 user_version 顺序执行，只升不降、禁止手改数据库；新库全量结构与增量脚本分离。
      - **可验证优先**：冒烟测试与端到端验证脚本随功能一起写，脚本内的隔离数据库与上传目录必须落在系统临时目录。
      - **踩坑固化**：把踩过的坑写成协作规范，例如「上传路由必须把校验异常转成 400，否则掉进默认 handler 变 500」「改 import 后必须实际调用一次函数，ESM 缺绑定静态检查抓不到」。
    tech: |-
      ## 技术栈

      | 层 | 选型 |
      |---|---|
      | 前端 | Vue 3 · Vite · Element Plus · Pinia · Vue Router · ECharts |
      | 后端 | Node.js + Express，分层 routes / controllers / services / middleware |
      | 数据库 | SQLite（Node 内置 node:sqlite），结构变更只走 migration |
      | 鉴权 | JWT + bcrypt |
      | 文件 | multer，magic number + 大小 + 扩展名三重校验 |

      一个刻意的约束：**后端零第三方运行时依赖**——SQLite、图片解析、AI 通道全部用标准库或自实现；前端解码组件随项目走，不走 CDN。
    outcome: |-
      ## 目前的状态

      Web 版已可日常使用，主要能力：

      - **人物档案**：核心字段 + 性格喜好 + 标签 + 地址，照片非强制；
      - **批量导入**：以手机通讯录导出的 vCard 为主路径，按 UID 去重、不覆盖已有档案；
      - **速记收件箱**：全局快捷键唤起，指了人直接落成见面记录，没指人进待归类；
      - **搜索**：姓名 · 绰号 · 标签 · 备注等，支持拼音首字母；
      - **见面记录与洞察**：按最近见面分桶，含标签分布、见面新鲜度、新增趋势看板；
      - **称号与成就**：称号按规则实时计算不落库；10 枚 SVG 勋章 + 成就墙；
      - **相册**：照片 / 视频，HEIC 原生支持，按内容哈希识别重复；
      - **AI 录入**：可选接入 OpenAI 兼容通道，一段话生成档案草稿。

      数据全部留在本机：一个 SQLite 文件 + 一个上传目录，没有云端。

      > **仓库说明**：本项目仓库目前设为私有（GitHub），暂未公开。
  - title: 校园课程资源共享平台
    date: 2026-05-12
    summary: 毕业设计。基于 Django + Vue 3 的校园课程资源管理与共享平台：多角色权限、资源上传下载、论坛交流、AI 智能助手与积分激励一体化。
    cover: ""
    link: "https://github.com/YaoZenO/campus-resource-platform"
    tags: [Django, Vue 3, TypeScript, DRF, JWT]
    background: |-
      ## 它解决什么

      课程资料散落在群聊、网盘和个人电脑里，共享与检索都不方便；师生之间除了课堂，也缺少一个围绕课程本身交流的地方。

      这个平台（毕业设计）把四件事装进一个系统：**课程资源管理**（上传、下载、收藏、评论、评分）、**论坛交流**（发帖、评论，可设公开或指定范围可见）、**AI 智能助手**（集成豆包 AI 做智能问答）和**积分激励**（积分获取与兑换，鼓励持续参与），外加公告发布与数据统计。

      ## 三种角色

      - **学生**：浏览、搜索、下载资源，收藏与评论，参与论坛，用 AI 助手，攒积分兑换奖品；
      - **教师**：上传与管理课程资源，审核资源评论，查看学生情况；
      - **管理员**：用户与资源管理审核、论坛管理、公告发布、积分系统管理与数据统计。
    process: |-
      ## 工程过程

      - **前后端分离**：后端 Django 按业务域拆成 users / courses / forum / announcements / points / ai 六个应用，前端 Vue 3 单页应用通过 REST API 对接；
      - **权限**：JWT 无状态认证 + 基于角色的访问控制（RBAC），三种角色各有功能边界，前端组件按 admin / teacher / student 分目录维护；
      - **数据模型先行**：围绕 User、CourseResource、ForumPost、PointRecord、PrizeExchange 等核心模型组织资源流、互动流与积分流；
      - **体验细节**：全局 Toast 统一消息提示、骨架屏与加载动画、主题色与样式变量可定制，响应式布局兼顾移动端。
    tech: |-
      ## 技术栈

      | 层 | 选型 |
      |---|---|
      | 后端 | Django 4.2 + Django REST Framework |
      | 认证 | JWT（djangorestframework-simplejwt），Django 内置密码哈希 |
      | 数据库 | SQLite（开发）/ MySQL（生产） |
      | 前端 | Vue 3（Composition API）+ TypeScript + Vite |
      | UI / 状态 | Element Plus · Pinia · Vue Router · Axios |
      | AI | 豆包 AI（字节跳动火山方舟） |
    outcome: |-
      ## 目前的状态

      毕业设计，已完成并提交。系统可完整运行：多角色登录与权限隔离、资源上传下载与审核、论坛发帖评论、AI 问答、积分获取与奖品兑换、公告与数据统计均已实现，仓库内附一键启动 / 停止脚本与部署说明。

      > **仓库说明**：GitHub 公开仓库 campus-resource-platform。
  - title: 资产追踪系统
    date: 2026-04-07
    summary: Tauri 2 + Vue 3 的桌面应用：追踪个人资产的全生命周期与日均成本，附带心愿清单、时间轴与统计分析，数据存本地 SQLite。
    cover: ""
    link: "https://github.com/YaoZenO/asset-tracker"
    tags: [Tauri 2, Vue 3, TypeScript, Rust, SQLite]
    background: |-
      ## 它解决什么

      东西越买越多：什么时候买的、花了多少钱、保修到没到、平均每天摊多少钱，很少有人算得清。

      资产追踪系统把每一件物品当作一条有生命周期的记录：买入价与购买日期、保修截止、当前状态（保障中 / 活跃中 / 已退役 / 已用完 / 已售出），核心指标是**日均成本**——一件东西到底值不值，看它每天摊多少钱。

      买之前的那一半也管：**心愿清单**记录想买的物品、预期价格与优先级，配合保修到期提醒，避免冲动下单和过期失保。
    process: |-
      ## 工程过程

      - **桌面化选型**：用 Tauri 2 而非 Electron，Rust 做后端、系统 WebView 渲染前端，体积与资源占用更克制；
      - **数据本地化**：SQLite 只存两张核心表（assets / wishlist），字段围绕生命周期设计，售出价与售出日期单独留痕；
      - **分析围绕日均成本**：统计页用 ECharts 做分类占比、日均成本趋势、持有周期、价格-成本散点与月度新增，图表支持近 3 / 6 / 12 个月与全部时间范围切换；
      - **细节**：8 种排序与多维筛选、保修到期与高优先级心愿的智能提醒、中英文界面动态切换（无需重启）。
    tech: |-
      ## 技术栈

      | 层 | 选型 |
      |---|---|
      | 桌面框架 | Tauri 2（Rust 后端） |
      | 前端 | Vue 3（Composition API）+ TypeScript + Vite |
      | UI / 状态 | Naive UI · Pinia |
      | 图表 | ECharts |
      | 数据库 | SQLite |
    outcome: |-
      ## 目前的状态

      主要功能均已实现：资产卡片列表与统计概览、心愿清单、按购买时间的时间轴、多维度统计分析、智能提醒与中英双语。支持 Windows / macOS / Linux 构建。

      > **仓库说明**：GitHub 公开仓库 asset-tracker，MIT 许可证。
