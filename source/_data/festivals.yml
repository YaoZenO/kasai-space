  faq:
    - { q: "中秋节是法定节假日吗？放几天？", a: "是。按现行《全国年节及纪念日放假办法》，中秋放假 1 天（农历中秋当日）。与相邻周末相连时形成 3 天小长假；如果当天恰逢周三，通常只在当日放假一天。" }
    - { q: "为什么每年中秋的日期都不一样？", a: "中秋按农历八月十五计算。农历一年约 354 天，比公历年少约 11 天，靠闰月补齐，所以八月十五落在公历上的位置每年浮动，大致在 9 月上旬到 10 月上旬。" }
    - { q: "中秋和国庆会连着放吗？", a: "偶尔会。两个节日各自有不同的日期规则，某些年份离得很近甚至同一天。按 2024 年修订确定的调休原则，国庆节放假如逢中秋节则合并放假 8 天。" }
    - { q: "月饼为什么是圆的？", a: "取团圆之意。中秋的意象几乎都围绕「圆」展开：圆月、圆饼、人团圆，三者互相呼应。" }
    - { q: "嫦娥奔月的故事是真的吗？", a: "是神话传说，不是史实。嫦娥、玉兔、吴刚都属于月亮神话的形象，历代文献里有不同版本的记载，民间流传也不止一种说法。" }

- key: guoqing
  name: "国庆节"
  pinyin: "Guóqìngjié"
  kind: legal
  holidayKey: guoqing
  # 日期固定，年份表走「放假日历表」变体
  calendarTable: true
  statutory: 3
  # 注意：本页 places 与 poems 两节都不渲染（现代纪念日，无地域民俗、无古代诗词对应物，
  # 凑节即虚构）。九个 P0 节各自取中上值，正文合计约 2100 字，满足 ≥1800 的裁决口径。
  # 同时本页是 12 页里唯一没有 P1 余量的页面——S2 断言 ≥7 锚点，本页 9 节刚好无冗余，
  # 日后再砍任何一节都会跌破断言（test/festival-e2e.js 说明注释同步此条）。
  desc: "国庆节在 10 月 1 日，法定假日 3 天，调休后形成 7 天黄金周。它是十二个节日里唯一的现代纪念日：日期固定，没有传说，也没有节令食物。"
  lede: "国庆节是 10 月 1 日，为纪念国家成立而设的纪念日。它是十二个节日里唯一的现代纪念日；对普通人最直接的影响，是那 7 天连休。"
  facts:
    - { k: "别称", v: "十一、国庆日、十月一日" }
    - { k: "农历日期", v: "无——国庆按公历计算，不与农历绑定" }
    - { k: "公历日期规则", v: "固定在每年 10 月 1 日，不随农历浮动" }
  sections:
    - id: what
      title: 什么是国庆节
      body: "<p>国庆节在 10 月 1 日，是为纪念国家成立而设的纪念日。法定假日 3 天（10 月 1 日至 3 日），是七个全体公民放假节日里法定天数第二多的，仅次于春节的 4 天。</p><p>它按公历计算，日期固定在 10 月 1 日，不像几个传统节日那样逐年浮动——这一点它与元旦同属一类，其余九个都按农历或节气走。</p><p>今天它最广为人知的一面是「黄金周」——7 天连休形成的年度出行高峰，也是国内旅游最集中的一周。纪念日与黄金周，一庄一闲，是它的两副面孔。</p><p>「十一」这个口语叫法用得极广——日期本身就是名字，这是固定日期纪念日的便利：不需要换算，不需要查历，谁都知道它哪天来。</p><p>另一条常被混着的线也在此说明：国庆的 7 天是「3 天法定 + 前后周末调休」拼出来的，法定天数没有变过 3 天——「放 7 天」与「法定 3 天」是两句话，这一页通篇维持这个区分。</p>"
    - id: when
      title: 国庆节在什么时候
      body: "<p>国庆当天固定为 10 月 1 日，日期从不浮动。逐年变动的是放假区间与调休上班日——所以这一页不列「逐年当天日期表」，改列「放假日历表」：每年的放假区间、天数与调休上班日，一行一年，由本站节假日数据算出，与逐年节假日页一致。</p><p>按 2024 年修订后的口径，国庆自 10 月 1 日起放假调休 7 天；逢中秋则合并放假 8 天。《放假办法》第七条同时写入一条限制：调休后连续工作一般不超过 6 天。</p><p>2027 年及以后的区间是预计值，「官方 / 预计」的标签由节假日数据决定，页面照数据标示——日期确定，可能变的只有怎么放。</p><p>看这张表有个实用读法：先看天数列——7 天的年份是标准黄金周，8 天的年份是撞上了中秋；再看调休上班日列，那几天要照常上班，安排出行时别把它们当成休息日。</p>"
    - id: origin
      title: 国庆节是怎么来的
      body: "<p>1949 年 10 月 1 日，中华人民共和国中央人民政府成立典礼在北京举行。同年 12 月，中央人民政府委员会通过决议，把每年 10 月 1 日定为国庆日——从典礼到纪念日，只隔了两个月。</p><p>1949 年 12 月政务院公布《全国年节及纪念日放假办法》，国庆即在七个放假节日之列，法定 3 天的天数自那时沿用至今。</p><p>这一页没有传说可写。国庆是现代纪念日，不涉神话与民间附会——这份「没有」，本身就是它与另外十一个节日最大的不同。</p><p>与成立典礼相比，「国庆」作为一套公共仪式的展开是逐渐的：升旗、阅兵、焰火与假期的组合，在不同年代各有侧重；不变的底座，是 10 月 1 日这个日期本身。</p><p>把时间线收紧看：10 月 1 日举行成立典礼；同年 12 月，中央人民政府委员会通过决议，把每年 10 月 1 日定为国庆日；同月，政务院公布《全国年节及纪念日放假办法》，国庆列入七个放假节日。三件事都发生在 1949 年——这个节日的「设置」一次完成，此后再没有改过日期。</p>"
    - id: history
      title: 简史
      body: "<p>《全国年节及纪念日放假办法》1949 年首次公布，此后先后于 1999、2007、2013、2024 年修订——一部办法的修订史，也是中国假日制度的变迁史。</p><p>7 天连休的格局是自二十世纪末逐步形成的：法定假日与前后周末调休拼接，长假出行自此成为常态，「黄金周」一词也随之流行。</p><p>2024 年 11 月第四次修订，自 2025 年 1 月 1 日起施行；国庆仍为 3 天法定假日，同时写明了调休的一般规则——长假的总盘子没变，规矩更细了。</p><p>阅兵通常在逢十周年的年份举行——这是惯例，不是法定规定。</p><p>「黄金周」这个词诞生于假日制度与消费市场的交汇处：长假给了出行的时间，出行的集中又反过来塑造了每年的节奏。一个假期的名字能进日常语言，说明它已经不只是日历上的一个格子。</p><p>几轮修订各有节点：办法先后于 1999、2007、2013、2024 年修订，7 天连休的格局是自二十世纪末的修订起逐步形成的；2024 年 11 月的第四次修订自 2025 年起施行，国庆仍为 3 天，同时写明了调休的一般规则。至于阅兵，通常在逢十周年的年份举行——注意这是惯例而非法定规则，说「通常」不说「必须」。</p>"
    - id: customs
      title: 国庆今天怎么过
      body: "<p>长假出行：国庆是国内旅游最集中、景区与高速压力最大的一周；长假首末两日的客流高峰年年如此，热门线路需要提前很久规划。</p><p>10 月 1 日各地举行升旗仪式，城市有节庆布置；灯光秀在近年成为常见的节庆景观。</p><p>长假也是返乡、婚礼与家庭聚会的集中期。这些安排写实地看，都是现代生活的日程，不是民俗。</p><p>必须写清的一点：国庆没有源自传统的民俗体系。这决定了这一页的形态和另外十一个都不一样——它的「怎么过」，几乎完全由当代安排构成。</p><p>对不出远门的人，国庆的过法其实很家常：补一个觉、见几拨朋友、把攒了一季度的事办一办。长假的意义对每个人不一样，但 7 天的长度是同一个。</p><p>10 月 1 日当天，各地有升旗仪式，不少城市在长假期间安排节庆布置与灯光表演；对更多家庭来说，这几天也是婚礼、返乡与家庭聚会的集中期。这些都是围绕一个固定日期长出来的现代公共生活，不是民俗，也不必装成民俗——这正是它与另外十个节日最大的不同。</p>"
    - id: food
      title: 国庆吃什么
      body: "<p>十月一日没有节令专属食物。它和元旦一样，是十二个节日里两个「无专属食物」之一；区别在于国庆的假期更长，家宴与聚会的分量更重。</p><p>长假期间的餐饮消费与日常相比明显集中——这是它唯一值得写进「食物」一节的事实。除此之外，没有什么「国庆必吃」，也不必替它发明一个。</p><p>硬要说国庆的「吃」，最接近的事实是家宴与聚会：假期够长，够一桌人凑齐。至于吃什么，各家有各家的菜单——这正是它没有节令食物的另一种说法。</p>"
    - id: end
      title: 结语
      body: "<p>国庆是这套节日里唯一的现代纪念日：日期固定、没有传说、没有节令食物。它对普通人最直接的影响是那 7 天连休——要看某一年怎么放，回到当年的节假日页即可。</p><p>把它放回十二个节日里看：传统节日回答「怎么过才有味道」，国庆回答「这几天怎么用」——两种问题，一个日历，各答各的。</p>"
  greetingsLabel: "祝福语"
  vocab:
    - { t: "国庆", p: "Guóqìng", m: "10 月 1 日，国家成立的纪念日" }
    - { t: "开国大典", p: Kāiguó dàdiǎn, m: "1949 年 10 月 1 日在北京举行的成立典礼" }
    - { t: "黄金周", p: Huángjīnzhōu, m: "七天长假形成的出行与消费高峰" }
    - { t: "长假", p: Chángjià, m: "与周末调休拼出的连续多天假期" }
    - { t: "调休", p: Tiáoxiū, m: "用周末的工作日换假的安排方式" }
