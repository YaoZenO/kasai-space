  faq:
    - { q: "国庆节法定放几天？为什么有时是 7 天？", a: "法定假日是 3 天（10 月 1 日至 3 日），见《全国年节及纪念日放假办法》第二条。7 天是由这 3 天加上前后周末与调休拼出来的连续假期；这是两套不同的口径。" }
    - { q: "国庆和中秋为什么会连着放？", a: "两个节日的日期规则不同——国庆是公历固定日期，中秋是农历八月十五。按 2024 年修订确定的调休原则，国庆节放假如逢中秋节则合并放假 8 天。" }
    - { q: "2027 年的国庆放假安排出来了吗？", a: "还没有。国务院办公厅通常在前一年 11 月前后发布次年安排，2027 年起的数据是推算的预计值；10 月 1 日这个日期本身不会变，可能变动的是放假区间与调休上班日。" }
    - { q: "长假期间高速公路为什么免费？", a: "长假期间对部分车辆免收通行费是一项延续多年的安排，具体政策每年由交通运输部门在节前发布。本页不替读者判断当年是否免费，建议出行前查阅当年通知。" }
    - { q: "为什么每年都要「调休」？", a: "为了让法定假日与相邻周末连成更长的假期。2024 年修订的《放假办法》写入了一条限制：除个别特殊情形外，法定节假日假期前后连续工作一般不超过 6 天。" }

