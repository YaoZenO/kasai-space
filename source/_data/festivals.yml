    - { t: "灯光秀", p: "Dēngguāngxiù", m: "节日期间楼宇联动的灯光表演" }
    - { t: "高速免费", p: "Gāosù miǎnfèi", m: "长假期间部分车辆免收通行费" }
    - { t: "出行高峰", p: Chūxíng gāofēng, m: "长假首末两日集中出现的客流" }
    - { t: "阅兵", p: Yuèbīng, m: "重大年份举行的受阅仪式" }
