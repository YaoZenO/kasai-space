    - { t: "冬至安康", p: "Dōngzhì ānkāng", m: "偏重健康的冬至问候" }
    - { t: "进补好时节", p: "Jìnbǔ hǎo shíjié", m: "冬季滋补常用的说法" }
  faq:
    - { q: "冬至是法定节假日吗？", a: "不是。《全国年节及纪念日放假办法》第二条列出的七个全体公民放假节日是元旦、春节、清明、劳动节、端午、中秋、国庆，其中没有冬至，所以这一天不放假。" }
    - { q: "冬至为什么每年不是同一天？", a: "冬至是二十四节气之一，按太阳到达黄经 270 度的那一刻划定，因此落在公历 12 月 21 日至 23 日之间，精确到时辰每年不同。它不像春节、端午、中秋那样按农历日期算。" }
    - { q: "为什么冬至这天白天最短？", a: "这一天太阳直射南回归线，北半球白昼最短、夜晚最长。过了这天，白昼开始一天天变长。这是一年中最早被测定的节点之一。" }
    - { q: "冬至为什么要数九？", a: "从冬至这天起，每九天算一个「九」，数满九九八十一天，寒冬结束、春耕开始。民间还有每天描一笔的九九消寒图，用来记日子。" }
    - { q: "2027 年的冬至是哪一天？", a: "由太阳位置决定，本页逐年日期表会列出。2027 年及以后的数据取自本站节假日数据，与逐年节假日页一致。" }

- key: laba
  name: "腊八节"
  pinyin: Làbājié
  kind: traditional
  calendarTable: false
  desc: "腊八节在农历腊月初八，不放假，由先秦岁末的蜡祭与腊祭演变而来，2021 年列入国家级非遗名录。喝腊八粥、泡腊八蒜——「过了腊八就是年」。"
  lede: "腊八节在农历腊月初八，被视为春节的前奏。它由岁末的祭礼演变而来，南北朝时固定到腊月初八；一碗腊八粥，是它今天最通行的过法。"
  facts:
    - { k: "别称", v: "法宝节、佛成道节、成道会、腊八祭" }
    - { k: "农历日期", v: "腊月初八" }
    - { k: "公历日期规则", v: "农历腊月初八，公历多在 1 月上旬至 2 月上旬之间浮动" }
  sections:
    - id: what
      title: 什么是腊八节
      body: "<p>腊八节在农历腊月初八，汉文化语境里被视为春节的前奏。</p><p>它由岁末的祭礼演变而来：先秦的蜡祭（祭农业神）与腊祭（祭祖）秦汉以来逐渐合一，南北朝时腊日固定到农历十二月初八。</p><p>它不是法定假日，不放假。「过了腊八就是年」这句谚语已经把它在时间轴上的位置说清楚了——它是十二个节日里最靠前的那个收尾：一碗粥下肚，忙年就算开了头。</p><p>腊八的「腊」字自带年份感：进了腊月，年就算进入倒计时——腊八、祭灶、除夕，一路节点排下去，腊八是第一个。</p><p>对寺院而言，这一天还是佛成道日：粥是「佛粥」，施粥既是法事也是善举——宗教的日历与民俗的日历，在这碗粥里是同一碗。</p>"
    - id: when
      title: 腊八节在什么时候
      body: "<p>腊八按农历腊月初八计算。农历阴阳合历、靠闰月配平，腊月初八落在公历 1 月上旬至 2 月上旬之间浮动，总在公历一年的最开头——这使它成为很多人一年里最先遇到的一天节日。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>非法定节日不列放假区间，只列日期与星期。</p><p>腊八与春节的距离每年不同：近的年份只隔十来天，远的年份隔一个多月——「过了腊八就是年」说的是心理上的开工，具体忙不忙得起来，还要看那年腊月有多长。</p>"
    - id: origin
      title: 起源
      body: "<p>腊八可追溯到先秦岁末的蜡祭与腊祭：蜡祭祭农业神，腊祭祭祖，秦汉以来二者合一统称腊祭。这是本页最有分量的一段来历。</p><p>南北朝时，腊日固定到农历十二月初八，此后相沿不改。「腊」字的字源有两种解释：一说同「合」，取岁末合祭众神之意；一说同「猎」，取猎获禽兽以祭祖之意。两说并存。</p><p>佛教传入后，腊日与佛成道日融合，形成带有宗教色彩的腊八雏形；唐宋以来腊日式微，渐为腊八所替代。</p><p>蜡祭与腊祭在先秦是两场祭：一场谢田里的神，一场谢家里的祖——秦汉以后合成一场，谢的对象合了，日子的分量没减。腊八接住的是这份岁末感恩的底子。</p><p>日期是南北朝时定下来的：此前的腊日并没有固定日子，到南北朝才固定到农历十二月初八，此后相沿不改。佛教传入后，腊日又与佛成道日融合，形成腊八的雏形；唐宋以来腊日式微，渐为腊八所替代，喝腊八粥之俗自宋代兴起。顺带说「腊」字：它有两种解释，一说同「合」，指岁末合祭众神；一说同「猎」，指猎获禽兽以祭祖——两说并存，不必择一。</p>"
    - id: history
      title: 简史
      body: "<p>2021 年 5 月 24 日，腊八节习俗经国务院批准列入第五批国家级非物质文化遗产名录，项目编号 Ⅹ-174、类别民俗，申报地区为浙江省，保护单位为杭州灵隐寺——这是本页唯一能写到编号级别的硬事实。</p><p>自宋代起兴起喝腊八粥之俗：宋代文献《梦梁录》《武林旧事》都记述了杭州地区的煮粥施粥活动——有具体书名可依。</p><p>当代的延续：施粥活动自 1978 年前后重启并逐步扩大，如今在寺院、社区、福利院等场所都能见到。</p><p>保护单位是杭州灵隐寺这条信息值得多看一眼：腊八施粥的当代版图里，寺院是最稳定的节点——宋代《梦梁录》里的杭州粥局，与今天的施粥队伍，几乎是同一条线。</p><p>文献的链条很完整：宋代《梦梁录》《武林旧事》都记述了杭州地区的腊八煮粥与施粥活动；明清时期僧俗共举，地方志里也有记载。当代这一面最值得注意的是非遗身份：腊八节习俗于 2021 年经国务院批准列入第五批国家级非物质文化遗产名录，项目编号 Ⅹ-174、序号 1548，类别民俗，申报地区为浙江省，保护单位为杭州灵隐寺。</p>"
    - id: customs
      title: 腊八怎么过
      body: "<p>喝腊八粥是这一天最通行的一件事；施粥是它最有温度的一条：寺院与社区在这一天向公众发放热粥。</p><p>泡腊八蒜：部分地区提前把蒜泡进醋里，等到过年时开坛，就着饺子吃——蒜是腊八泡的，饺子是过年吃的，两顿饭隔着一个腊月。</p><p>写实的一条：这一天不放假，也没有春节那样的假期属性——它是「忙年」的开始，不是休息的开始。</p><p>腊八这一天家庭内部的分工也有讲究：熬粥的一锅，泡蒜的一坛——一甜一咸，一今一「年后」，同时开工，各归各的日程。</p>"
    - id: food
      title: 特色食物
      body: "<p>腊八粥用多种谷豆、杂粮、干果熬成，各地配料不同，没有标准配方。它在南北都有，形态差别主要在配料——有的偏甜，有的偏咸。</p><p>腊八蒜与腊八醋是一组：泡出来的蒜翠绿，剩下的醋用于蘸饺子。</p><p>部分地区还有腊八面、腊八豆腐等地方食物，来源分散，点到为止。</p><p>腊八粥的食材讲究「多」：米豆枣栗花生桂圆，凑够八样是常见的讲究，「八」对「腊八」的八。</p><p>腊八粥在南北都有，差别主要在配料与口味：有的偏甜，放糖与干果；有的偏咸，接近咸粥。没有标准配方，也没有标准做法——各家各寺各熬各的。腊八蒜与腊八醋是另一组：部分地区提前把蒜泡进醋里，蒜渐渐翠绿，醋留到年关蘸饺子吃，</p>"
    - id: end
      title: 结语
      body: "<p>腊八是一年里最后一个传统节日，也是春节的程序从这里才开始启动的一个节点。它不放假、不热闹，一碗粥就是全部——这和它的岁末祭礼出身是一致的。</p><p>祭礼出身让它庄重，一碗粥让它日常——庄重与日常之间，是腊八在节日序列里的真实位置。</p>"
    - id: places
      title: 各地差异
      body: "<p>腊八粥的配料各地不同，这是最稳妥的一条。</p><p>华北一带的腊八蒜与腊八醋流传较广；皖南部分地区的腊八豆腐、关中部分地区的腊八面，来源相对分散，点到为止。</p><p>地域差异里最稳妥的一条是配料：北方多放枣栗桂圆一类干果，江南一带的配料体系又自成一格，同一天煮出来的粥，样貌可以差得很远。华北的腊八蒜是流传较广的一支，讲究泡到除夕开坛——但腊八的多数习俗并不存在整齐划一的地域版图，一碗粥的配方，就是最诚实的各地差异。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>宋·陆游《十二月八日步至西村》：「腊月风和意已春，时因散策过吾邻。……今朝佛粥交相馈，更觉江村节物新。」佛粥一句，与《梦梁录》《武林旧事》的施粥记载互相印证。</p><p>粥、腊祭、忙年——腊八的三个符号。</p>"
  greetingsLabel: "腊八的常见说法"
  vocab:
    - { t: "腊八", p: Làbā, m: "农历腊月初八" }
    - { t: "腊月", p: Làyuè, m: "农历十二月" }
    - { t: "腊祭", p: "Làjì", m: "岁末合祭众神与祖先的古礼" }
    - { t: "蜡祭", p: "Zhàjì", m: "岁末祭祀农业神的古礼" }
    - { t: "腊八粥", p: Làbāzhōu, m: "用多种谷豆杂粮熬成的粥" }
    - { t: "腊八蒜", p: Làbāsuàn, m: "醋泡至翠绿变脆的大蒜" }
    - { t: "腊八醋", p: "Làbācù", m: "泡过腊八蒜的醋" }
    - { t: "腊八面", p: Làbāmiàn, m: "部分地区腊八吃的面食" }
    - { t: "腊八豆腐", p: Làbā dòufu, m: "部分地区腊八前后晒制的豆腐" }
    - { t: "佛成道日", p: "Fó chéngdào rì", m: "佛教称释迦牟尼成道之日" }
    - { t: "法宝节", p: Fǎbǎojié, m: "腊八在佛教里的另一称谓" }
    - { t: "施粥", p: Shīzhōu, m: "寺院向公众免费发放腊八粥" }
    - { t: "过了腊八就是年", p: "Guòle làbā jiùshì nián", m: "说腊八一过年就开始了的谚语" }
  greetings:
    - { t: "腊八快乐", p: Làbā kuàilè, m: "腊八当天通用的问候" }
    - { t: "过了腊八就是年", p: "Guòle làbā jiùshì nián", m: "腊八之后开始忙年的老话" }
    - { t: "五谷丰登", p: "Wǔgǔ fēngdēng", m: "传统吉语，腊祭的原意之一" }
  faq:
    - { q: "腊八节是法定节假日吗？", a: "不是。《全国年节及纪念日放假办法》第二条列出的七个全体公民放假节日是元旦、春节、清明、劳动节、端午、中秋、国庆，其中没有腊八节，所以这一天不放假。" }
    - { q: "腊八为什么要喝粥？", a: "喝腊八粥的习俗自宋代开始兴起，当时寺院与民间都熬粥施粥。它由岁末的祭礼演变而来，后来又与佛教纪念释迦牟尼成道的日子结合，时间固定下来。" }
    - { q: "腊月初八这个日期是怎么定下来的？", a: "腊八来自先秦岁末的蜡祭与腊祭，那时腊日并没有固定日子；到南北朝，腊日才固定到农历十二月初八，此后相沿不改。" }
    - { q: "腊八蒜和腊八粥是一回事吗？", a: "不是。腊八粥是这天最通行的食物；腊八蒜是部分地区把蒜泡进醋里、到年关蘸饺子吃的做法，两者是同一天的两件事。" }
    - { q: "2027 年的腊八节是哪一天？", a: "由农历决定，本页逐年日期表会列出。2027 年及以后的数据取自本站节假日数据，与逐年节假日页一致。" }
