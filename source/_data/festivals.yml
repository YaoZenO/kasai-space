  faq:
    - { q: "七夕是法定节假日吗？", a: "不是。《全国年节及纪念日放假办法》第二条列出的七个全体公民放假节日是元旦、春节、清明、劳动节、端午、中秋、国庆，其中没有七夕节，所以这一天不放假。" }
    - { q: "七夕就是中国的情人节吗？", a: "这是近年常见的类比说法。七夕本来的主题是「乞巧」——女子向织女祈求手巧；牛郎织女的爱情传说是它另一个组成部分。把它当成情人节是现代的用法，不是它原本的面目。" }
    - { q: "为什么七夕在农历七月初七？", a: "月和日都是同一个数字的节日在传统里不少（正月十五、二月二、三月三、五月五、七月七、九月九）。七月初七取的是两个「七」相重。" }
    - { q: "七夕为什么要乞巧？", a: "传说里的织女擅长织作，妇女在这一天向她祈求针线手艺精进。旧时常见的做法有月下穿针、看蜘蛛结网等，各地形式不一。" }
    - { q: "2027 年的七夕是哪一天？", a: "由农历决定，本页逐年日期表会列出。2027 年及以后的数据取自本站节假日数据，与逐年节假日页一致。" }

- key: zhongyuan
  name: "中元节"
  pinyin: Zhōngyuánjié
  kind: traditional
  calendarTable: false
  desc: "中元节在农历七月十五，不放假。道教中元、佛教盂兰盆与民间七月半三套习俗长期融合落在同一天；祭祖之外还有放河灯与普度。"
  lede: "中元节在农历七月十五，民间称七月半。它是十二个节日里来源最复杂的一个：道教的中元、佛教的盂兰盆、民间的七月半，三套习俗长期融合，落在同一天。"
  facts:
    - { k: "别称", v: "七月半、鬼节、盂兰盆节、施孤" }
    - { k: "农历日期", v: "七月十五" }
    - { k: "公历日期规则", v: "农历七月十五，公历多在 8 月上旬至 9 月上旬之间浮动" }
  sections:
    - id: what
      title: 什么是中元节
      body: "<p>中元节在农历七月十五，民间称七月半、七月望，也称盂兰盆会、施孤、亡人节。</p><p>它是道教中元节、佛教盂兰盆节、民间七月半三套习俗长期融合的结果，流布已逾千年。它不是法定假日，不放假。</p><p>它与清明一起构成一年里两个主要的祭祖节点；在一些地区，中元节是比清明节或重阳节更重要的祭祖日。这一页按民俗事实陈述，不做评价。</p><p>三个名字各有侧重：中元是道教的，盂兰盆是佛教的，七月半是民间的——叫哪个名字，多半能看出说话的人站在哪套传统里。民间口头上，「七月半」最通行。</p>"
    - id: when
      title: 中元节在什么时候
      body: "<p>中元按农历七月十五计算。农历阴阳合历、靠闰月配平，七月十五落在公历 8 月上旬至 9 月上旬之间浮动，总在夏末秋初。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>非法定节日不列放假区间，只列日期与星期。</p><p>部分地区过七月十四而非十五，开鬼门关鬼门的日子各地说法也不一；本页只按通行口径的七月十五列日期，地方差异见下方「各地差异」。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>道教的三官体系：正月十五上元、七月十五中元、十月十五下元，分别对应天官赐福、地官赦罪、水官解厄。七月十五叫「中元」即由此而来——三元里的中间一个。</p><p>佛教的盂兰盆：「盂兰盆」是梵文音译，意为解救倒悬之苦；七月十五举行超度历代宗亲的法会，逐渐固定为盂兰盆会。</p><p>民间的七月半：认为七月初一开鬼门、七月十五关鬼门，因此在这一天祭祖与普度。</p><p>三者在长期演变中互相影响并最终融合——这条结论是理解这个节日所有习俗的钥匙：同一个晚上，道教在赦罪，佛教在超度，民间在祭祖。</p><p>三套体系在这一天各有一个动作：道教的地官赦罪、佛教的盂兰盆供、民间的祭祖普度——对象都是「看不见的人」，动作都朝着安慰与超度去。</p><p>三条线索各自说得通。道教的体系里，天、地、水三官分掌赐福、赦罪、解厄，生日分别在正月十五、七月十五、十月十五——七月十五叫「中元」，就是排座次排出来的。佛教这边，「盂兰盆」是梵语音译，意为解救倒悬之苦，此日举行超度历代宗亲的法会，渐成盂兰盆会。民间则讲七月初一开鬼门、七月十五关鬼门，在关门前祭祖、普度。三套来历、同一天，长期演变中互相影响并最终融合，这是理解中元节的一把钥匙。</p>"
    - id: history
      title: 简史
      body: "<p>中元节习俗的非遗身份有多条：香港潮人盂兰胜会于 2011 年、广西资源河灯节于 2014 年、山东莱芜中元节习俗于 2021 年分别列入国家级非物质文化遗产名录——三地三项目，全部有政府来源可核。</p><p>七月十五放水灯、祭土地庄稼、祭祖、普度四类习俗都有明确记载。</p><p>它的习俗来源本就有道教、佛教、民间三套，加上地域辽阔、民族多样，各地呈现的形态差别极大——这也是它比多数节日更难一概而论的原因。</p><p>三个非遗项目的入选年份连成一条线：2011 香港盂兰胜会、2014 资源河灯节、2021 莱芜中元节习俗——十余年间三地陆续入录，说明这个节日的习俗形态至今仍有活力。</p><p>当代最硬的证据是三个国家级非遗项目：香港中元节（潮人盂兰胜会）2011 年列入国家级非物质文化遗产名录，活动从七月初一开始搭棚摆祭、演地方戏曲，并有派平安米等环节；广西中元节（资源河灯节）2014 年列入，放灯的做法由资江水道的航运往事与中元源起结合而成；山东中元节习俗（莱芜中元节习俗）2021 年列入，以祖先祭祀为主题，当地称「七月十五请家堂」。</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>放水灯：以纸板或木板为底、做成荷花形，点燃后放入水中任其漂流，是这个节日视觉感最强的一条。</p><p>祭祖：部分地区在七月十五比清明更重视祭祖，有「请家堂」「送家堂」一类仪式。祭祀土地与庄稼：把供品撒进田地、用五色纸缠绕作物穗子以求避灾丰收。</p><p>普度：香港与台湾部分地区宰牲焚香、请僧道做法，安慰无主孤魂。</p><p>写实的一条：这一天不放假，也不是每个人都过——很多地区的读者对它并不熟悉，这一页的定位更像一个资料条目而非节日指南。</p><p>放灯与祭祖的分工很清楚：水灯漂向外面的水，家堂留给里面的屋——祭祖的部分与清明近似，普度的部分则是中元独有。</p><p>还有一类容易被忽略的祭俗：祭祀土地与庄稼。部分地区把供品撒进田地，用五色纸缠绕作物穗子，求的是避灾与丰收——七月十五恰在秋收前后，这份对收成的牵挂，是它作为农历节日的农事底色。</p>"
    - id: food
      title: 中元吃什么
      body: "<p>中元没有全国统一的节令食物，供品以家常饭菜、瓜果与时令作物为主。</p><p>祭祖期间有每日晨午昏供茶饭的做法——这比「吃什么」更能反映节俗实质。各地有自己的节令食物，说法不一，这里不点名。</p><p>供品讲究「家常」：饭菜茶酒、瓜果时物，都是先人生前日常吃的——这个节日的供桌，更像一次日常的延续，而不是一场盛宴。</p>"
    - id: end
      title: 结语
      body: "<p>中元是十二个节日里来源最复杂的一个：道教、佛教、民间三套东西落在同一天。它不放假、不热闹，却在这一年里承担了一半的祭祖功能。</p>"
    - id: places
      title: 各地差异
      body: "<p>香港中元节（潮人盂兰胜会）2011 年列入国家级非遗名录：活动从七月初一开始，搭棚摆祭品、演出地方戏曲，并有福物竞投、派平安米等环节。</p><p>广西中元节（资源河灯节）2014 年列入国家级非遗名录：由资江水道的航运与中元节源起结合而成，放灯是从悼念遇难船工与放排工而来的独特做法。</p><p>山东中元节习俗（莱芜中元节习俗）2021 年列入国家级非遗名录：以祖先祭祀为主题，当地称「七月十五请家堂」。台湾一带的普度活动同样成体系，这里只陈述现象。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>清·庞垲《长安杂兴效竹枝体》：「万树凉生霜气清，中元月上九衢明。小儿竞把清荷叶，万点银花散火城。」</p><p>水灯、七月十五的月、清荷叶——三个符号，凑成中元在诗词里少量但清晰的身影。</p>"
