    - { t: "九九消寒图", p: "Jiǔjiǔ xiāohántú", m: "从冬至起每日描一笔的消寒图" }
    - { t: "饺子", p: Jiǎozi, m: "北方冬至吃的面食" }
    - { t: "汤圆", p: Tāngyuán, m: "南方冬至吃的糯米圆子" }
    - { t: "亚岁", p: "Yàsuì", m: "冬至的旧称" }
    - { t: "阳生", p: Yángshēng, m: "冬至之后白昼渐长，旧说称一阳来复" }
    - { t: "祭天", p: "Jìtiān", m: "古代冬至祭祀上天的礼制" }
    - { t: "进补", p: "Jìnbǔ", m: "冬季食用滋补食物的民间说法" }
    - { t: "冬至面", p: "Dōngzhì miàn", m: "部分地区冬至吃的面食" }
    - { t: "赤豆糯米饭", p: "Chìdòu nuòmǐfàn", m: "江南部分地区冬至吃的饭食" }
    - { t: "冬至大如年", p: "Dōngzhì dà rú nián", m: "形容冬至在民间分量很重的老话" }
