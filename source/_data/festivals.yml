# —— 法定 6 个（key 与 holidays.yml 的 holidays[].id 逐字相同）——

festivals:
- key: yuandan
  name: "元旦"
  pinyin: Yuándàn
  kind: legal
  holidayKey: yuandan
  # 日期固定，年份表走「放假日历表」变体
  calendarTable: true
  statutory: 1
  desc: "元旦是公历一年的第一天，法定假日 1 天。它按公历计算、日期固定在 1 月 1 日；「元旦」这个名字在古代原指农历正月初一，1914 年起才移作公历新年。"
  lede: "元旦是公历一年的第一天，也是七个全体公民放假节日里的第一个。它的名字原本属于农历正月初一，二十世纪初的历法改制把它搬到了 1 月 1 日。"
  facts:
    - { k: "别称", v: "元日、阳历年、新历新年；古籍里的「元旦」「元日」指农历正月初一" }
    - { k: "农历日期", v: "无——元旦按公历计算，不与农历绑定" }
    - { k: "公历日期规则", v: "固定在每年 1 月 1 日，不随农历浮动" }
  sections:
    - id: what
      title: 什么是元旦
      body: "<p>元旦是公历一年的第一天，也是《全国年节及纪念日放假办法》规定的七个全体公民放假节日里的第一个，法定假日 1 天。按 2024 年 11 月修订、2025 年 1 月 1 日起施行的版本，全体公民放假的节日共七个，元旦排在第一项。</p><p>它与春节、清明、端午、中秋都不同：那几个按农历算，元旦按公历算，公历的年首固定在 1 月 1 日，所以它在每一年都落在同一天。从字面上看，「元」有开始之意，「旦」指天明或一天之始，合起来指一年的头一天——这个构词到今天没有变过。</p><p>不过这个名字在古代指的是农历正月初一，是农历岁首的专名。今天的元旦是二十世纪初历法改制的结果：名字没变，日子换了。「元旦」从农历搬去公历的经过，正是这一页要讲清的主线。</p><p>放在整张日历上看，元旦还有一层结构性的位置：它是一年里第一个「全体公民放假」的日子，也是唯一一个只按公历排的法定节日。后面十一个节日各有各的历法，只有它年年在同一个格子里。</p>"
    - id: when
      title: 元旦在什么时候
      body: "<p>元旦固定在公历 1 月 1 日，日期从不浮动。逐年的放假区间与调休上班日由国务院办公厅在前一年 11 月前后公布；下面这张「放假日历表」列出各年的安排，全部由本站节假日数据算出，与逐年节假日页一致，「官方 / 预计」的标签也照数据标示。</p><p>按《放假办法》，元旦法定假日 1 天，逢周末在工作日补假，加上相邻周末通常形成 3 天小长假；当天若逢周三，则只在当日放假。所以元旦假期的长短取决于 1 月 1 日落在星期几——同一个跨年，有的年份能连休三天，有的年份只放一天。</p>"
    - id: origin
      title: 「元旦」这个名字是怎么来的
      body: "<p>1912 年中华民国成立，宣布改用公历（阳历），以公历 1 月 1 日为新年；但民间的岁时节庆照农历走，两套年头在之后的几十年里并存，各自有各自的叫法。</p><p>1914 年起，农历岁首改称「春节」，公历年首称「元旦」。当时内务部呈请把农历元旦定为春节、端午为夏节、中秋为秋节、冬至为冬节，获准施行的只有「春节」一项——其余几个名目没有落地。名字就这样换了主人：农历岁首让出了「元旦」，公历新年住了进去。</p><p>再往前数，从汉武帝颁行《太初历》起，正月初一就称「元旦」；此前夏、商、周、秦各自的岁首月份并不相同，岁首定在哪个，是每次改历要解决的头一件事。「元旦」这个名字跟着农历岁首走了约两千年，直到一百年前才移作公历新年——在中国节日里，没有第二个名字经历过这样的搬家。</p><p>改名之后的日子并不别扭：公历 1 月 1 日照过公历的年，农历正月初一照过农历的年，两套日子各过各的，用两个名字分清楚——今天习惯说的「跨年」与「过年」，就是那次改制留下的分工。</p>"
    - id: history
      title: 简史
      body: "<p>1949 年 12 月政务院发布《全国年节及纪念日放假办法》，元旦即在七个放假节日之列，放假 1 天。此后该办法先后于 1999、2007、2013、2024 年修订，七个节日的名单没有变过，元旦的 1 天也没有变过。</p><p>2024 年 11 月第四次修订，自 2025 年 1 月 1 日起施行，全体公民放假假日由 11 天增至 13 天——增加的两天落在除夕与 5 月 2 日，元旦仍为 1 天。</p><p>元旦一般不办庙会灯会。它主要的公共形式——跨年倒计时、灯光与焰火、新年音乐会与新年致辞——都是现代城市活动，不是古老民俗。这里照实写，不替它附会出一套古俗。</p><p>放假办法几轮修订改的都是别处的天数，元旦的位置始终没动。对多数人来说，它一年里只有一件事是确定的：1 月 1 日放假一天，怎么连休看它落在星期几。</p><p>把沿革铺开看：1949 年 12 月政务院发布《全国年节及纪念日放假办法》，元旦就在最初的七个放假节日之列；此后办法先后于 1999、2007、2013、2024 年修订，2024 年 11 月的修订把全体公民放假假日由 11 天增至 13 天，元旦仍然只占 1 天</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>跨年夜的倒计时与焰火、家庭或朋友的聚会、立下新年计划，是当下最普遍的三件事。12 月 31 日夜里，许多人守到零点数完最后一秒，互道新年好；倒计时牌、灯光秀和跨年演出，是这一夜的城市标配。</p><p>机关与企事业单位常在元旦前后办年会或联欢会，学校与社区的文艺演出也集中在这几天。1 月 1 日早晨的升国旗仪式、到城市高地看新年第一缕阳光，是近年常见的公共活动。</p><p>要说清的一点是：元旦没有源自农耕社会的节俗体系。它更像一个公共纪念日——各地怎么过，取决于城市活动与个人安排，而不是世代相传的仪式。所以这一节没有「民俗清单」可列，写实的记录就到这里。</p><p>学校与社区的活动多半排在前后的几天里，形成一个小小的活动季；对上班族而言，元旦更像一次中场休息——离春节还有一个多月，年味要再等等。</p>"
    - id: food
      title: 元旦吃什么
      body: "<p>元旦没有节令专属食物。家宴与聚会吃什么，各地各家自己定——这一点正是它与春节、端午、中秋的最大反差，那三个节日都有明确的节令食物，元旦一样也拿不出来。</p><p>近年也有跨年蛋糕一类流行做法，属于外来影响或新的城市习惯，并不是传统吃法。若见到「元旦必吃某物」的说法，多半经不起核对；把它当成普通假日的一顿好饭，最接近事实。</p>"
    - id: end
      title: 结语
      body: "<p>元旦是十二个月轮回的起点，也是这套节日体系里唯一完全按公历计算的一个。它的名字从农历正月初一一路搬到公历 1 月 1 日，两千年与一百年在这里交棒——这段更名史是它最有意思的部分。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>古籍与古诗里的「元旦」「元日」，指的是农历正月初一，也就是今天的春节。读古人的元旦诗，要先讲清这件事，才不会把日子读错。</p><p>宋·王安石《元日》：「爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。」写的正是农历岁首的热闹——诗题里的「元日」是它的旧称，诗里的爆竹、屠苏与桃符，全都挂在过年那几天。</p><p>本站春节页引了同一首，两页都注明它写的是农历正月初一：一首诗横跨两个节日，恰好是这段更名史留下的注脚。</p>"
  greetingsLabel: "祝福语"
  vocab:
    - { t: "元旦", p: Yuándàn, m: "公历新年第一天，即 1 月 1 日" }
    - { t: "元日", p: "Yuánrì", m: "「元旦」的旧称；古诗里多指农历正月初一" }
    - { t: "阳历新年", p: "Yánglì xīnnián", m: "按公历计算的新年，区别于农历新年" }
    - { t: "跨年", p: Kuànián, m: "从旧年的最后一夜过渡到新的一年" }
    - { t: "跨年夜", p: Kuànián yè, m: "12 月 31 日夜晚" }
    - { t: "倒计时", p: "Dàojìshí", m: "迎接新年到来时的读秒" }
    - { t: "新年贺词", p: Xīnnián hècí, m: "元旦前后公开发表的新年致辞" }
    - { t: "新年音乐会", p: "Xīnnián yīnyuèhuì", m: "元旦前后上演的专场演出" }
    - { t: "元旦假期", p: Yuándàn jiàqī, m: "元旦前后的休假安排" }
    - { t: "新年许愿", p: "Xīnnián xǔyuàn", m: "新年之际立下的心愿" }
    - { t: "倒数迎新", p: "Dàoshǔ yíngxīn", m: "数到零、迎接新年的那一刻" }
    - { t: "公历", p: "Gōnglì", m: "国际通用的阳历历法" }
  greetings:
    - { t: "新年快乐", p: Xīnnián kuàilè, m: "元旦最通用的问候" }
    - { t: "元旦快乐", p: Yuándàn kuàilè, m: "元旦当天的问候，多见于贺卡与群发信息" }
    - { t: "新年新气象", p: "Xīnnián xīn qìxiàng", m: "祝对方在新的一年里有新的面貌" }
  faq:
    - { q: "元旦是法定节假日吗？放几天？", a: "是。按 2024 年 11 月修订、2025 年 1 月 1 日起执行的《全国年节及纪念日放假办法》，元旦放假 1 天（1 月 1 日）。当天若逢周末就在工作日补假，加上相邻周末通常形成 3 天小长假。" }
    - { q: "为什么每年的元旦都是 1 月 1 日？", a: "元旦按公历计算，公历的年首固定在 1 月 1 日，不像春节、端午、中秋那样按农历算，所以它在公历上的位置从不浮动。这是它和几个传统节日最直观的区别。" }
    - { q: "「元旦」是不是原本指春节？", a: "是。古籍里的「元旦」「元日」指的是农历正月初一。1912 年改用公历之后，1914 年起把公历新年定名为元旦，农历正月初一改称春节，「元旦」这个名字才换了主人。" }
    - { q: "2027 年的元旦放假安排出来了吗？", a: "还没有。国务院办公厅通常在前一年 11 月前后发布次年安排，2027 年起的数据是推算的预计值；1 月 1 日这个日期本身不会变，可能变动的是放假区间与调休上班日。" }
    - { q: "跨元旦返乡和春节一样紧张吗？", a: "不一样。元旦只有 1 至 3 天假期，出行半径以城市及周边为主；全年最大规模的出行高峰集中在春节和国庆两个长假。" }

- key: chunjie
  name: "春节"
  pinyin: Chūnjié
  kind: legal
  holidayKey: chunjie
  calendarTable: false
  statutory: 4
  desc: "春节是农历正月初一，中国规模最大的传统节日，法定假日 4 天（除夕至正月初三）。本页讲它的来历与传说、习俗与食物、逐年日期与常见问题。"
  lede: "春节是农历一年的第一天，也是中国传统节日里规模最大的一个。它的节期从腊月末尾一直延续到正月十五元宵节。"
  facts:
    - { k: "别称", v: "新春、过年、元日、岁首、农历新年" }
    - { k: "农历日期", v: "正月初一" }
    - { k: "公历日期规则", v: "农历正月初一，公历在 1 月 21 日至 2 月 21 日之间浮动" }
  sections:
    - id: what
      title: 什么是春节
      body: "<p>春节是农历一年的第一天，即正月初一，也是中国传统节日中规模最大的一个。法定假日 4 天——农历除夕与正月初一至初三，按 2024 年 11 月修订、2025 年 1 月 1 日起执行的《放假办法》。</p><p>「春节」这个名字只有一百多年历史：此前农历正月初一叫元旦、元日、岁首，1914 年起才改称春节（这段更名的详细经过见本站<a href=\"/library/yuandan/\">元旦</a>页）。名字年轻，节日本身极老——过年这件事，比「春节」这个名字老得多。</p><p>春节也不等于初一一天。它的节期从腊月末尾一直延续到正月十五元宵节；除夕夜的年夜饭、守岁、发红包、贴春联福字窗花、放爆竹、拜年，构成它的核心习俗清单。前半段在家里过，后半段走上街，一头一尾各有各的热闹。</p>"
    - id: when
      title: 春节在什么时候
      body: "<p>春节按农历正月初一计算，逐年日期由本站节假日数据算出，与逐年节假日页一致。农历是阴阳合历，平年约 354 天，比公历年少约 11 天，靠设置闰月补齐，所以正月初一落在公历上的位置每年前后浮动，最早在 1 月下旬、最晚到 2 月下旬——前后能差开将近一个月。</p><p>自 2025 年起，春节从农历除夕起放假调休 8 天，除夕逢周五时可达 9 天。「法定假日 4 天」与「连休 8 天」是两套口径——前者是《放假办法》第二条的规定，后者是加上周末与调休后的连休长度。这也是读者最常搞混的地方：法定天数写进法规，连休天数写进每年 11 月的放假通知，两份文件各管各的。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>民间流传的说法里，过年起于驱赶一头叫「年」的猛兽：它怕红色、火光与响声，人们便在岁末贴红纸、燃爆竹把它吓走。这是民间流传的说法，不是史实——但它把过年习俗里最响的三样东西（红色、火光、响声）全都说进去了。</p><p>史实的线索是：过年的源头可追溯到殷商时期年头岁尾的祭神祭祖活动，腊祭、蜡祭是它的前身。岁末祭一阵、岁首再祭一阵，感谢一年的收成、祈求来年的顺遂，这层意思一直留在过年的底色里。而「年」字的本义，一说与谷物成熟有关——收成一次为一年；这只是一种文字学解释，与年兽传说互不相干。</p><p>把岁首固定在正月初一的，是汉武帝颁行的《太初历》。此前夏、商、周、秦各自的岁首月份并不相同，改一次历，年就开始于不同的月份；《太初历》之后，正月初一作为岁首沿袭至今，过年的日子从此不再挪动。</p>"
    - id: history
      title: 简史
      body: "<p>2006 年 5 月，国务院公布第一批国家级非物质文化遗产名录，春节名列其中。2024 年 12 月 4 日，「春节——中国人庆祝传统新年的社会实践」通过评审，列入联合国教科文组织人类非物质文化遗产代表作名录。</p><p>节俗代有增删：桃符演变为春联，爆竹演变为火药鞭炮，门神的形象逐渐固定——到了宋代，这些形式大多已经定型。今天贴的、放的、挂的，宋代人基本都认得。</p><p>放假沿革上，1949 年《放假办法》初定的七个节日里就有春节；2007 年修订把春节假期调整为从除夕开始；2024 年修订将除夕纳入法定假日，法定天数增至 4 天。三次调整的方向一致：把除夕正式算进年里。</p><p>把这些年份连起来看：2006 年入国家级名录，2024 年入人类非遗名录，同一年法定假日又增到 4 天——春节的「分量」在十几年里加了好几轮，但过的还是那套年。</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>除夕这一天是一套连贯的动作：年夜饭、守岁、长辈发压岁钱、贴春联福字窗花、放爆竹。年夜饭是一年里最郑重的一顿饭，天南海北的人为它赶路；守岁守的是辞旧迎新的那一刻；压岁钱装进红包，是这一夜长辈与晚辈之间的仪式。</p><p>初一到初五：拜年、走亲戚、逛庙会。民间还有不少讲究——不说不吉利的话、初一不扫地等，各地详略不一，属民间讲究而非通行的规矩。到正月十五元宵节收尾：灯会、猜灯谜、吃汤圆（见本站<a href=\"/library/yuanxiao/\">元宵节</a>页），过完那晚，年才算真正过完。</p><p>今天的形式有变有不变：春晚、电子红包、视频拜年、春运返程高峰，载体一直在换，团圆的内核没有变。海外华人社区与华人聚居的城市，也有各自的庆贺——舞龙舞狮与年夜饭跟着人走，人到了哪里，就在哪里出现。</p>"
    - id: food
      title: 特色食物
      body: "<p>北方除夕吃饺子，取「更岁交子」之意——旧岁新年交在子时，饺子交在嘴里。饺子里包硬币、包糖，是民间添趣的做法，谁吃到算谁的彩头。</p><p>南方吃年糕、汤圆、盆菜等，各地差别很大——「南方吃汤圆」只是其中一种，不是笼统的南方规则。年糕取「年年高」，汤圆取团圆，口彩不同，心思一样。</p><p>鱼是年夜饭的常备菜，取「年年有余」的谐音，很多地方讲究这道菜不吃完，留到初一。节令食物的讲究多在谐音与形状上讨口彩，谈不上配方与流派——菜谱各家各样，口彩是共通的。</p>"
    - id: end
      title: 结语
      body: "<p>春节是这套节日里唯一横跨两个热烈节点的一个——初一一头，正月十五一头；它既是农历年首，也是法定假期最长的一个。要看某一年具体怎么放，回到当年的<a href=\"/holidays/{{year}}/#holiday-chunjie\">节假日页</a>即可，日期由数据算出，与本页逐字一致。</p>"
    - id: places
      title: 各地差异
      body: "<p>主食的南北差异最直观：北方以饺子为主，南方多吃年糕与汤圆。广东有迎春花市（行花街），年前逛花市买年花是当地的固定节目；各地庙会各有来路，是春节最热闹的公共场面。</p><p>少数民族的年节自成体系：藏历新年、蒙古族的白月、彝族年，各有自己的历法起点，与汉族春节的日期并不重合——「过年」在中国不是一个日子，是一组日子。</p><p>港澳台与东南亚华人社区也过春节，假期长度与称呼各有不同，但年夜饭与拜年这两件事，到哪里都是同一套。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>宋·王安石《元日》：「爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。」写的正是农历正月初一——诗题里的「元日」是它的旧称。本站元旦页引了同一首，两页都注明它写的是农历正月初一。</p><p>宋·陆游《除夜雪》：「北风吹雪四更初，嘉瑞天教及岁除。半盏屠苏犹未举，灯前小草写桃符。」除夕夜写桃符迎新，桃符到春联的演变，在这两句里看得最真切。</p>"
  greetingsLabel: "祝福语"
  vocab:
    - { t: "春节", p: Chūnjié, m: "农历正月初一，一年的岁首" }
    - { t: "除夕", p: Chúxī, m: "农历腊月最后一天，初一的前一夜" }
    - { t: "年夜饭", p: Niányèfàn, m: "除夕夜全家聚在一起的一顿饭" }
    - { t: "守岁", p: "Shǒusuì", m: "除夕夜不睡，守到新的一年到来" }
    - { t: "压岁钱", p: "Yāsuìqián", m: "长辈在新年给晚辈的钱，装在红包里" }
    - { t: "红包", p: Hóngbāo, m: "装压岁钱的红色纸封，也泛指礼金" }
    - { t: "春联", p: Chūnlián, m: "贴在门框上的成对联语，写吉利话" }
    - { t: "福字", p: "Fú zì", m: "写着「福」的红纸，民间常倒着贴" }
    - { t: "年画", p: Niánhuà, m: "过年张贴的彩色版画，多为吉祥题材" }
