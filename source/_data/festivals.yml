  faq:
    - { q: "中元节是法定节假日吗？", a: "不是。《全国年节及纪念日放假办法》第二条列出的七个全体公民放假节日是元旦、春节、清明、劳动节、端午、中秋、国庆，其中没有中元节，所以这一天不放假。" }
    - { q: "中元、清明都是祭祖的日子，它们有什么不同？", a: "清明在春四月，祭扫与踏青并行，也是法定假日，重在墓前的祭扫；中元在农历七月十五，属月日相重的旧节，祭祖之外还有普度、放河灯一类面向无主亡魂的做法。两者的来历、季节与习俗体系都不一样。" }
    - { q: "中元和盂兰盆节是一回事吗？", a: "日期相同、后来融合，但源头不同：七月十五属道教的中元，盂兰盆是佛教在这一天举行的法会名称，民间的七月半鬼节又是另一套说法。三类习俗在长期演变中合并在同一天。" }
    - { q: "中元节是迷信说法吗？", a: "作为传统节日，它承载的是祭祖与追念的伦理内容；「鬼月」「七月半」一套说法属于民间信仰。本页按民俗事实陈述，不作评价。" }
    - { q: "2027 年的中元节是哪一天？", a: "由农历决定，本页逐年日期表会列出。2027 年及以后的数据取自本站节假日数据，与逐年节假日页一致。" }

- key: chongyang
  name: "重阳节"
  pinyin: Chóngyángjié
  kind: traditional
  calendarTable: false
  desc: "重阳节在农历九月初九，不放假，登高、赏菊、佩茱萸。2012 年《老年人权益保障法》把这一天定为老年节——它是唯一被写进法律条文的传统节日。"
  lede: "重阳节在农历九月初九，两个阳数相重，故称重阳。登高、赏菊、佩茱萸是它的传统三件套；2012 年它被法律定为老年节，敬老成了它今天的另一层主题。"
  facts:
    - { k: "别称", v: "重九节、登高节、敬老节、老年节" }
    - { k: "农历日期", v: "九月初九" }
    - { k: "公历日期规则", v: "农历九月初九，公历多在 10 月上旬至 11 月上旬之间浮动" }
  sections:
    - id: what
      title: 什么是重阳节
      body: "<p>重阳节在农历九月初九，也称重九。传统以奇数为阳，九是最大的阳数，月日同为九、两个阳数相重，所以叫重阳。</p><p>它的三个传统母题：登高、赏菊、佩茱萸。</p><p>2012 年 12 月 28 日修订通过的《中华人民共和国老年人权益保障法》第十二条规定，每年农历九月初九为老年节，自 2013 年 7 月 1 日起施行——这是它与其他传统节日最不同的一点：别的节日靠传统，它还有一部法律。它不是法定假日，不放假。</p><p>「九」在传统文化里是极数：大到不能再大，阳到不能再阳。两个九叠在一起，是十二个节日里数字上最「重」的一个——这也解释了为什么古人格外看重这一天。</p>"
    - id: when
      title: 重阳节在什么时候
      body: "<p>重阳按农历九月初九计算。农历阴阳合历、靠闰月配平，九月初九落在公历 10 月上旬至 11 月上旬之间浮动，总在深秋——与登高、赏菊两个习俗的季节基础一致，秋高气爽正是登高天。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>非法定节日不列放假区间，只列日期与星期。</p><p>重阳落在深秋，与国庆假期偶有交叠：九月初九碰上有假的日子，登高的人就多一截；碰上工作日，山上的多是退休在家的长者——「老年节」三个字，在这样的年份里格外贴切。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>民间流传的说法：东汉汝南人桓景随费长房学道，九月九日带家人登高、佩茱萸、饮菊花酒以避灾，回来发现家中牲畜都已暴亡。这是民间流传的说法——登高避灾的「避」字，把这一天的三个习俗全串了起来。</p><p>更早的一条线索是：九月节令活动在汉代文献里已有记载，秋季登高与秋祭属岁时节令的一部分。这一条比具体人物的传说更可靠。</p><p>名字的来历确定性很高：以九为阳数、月日同为九故称重阳——这一条可以写得很实。</p><p>避灾的传说给登高找了个理由，季节给登高找了另一个理由：秋高气爽、山明水净，本就是一年里上山最好的时候——传说与季节，一个管「为什么」，一个管「凭什么」。</p><p>流传最广的传说是一段避灾的故事：民间流传东汉时汝南人桓景随费长房学道，得嘱九月九日带家人登高、佩茱萸、饮菊花酒以避灾，回家发现家中牲畜都已暴亡——登高避灾由此相沿。这一类故事按民间传说对待即可。更早的线索是：九月里的节令活动在汉代文献中已有记载，秋季登高与秋祭本属岁时节令的一部分。</p>"
    - id: history
      title: 简史
      body: "<p>2006 年 5 月，重阳节列入第一批国家级非物质文化遗产名录。</p><p>2012 年 12 月 28 日，十一届全国人大常委会第三十次会议修订通过《老年人权益保障法》，第十二条把农历九月初九定为老年节，自 2013 年 7 月 1 日起施行——这是本页唯一有法条原文可依的一段。</p><p>民政部每年在重阳节当月组织开展「敬老月」活动，伴随相关的创建与评选。从登高避灾到敬老爱老，是重阳在当代最显著的一次主题转换，两个侧面今天并存。</p><p>「敬老月」的设立让重阳多了一层制度性的存在：不只是当天，整个月都排着走访、体检、文艺演出一类的活动——节日的热量被拉长成一个月。</p><p>两条现代的硬事实把这个节日钉牢了。其一，重阳节列入 2006 年 5 月 20 日公布的第一批国家级非物质文化遗产名录；其二，2012 年 12 月 28 日修订通过的《中华人民共和国老年人权益保障法》第十二条明确规定「每年农历九月初九为老年节」，该法自 2013 年 7 月 1 日起施行——传统节日在法律条文里拿到一个正式名字，十二个节日里仅此一例。</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>登高：秋日爬山是最重要的一个动作，也是这个节日名字里「阳」字的季节注脚。赏菊与饮菊花酒：九月正是菊期。</p><p>佩茱萸、吃重阳糕一类做法在部分地区保留，各地详略不一。</p><p>今天的重阳有两层：一层是传统登高，一层是敬老——机关、社区、学校在敬老月期间组织的活动，是它现在最可见的形态。</p><p>写实的一条：这一天不放假，多数人的重阳是周末或工作日之外的活动。</p><p>茱萸今天不容易见到，重阳糕倒还常见——糕与「高」谐音，登高做不到，吃糕凑一个意思。民间语言里的这种变通，是节俗活下去的方式。</p><p>从登高避灾到敬老爱老，是重阳在当代最显著的一次主题转换，而且两层今天并存：传统的一层照旧登高赏菊，新添的一层由机关、社区、学校在敬老月期间组织走访与活动承担。这一天不放假，多数人的重阳是周末的一场登山，或一个电话——</p>"
    - id: food
      title: 特色食物
      body: "<p>菊花酒是重阳最有代表性的饮品，与赏菊同源。</p><p>重阳糕（花糕）在多地有做来过节的习惯。各地节令食物不同，来源分散，这里只写流传较广的两条。</p><p>菊花酒的酿法各家不同，如今自酿的家庭少了，菊花茶倒成了它的日常替身——节日饮品退化成日常饮品，也是常见的一条演变线。</p>"
    - id: end
      title: 结语
      body: "<p>重阳是十二个节日里唯一被写进法律条文的一个——它以「老年节」的名义有了法定身份。但它不放假，这一点决定了它在日历上的存在感和它的法律地位并不相称。</p><p>法律给了它名字，传统给了它内容，季节给了它理由——三层叠在一起，就是重阳今天的样子。</p>"
    - id: places
      title: 各地差异
      body: "<p>登高是各地共享的底色，登的地点各地不同；敬老活动在地方法与政策层面各异。</p><p>部分地区的重阳糕、放纸鹞等地方做法来源分散，这里不点名，只写流传较广的共性。</p><p>各地登高的地点早已从郊山扩到城市公园的高处，敬老活动则从家庭扩到社区——地点与形式在更新，「登高」与「敬老」两个动作没换。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>唐·王维《九月九日忆山东兄弟》：「独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。」重阳诗里最通行的作品，「每逢佳节倍思亲」因此成了节日思念的通用语。</p><p>宋·李清照《醉花阴·薄雾浓云愁永昼》：「佳节又重阳，玉枕纱厨，半夜凉初透。东篱把酒黄昏后，有暗香盈袖。」</p><p>茱萸、菊、登高、远望——重阳的四个固定符号。</p>"
  greetingsLabel: "重阳的相关说法"
  vocab:
    - { t: "重阳", p: Chóngyáng, m: "农历九月初九" }
    - { t: "重九", p: "Chóngjiǔ", m: "重阳的别称" }
    - { t: "阳数", p: "Yángshù", m: "传统以奇数为阳，九为最大的阳数" }
    - { t: "登高", p: Dēnggāo, m: "重阳爬山登高的习俗" }
    - { t: "赏菊", p: Shǎng jú, m: "重阳观赏开放的菊花" }
    - { t: "茱萸", p: Zhūyú, m: "重阳插戴的植物" }
    - { t: "菊花酒", p: "Júhuājiǔ", m: "重阳饮用的酒" }
    - { t: "踏秋", p: Tàqiū, m: "重阳出游的说法，与春日的踏青相对" }
    - { t: "敬老", p: "Jìnglǎo", m: "重阳今天的主题" }
    - { t: "老年节", p: Lǎoniánjié, m: "法律给九月初九定的现代名称" }
    - { t: "敬老月", p: "Jìnglǎoyuè", m: "每年重阳所在的月份，各地开展的敬老活动月" }
    - { t: "松鹤延年", p: Sōng hè yánnián, m: "传统祝寿纹样上的吉语" }
    - { t: "长寿面", p: Chángshòu miàn, m: "生日与祝寿场合吃的长面条" }
  greetings:
    - { t: "福寿康宁", p: Fú shòu kāng níng, m: "祝长者福寿双全、健康安宁" }
    - { t: "松鹤延年", p: Sōng hè yánnián, m: "传统纹样上的祝寿吉语" }
    - { t: "身体健康", p: "Shēntǐ jiànkāng", m: "重阳敬老场合最常说的一句话" }
  faq:
    - { q: "重阳节是法定节假日吗？", a: "不是。《全国年节及纪念日放假办法》第二条列出的七个全体公民放假节日是元旦、春节、清明、劳动节、端午、中秋、国庆，其中没有重阳节，所以这一天不放假。" }
    - { q: "为什么叫「重阳」？", a: "传统以奇数为阳数，九是最大的阳数；农历九月初九月日都是九，两个阳数相重，所以叫重阳，也叫重九。" }
    - { q: "法定意义上的「老年节」是什么？", a: "2012 年 12 月 28 日修订通过的《中华人民共和国老年人权益保障法》第十二条规定，每年农历九月初九为老年节；该法自 2013 年 7 月 1 日起施行。这是重阳在今天有法定身份的那一面。" }
    - { q: "为什么重阳要登高、赏菊、佩茱萸？", a: "九月正值秋高气爽，登高与出游是应季的活动；菊花在此时开放，茱萸也是一种秋季植物。这些都是传统节俗，各地的具体做法不一。" }
    - { q: "2027 年的重阳节是哪一天？", a: "由农历决定，本页逐年日期表会列出。2027 年及以后的数据取自本站节假日数据，与逐年节假日页一致。" }

- key: dongzhi
  name: "冬至"
  pinyin: "Dōngzhì"
  kind: traditional
  calendarTable: false
  desc: "冬至是二十四节气之一，太阳直射南回归线、北半球白昼最短的一天，也是民间节日，旧称亚岁。它不是法定假日；北方吃饺子、南方吃汤圆。"
  lede: "冬至是二十四节气之一，也是民间节日——太阳直射南回归线，北半球白昼最短，之后一天天变长。它是十二个节日里唯一靠天文学定义的一个，与清明同类。"
  facts:
    - { k: "别称", v: "亚岁、冬节、日短至" }
    - { k: "农历日期", v: "不按农历；落在冬至节气当日，农历日期每年不同" }
    - { k: "公历日期规则", v: "太阳到达黄经 270 度，公历落在 12 月 21 日至 23 日之间" }
  sections:
    - id: what
      title: 什么是冬至
      body: "<p>冬至是二十四节气之一：太阳直射南回归线的那一天，北半球白昼最短、夜晚最长。它同时也是一个民间节日，旧称亚岁、冬节。</p><p>它不是法定假日，不放假。</p><p>它是十二个节日里唯一靠天文学定义的一个——这一条决定了它与清明是同类，与其余九个不是。清明管春的开始，冬至管冬的深处，两个节气日各占一头。</p><p>「至」的意思是极点：冬至与夏至各占白昼长度的两个极端。冬至管的是「最短」，过了这天白昼开始回来——古人把这一天当作阴阳转换的节点，是有实测依据的。</p>"
    - id: when
      title: 冬至在什么时候
      body: "<p>冬至按太阳到达黄经 270 度划定，落在公历 12 月 21 日至 23 日之间，精确到时辰每年不同。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>从冬至起进入数九，每九天算一个「九」，数满九九八十一天，寒冬结束——这是一年里最后一段寒期的计法，冬至是「一九」的第一天。</p><p>数九从冬至当天起算，一九到九九共八十一天，大致覆盖 12 月下旬到次年 3 月上旬——「九尽桃花开」，数完九九，春天就真的到了。</p>"
    - id: origin
      title: 冬至是怎么定出来的
      body: "<p>二十四节气这套时间知识形成于黄河流域，以当地的天象、气温、降水与物候变化为基准，冬至是其中最早被测定的节点之一。</p><p>冬至这一天正午日影最长，古人很早就用圭表测影的方法来确定它——「定冬至」在历法编制里是起点性的一步，先把这一天的位置定准，一年的历才排得下去。</p><p>古代有冬至祭天的礼制，明清在北京设祭天场所，后来这处场所成了常见地标（今天的天坛）。冬至没有神话传说，这一节只写历法与礼制，不编故事。</p><p>圭表测影是古人手里最硬的天文仪器：一根立杆、一条影子，影长在冬至达到极值，年年可复测——冬至能成为最早被测定的节气，靠的是这份可重复。</p><p>二十四节气这套时间知识形成于黄河流域，以当地的天象、气温、降水与物候变化为基准，冬至是其中最早被测定的节点之一。古代还有冬至祭天的礼制，明清在北京设有专门的祭天场所——就是今天常见的那处地标建筑。</p>"
    - id: history
      title: 简史
      body: "<p>2006 年 5 月，「二十四节气」列入第一批国家级非物质文化遗产名录，冬至是其中之一；2016 年 11 月 30 日，「二十四节气——中国人通过观察太阳周年运动而形成的时间知识体系及其实践」列入教科文组织人类非物质文化遗产代表作名录——这里取的是冬至作为节气本身的身份，与清明页的切入角度错开。</p><p>数九与消寒图的传统：从冬至起数九个九天，每天描一笔或染一瓣梅花，八十一天后寒冬结束——消寒图是把难熬的日子画成盼头的办法。</p><p>冬至作为民间节日的分量在历史上高于今天——「冬至大如年」这句老话本身就是证据。这句是民间说法，不是制度记载。</p><p>「冬至大如年」的另一半是旧时的假期：历史上多个朝代在冬至放假，官府庆贺、民间贺节。今天的冬至不放假，那份「如年」的分量，就落进了一顿饭里。</p><p>非遗身份要分两层说。国内一层：二十四节气列入 2006 年 5 月公布的第一批国家级非物质文化遗产名录，冬至是其中之一。国际一层：2016 年 11 月 30 日，「二十四节气」作为中国人通过观察太阳周年运动而形成的时间知识体系，列入联合国教科文组织人类非物质文化遗产代表作名录——本页谈的是冬至这个节气本身如何被测定、被使用，视角与清明页不同，事实是同一条。</p>"
    - id: customs
      title: 冬至怎么过
      body: "<p>吃：北方吃饺子，南方吃汤圆，各地还有自己的节令食物。</p><p>数九与九九消寒图：从冬至起描一笔或染一瓣梅花，是冬至独有的一项活动。</p><p>祭祖与家庭聚餐在部分地区保留。</p><p>写实的一条：这一天不放假，它落在年底工作最集中的时候，多数人的冬至是一顿饺子或汤圆。</p><p>消寒图有很多版本：九字各九画的诗文版、八十一瓣的梅花版、铜钱纹版——共同点是每天填一笔，填满即春。它是给寒冬排日程的办法，也是一种缓释的倒计时。</p><p>祭祖与家庭聚餐在部分地区保留，有些地方把冬至当作与清明并列的祭祖节点。这一天不放假，又恰落在年底工作最集中的时候——对多数人来说，冬至就是一顿饺子或一碗汤圆，围桌的时间不长，但日子记住了。</p>"
    - id: food
      title: 特色食物
      body: "<p>饺子与汤圆是冬至最常被提起的南北对照。写法要准：北方多吃饺子、南方多吃汤圆，这是对通行现象的概括，两地内部都有各自的例外，不能写成硬性规则。</p><p>各地另有自己的冬至食物：部分地区吃赤豆糯米饭，部分地区吃面，部分地区喝酒酿一类冬令饮品。写成列举，不断言某地必吃。</p><p>这些食物有一个共同点：热食、耐寒，能在最短的白天里给人补充能量。</p><p>「冬至不端饺子碗，冻掉耳朵没人管」的民谚在北方流传很广；南方则以汤圆应节，取「团团圆圆」。民谚归民谚，吃饱穿暖是共同的底。</p><p>南北对照之外，各地还有自己的冬至食单：江南部分地区吃赤豆糯米饭，有的地方吃冬至面，也有的地方应景地喝一点冬酿酒、酒酿一类的冬令饮品——列举即可，不必断言某地必吃什么。它们有一个共同点：热食、顶饱，在最短的白天里给人补上实在的一口。</p>"
    - id: end
      title: 结语
      body: "<p>冬至是十二个节日里唯一由太阳位置直接定义的一个，和清明是同类。白昼在这一天短到极点，然后一天天回来——这也是它能撑起一个节日的原因。</p>"
    - id: places
      title: 各地差异
      body: "<p>主食对照是最稳的一条：北方饺子、南方汤圆。</p><p>江南部分地区冬至吃赤豆糯米饭、部分地区有喝冬令米酒的习惯；南方部分农村地区保留冬至祭祖。这几条来源相对分散，只写流传较广的共性。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>唐·白居易《邯郸冬至夜思家》：「邯郸驿里逢冬至，抱膝灯前影伴身。想得家中夜深坐，还应说着远行人。」</p><p>唐·杜甫《小至》：「天时人事日相催，冬至阳生春又来。刺绣五纹添弱线，吹葭六琯动浮灰。」</p><p>最短的白昼、最长的影、一阳来复——冬至的三个符号。</p>"
  greetingsLabel: "祝福语"
  vocab:
    - { t: "冬至", p: "Dōngzhì", m: "太阳直射南回归线的那一天，白昼最短" }
