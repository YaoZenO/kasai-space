  greetings:
    - { t: "新年快乐", p: Xīnnián kuàilè, m: "春节期间最通用的问候" }
    - { t: "恭喜发财", p: "Gōngxǐ fācái", m: "贺新年、祝财运的传统吉利话" }
    - { t: "万事如意", p: "Wànshì rúyì", m: "祝对方所有事情都顺心" }
  faq:
    - { q: "春节是法定节假日吗？法定放几天？", a: "是。按 2024 年 11 月修订、2025 年 1 月 1 日执行的《全国年节及纪念日放假办法》，春节放假 4 天，为农历除夕、正月初一至初三。此后通常放假调休 8 天，除夕逢周五时可以连休 9 天。" }
    - { q: "为什么春节的日期每年都不一样？", a: "春节按农历计算。农历一年约 354 天，比公历年少约 11 天，靠设置闰月补齐，所以农历正月初一落在公历上的位置每年前后浮动，最早在 1 月下旬、最晚到 2 月下旬。" }
    - { q: "除夕和春节是一回事吗？", a: "不是。除夕是农历腊月的最后一天，即正月初一的前一夜；春节当天是正月初一。法定假日的 4 天里同时包含这两天，但它们是两天。" }
    - { q: "1914 年以前有没有「春节」这个词？", a: "有，但指的不是过年。古籍里的「春节」多指立春或整个春季；把农历正月初一定名为春节，是二十世纪初历法改制之后的事。" }
    - { q: "属相从春节换，还是从立春换？", a: "通行算法以春节（农历正月初一）为界，国家标准 GB/T 33661-2017《农历的编算和颁行》也是这样规定的。立春起算属于八字命理的算法，只在排八字时用。" }
    - { q: "为什么 2027 年的放假安排标着「预计」？", a: "国务院办公厅通常在前一年 11 月前后发布次年通知。春节当天的农历与公历日期是确定的，可能变动的是放假区间的起止和调休上班日。" }

- key: qingming
  name: "清明节"
  pinyin: Qīngmíngjié
  kind: legal
  holidayKey: qingming
  calendarTable: false
  statutory: 1
  desc: "清明既是二十四节气之一，也是祭扫与踏青的日子，法定假日 1 天。它按太阳到达黄经 15 度划定，落在每年 4 月 4 日至 6 日之间，日期由太阳位置决定。"
  lede: "清明是十二个节日里最双面的一个：一边是墓园与祭扫，一边是郊野与春食。日期由太阳位置决定，每年都在 4 月 4 日至 6 日之间小幅游走。"
  facts:
    - { k: "别称", v: "踏青节、行清节、三月节" }
    - { k: "农历日期", v: "不按农历；落在清明节气当日，农历日期每年不同" }
    - { k: "公历日期规则", v: "太阳到达黄经 15 度，公历落在 4 月 4 日至 6 日之间" }
  sections:
    - id: what
      title: 什么是清明节
      body: "<p>清明既是二十四节气之一，也是传统节日。作为节气，它按太阳到达黄经 15 度的那一刻划定，落在公历 4 月 4 日至 6 日之间；作为节日，它是祭扫先人的日子，也是踏青春游的日子。节气与节日共用一个名字，在二十四节气里只有清明做到了这一点。</p><p>它同时吸收了上巳、寒食两个相邻节令的习俗——祭扫与冷食来自寒食，郊游与祓禊的余绪来自上巳。三个节令在日历上长期相邻，习俗互相渗透，逐渐并作一个清明。</p><p>它的公共形态因此是双面的：一边是墓园、鲜花与先烈祭奠，一边是郊游、风筝与青团。这两面同时存在、互不冲突——哀思与春光写在同一天，是清明最要写清的一点。</p><p>清明作为节气对农事的意义今天仍在：民间讲「清明前后，种瓜点豆」，节气是农事的时间表，节日是情感的日程表，两个身份在同一句农谚里各说各的。</p>"
    - id: when
      title: 清明节在什么时候
      body: "<p>清明不是农历节日，当天日期由太阳位置决定，精确到时辰每年不同，所以它在 4 月 4 日至 6 日之间小幅游走。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>法定假日 1 天，与周末相连时形成 3 天小长假，当天恰逢周三则只放一天。祭扫与踏青的出行叠加在一起，使 4 月初成为一个固定的高峰——它既是祭扫的时节，也是春游的时节，两类出行挤在同几天里。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>民间流传的说法把寒食与介子推连在一起：晋文公为逼隐居的介子推出山而下令焚山，介子推不出而死，后人在这一天禁火吃冷食。这是民间流传的说法，故事讲的是忠与忘，禁火讲的是纪念。</p><p>史实的线索是：禁火寒食的记载在汉代文献中已经出现，寒食作为节令比清明作为节日更早。两个日子相邻久了，习俗逐渐合并，如今多数人只过清明，寒食作为独立节令已经很淡。</p><p>上巳节在三月初三前后，踏青、祓禊的习俗也一同并入了清明——这解释了为什么清明既有扫墓又有出游。而节气本身远早于节日：二十四节气是农耕时代的时间知识，清明最初承担的是农事时间节点的作用，祭扫的意味是后来加进去的。</p><p>三源合一的方向可以从习俗上倒推：祭扫是寒食的，踏青是上巳的，冷食是寒食的，风筝秋千是上巳一路的——清明像是把春天前半段的各种日子，归拢到了一个名字下面。</p>"
    - id: history
      title: 简史
      body: "<p>2006 年 5 月，清明节列入第一批国家级非物质文化遗产名录。2016 年 11 月 30 日，中国申报的「二十四节气」列入教科文组织人类非物质文化遗产代表作名录，清明是其中之一——这里取的是它作为节气之一的身份，与冬至页的写法各有侧重。</p><p>2007 年 12 月国务院修改《放假办法》，自 2008 年 1 月 1 日起把清明与端午、中秋一同列为法定假日。这是清明第一次进入法定假日序列。</p><p>自 2008 年起，清明有了固定的 1 天法定假日，扫墓出行随之成为一个年度性高峰——从节气到节日再到法定假日，清明的身份一路在增加。</p><p>放假的天数虽只有 1 天，但祭扫多按家族的安排错峰进行，实际的清明高峰常在前后两三个周末铺开，不止法定那一两天。</p><p>还有一条与节气身份相关的硬事实：2016 年 11 月 30 日，「二十四节气」列入联合国教科文组织人类非物质文化遗产代表作名录，清明作为节气之一，也随之有了这份国际身份。再看放假这一面：2007 年 12 月国务院修改《放假办法》，自 2008 年起清明与端午、中秋一同首次成为法定假日</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>扫墓祭祖：清理墓地、献花、上香、供祭品，各地形式差异很大。清明正值春回，既是祭奠逝者的日子，也是人们走到户外的时节，扫墓与踏青自古并行，这一天也是一年里家族聚齐的固定节点。</p><p>踏青春游是清明的另一面；插柳与戴柳的旧俗在诗词里反复出现，放风筝、荡秋千一类户外游戏历史上也挂在清明名下。</p><p>今天的新形态：鲜花替代纸钱、网络祭扫兴起、集体举行的先烈祭奠仪式集中在清明前后。</p><p>它是唯一一个「哀思 + 出游」双主题的法定假日——这决定了它的出行形态与别的节日不同：既有返乡祭扫的车流，也有踏青出游的人流。</p><p>祭扫之外，不少家庭也把「讲家史」带进清明——趁着聚齐，说一说先人的来历。节日形式在变，「记住来处」这件事没有变。</p>"
    - id: food
      title: 特色食物
      body: "<p>青团是江南清明最具代表性的食物：艾草汁或麦青汁和糯米粉做成的绿团子，豆沙或莲蓉馅——绿是春天的颜色，馅是冬藏的甜。</p><p>各地春食还有江南的螺蛳、北方的馓子与子推馍一类面食、部分地区的润饼。这条线索的来历在寒食——冷食的日子不生火，食物多是提前做好、不需加热的品类，清明的吃食至今带着这个底子。</p>"
    - id: end
      title: 结语
      body: "<p>清明是这套节日里唯一由太阳位置决定的一个，所以它每年都在日历上小幅游走。它把祭奠与踏青放在同一天——这份双面性，也是它在十二个节日里最难被替代的原因。</p>"
    - id: places
      title: 各地差异
      body: "<p>江南吃青团，闽南吃润饼——薄饼皮包馅料卷着吃，也是冷食一系的吃法。北方的子推馍与面塑「寒燕」，与介子推的传说互相呼应，馍上捏的正是燕子的形状。</p><p>粤港澳一带把扫墓叫「拜山」，家族集体上山祭祖，是当地一年里最大的家族聚集。</p><p>各地祭扫的形式与日期细节差异不小，同一省内的做法也未必相同；这里只写流传较广的几条，不做「某地必如何」的断言。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>唐·杜牧《清明》：「清明时节雨纷纷，路上行人欲断魂。借问酒家何处有，牧童遥指杏花村。」清明诗里最有名的一首，雨、酒家、断魂三个意象全齐。</p><p>唐·韩翃《寒食》：「春城无处不飞花，寒食东风御柳斜。日暮汉宫传蜡烛，轻烟散入五侯家。」写的是寒食，节的底色与清明相通。宋·高翥《清明日对酒》：「南北山头多墓田，清明祭扫各纷然。纸灰飞作白蝴蝶，泪血染成红杜鹃。」</p><p>柳、雨、酒家——清明在诗词里几乎是固定搭配。</p>"
  greetingsLabel: "清明的相关说法"
  vocab:
    - { t: "清明", p: Qīngmíng, m: "二十四节气之一，也是祭扫与踏青的日子" }
    - { t: "寒食", p: Hánshí, m: "清明前一两日的旧节，当日不生火、吃冷食" }
    - { t: "扫墓", p: "Sǎomù", m: "到墓前清理并祭奠先人" }
    - { t: "踏青", p: Tàqīng, m: "春日出游，走在返青的郊野上" }
    - { t: "祭祖", p: "Jìzǔ", m: "祭祀祖先的仪式" }
    - { t: "青团", p: Qīngtuán, m: "用艾草汁和糯米做成的绿色团子" }
    - { t: "插柳", p: "Chā liǔ", m: "折柳枝插在门旁或戴在身上的旧俗" }
    - { t: "纸钱", p: "Zhǐqián", m: "祭祀时焚烧的纸制冥钱" }
    - { t: "祭品", p: "Jìpǐn", m: "摆在祭台上的供品" }
    - { t: "先人", p: Xiānrén, m: "已故的祖辈，祭文与口语中的称呼" }
    - { t: "慎终追远", p: Shènzhōng zhuīyuǎn, m: "语出《论语》，指慎重对待丧祭、追念远祖" }
    - { t: "文明祭扫", p: "Wénmíng jìsǎo", m: "用鲜花、植树代替烧纸的祭扫方式" }
    - { t: "烈士陵园", p: "Lièshì língyuán", m: "清明期间集中举行祭奠活动的纪念场所" }
  greetings:
    - { t: "一路平安", p: "Yīlù píng'ān", m: "家人出门扫墓时说的送别话" }
    - { t: "注意防火", p: "Zhùyì fánghuǒ", m: "清明祭扫期间最常听到的提醒" }
    - { t: "慎终追远", p: Shènzhōng zhuīyuǎn, m: "语出《论语》，认真办理丧祭、追念先人" }
  faq:
    - { q: "清明节是法定节假日吗？放几天？", a: "是。按现行《全国年节及纪念日放假办法》，清明放假 1 天（农历清明当日）。与相邻周末相连时形成 3 天小长假；如果当天恰逢周三，通常只在当日放假一天。" }
    - { q: "为什么清明节每年不是同一天？", a: "清明是二十四节气之一，按太阳到达黄经 15 度的那一刻划定，因此落在公历 4 月 4 日至 6 日之间，精确到时辰每年不同。它不像春节、端午、中秋那样按农历日期算。" }
    - { q: "清明和寒食是一回事吗？", a: "不是。寒食是清明前一两日的旧节，讲究禁火吃冷食；两个日子相邻久了，习俗逐渐合并。如今多数人只过清明，寒食作为独立节令已经很淡。" }
    - { q: "扫墓为什么集中在清明这几天？", a: "清明正值春回，既是祭奠逝者的日子，也是人们走到户外的时节，扫墓与踏青自古并行。这一天也是一年里家族聚齐祭祖的固定节点。" }
    - { q: "清明可以说「节日快乐」吗？", a: "通常不这样说。清明的主旨是祭扫与追念，日常多用「去扫墓」「回来路上小心」这类说法。这里只作中性说明，不评价哪种说法更对。" }

- key: duanwu
  name: "端午节"
  pinyin: "Duānwǔjié"
  kind: legal
  holidayKey: duanwu
  calendarTable: false
  statutory: 1
  desc: "端午在农历五月初五，法定假日 1 天，吃粽子、赛龙舟、挂艾草。它是十二个节日里非遗身份最硬的一个：2009 年列入人类非物质文化遗产代表作名录。"
  lede: "端午是农历五月初五，粽子与龙舟是它最广为人知的两张面孔。它也是十二个节日里非遗身份最硬的一个——2009 年列入教科文组织人类非物质文化遗产代表作名录。"
  facts:
    - { k: "别称", v: "端阳节、重午节、五月节、龙舟节、浴兰节" }
    - { k: "农历日期", v: "五月初五" }
    - { k: "公历日期规则", v: "农历五月初五，公历多在 5 月下旬至 6 月下旬之间浮动" }
  sections:
    - id: what
      title: 什么是端午节
      body: "<p>端午在农历五月初五，2008 年起成为法定假日，放假 1 天。「端午」之名与「五」相关：五月初五两个五相重，故有重午、端阳等别称——名字里的数字，就是它的日期。</p><p>它的核心习俗是四件套：吃粽子、赛龙舟、门挂艾草菖蒲、系五彩绳戴香囊。围绕五月初五这个日子，南北方共享同一套符号，差别只在做法与口味。</p><p>它是十二个节日里非遗身份最硬的一个：2006 年列入第一批国家级非物质文化遗产名录，2009 年 9 月列入教科文组织人类非物质文化遗产代表作名录，是中国首个入选的传统节日。</p><p>端午的符号密集度很高：粽子、龙舟、艾草、香囊、五彩绳，一样对应一种做法，一套下来把「五月驱邪」讲全了。别的节日要写散文，端午可以写清单。</p>"
    - id: when
      title: 端午节在什么时候
      body: "<p>端午按农历五月初五计算。农历平年约 354 天、靠闰月配平，所以五月初五落在公历上的位置每年前后浮动，大致在 5 月下旬到 6 月下旬。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>法定假日 1 天，通常与周末相连成 3 天小长假，逢周三则只放当天——端午落在周中的年份并不少见，这类场景在下面的年份表里能直接看到，不用另行解释。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>流传最广的说法是纪念战国楚国诗人屈原：屈原在五月初五投汨罗江，人们划船打捞、投米入水以防鱼虾伤其身——投米成了粽子，划船成了竞渡。这是民间流传的说法，把节俗的来历讲得有滋有味。</p><p>学界的一般看法是：端午的节俗——竞渡、采药、浴兰、系五色丝——早于屈原与伍子胥的人物传说，先有节俗，后有人物附会。不同地区纪念的对象也不同：部分地区纪念伍子胥，部分地区纪念孝女曹娥。纪念对象本身不统一，恰恰说明人物传说是后来附着上去的。</p><p>另一说是「恶月」论：农历五月湿热多疫，旧时视为恶月，重五之日更被视为不吉，祛病辟邪因此成为端午习俗的底色——挂艾草、浴兰汤、系五彩绳，全是这一路的做法。各家表述不一，聊备一说。</p><p>把两条线索摆在一起看反而清楚：节俗管「怎么做」，人物管「为什么」——竞渡和粽子不需要一个理由也能存在，但人总要给日子找一个纪念的对象，屈原是最响亮的那个。</p>"
    - id: history
      title: 简史
      body: "<p>2006 年 5 月，端午节列入第一批国家级非物质文化遗产名录；2009 年 9 月列入教科文组织人类非物质文化遗产代表作名录，是中国首个入选该名录的传统节日——非遗序列里的两个「第一批」，端午都占了。</p><p>2007 年 12 月国务院修改《放假办法》，自 2008 年 1 月 1 日起端午与清明、中秋一同成为法定假日。</p><p>龙舟从地方民俗竞渡发展为有正式规则的体育赛事，今天是端午最公开化的部分——江河湖面上的这一场竞渡，也是它最容易入镜的一面。</p><p>非遗身份之外，端午的当代传播还有一条线：龙舟作为运动项目的国际比赛越办越多，这项原本的区域性竞渡，如今在很多国家都有队伍。</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>吃粽子：箬叶或芦苇叶包糯米，南北味型与捆扎方式各不相同。赛龙舟：从祭祀性竞渡转为有规则的群众体育，直播让竞渡走出了江河两岸，看不了现场的可以看转播。</p><p>门挂艾草菖蒲、佩香囊、系五彩绳、沐兰汤——这是一套围绕「五月祛病辟邪」的做法。艾草与菖蒲气味特殊，挂在门上取辟邪除秽之意，是民间讲究，不是防疫手段。</p><p>作为一天的小长假，端午今天的日常形态是「一天假 + 一顿粽子 + 一场龙舟直播」，与它原本的整套节俗已经拉开距离。写实地说，这就是它现在的样子：旧符号都在，只是节奏快了。</p><p>粽子与龙舟之外的「小件」反而最有生活气：五彩绳系上就不再摘，等端午后的第一场雨剪下丢进水里；香囊的香料各家自己配。</p>"
    - id: food
      title: 特色食物
      body: "<p>粽子的馅料分咸甜两大阵营：肉粽、蛋黄粽、火腿粽一类咸口，豆沙、枣、莲蓉一类甜口。南北差异是这个节日最主要的食物话题，但不宜写成「南咸北甜」的绝对二分——两个方向在各地都有反例，咸甜之争更像是每年一度的谈资。</p><p>雄黄酒在传说里出现频率高，如今实际饮用已经很少，更多是一个符号。粽叶用箬叶还是芦苇叶、包成什么形状，各地各有各的习惯——四角、三角、长条，形状本身就是方言。</p><p>粽子的另一个话题是「粽叶用什么」：箬叶、芦苇叶、竹叶各有拥趸，叶子的香气直接进了米里——对讲究的人来说，粽叶就是粽子的第一味馅料。</p>"
    - id: end
      title: 结语
      body: "<p>端午是十二个节日里第一个拿到教科文组织人类非遗身份的。它的粽子有南北两派，纪念对象各地也不同——这种「同节不同解」，本身就是它的特点。</p>"
    - id: places
      title: 各地差异
      body: "<p>纪念对象的差异最典型：屈说、伍子胥说、曹娥说并存，各地各祭各的。龙舟的形制也各地不同——船长、桨手人数、装饰各有讲究，部分少数民族地区还有独木舟竞渡。</p><p>粽子的口味、粽叶与形状各地不同；挂艾草菖蒲、佩香囊的保留程度也参差。</p><p>凡涉及具体村寨与具体做法的对应关系，各来源出入不小，这里只写流传较广、彼此互证的部分。</p><p>各地差异最直观的有两处。一是纪念对象：屈原之说流传最广，但部分地区纪念伍子胥，也有地区纪念孝女曹娥——同一天、不同的名字，这本身就是端午「同节不同解」的证据。二是龙舟：各地船只的长度、桨手人数、装饰形制并不统一，有的偏重仪式，有的偏重竞速；部分少数民族地区还有自己一路的竞渡传统。粽子的口味差异就更日常了，几乎每个产区都有一套自己的包法。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>唐·文秀《端午》：「节分端午自谁言，万古传闻为屈原。堪笑楚江空渺渺，不能洗得直臣冤。」唐人已在追问这个节日的来历——可见纪念屈原的说法当时已经流行。</p><p>宋·陆游《乙卯重五诗》：「粽包分两髻，艾束著危冠。旧俗方储药，羸躯亦点丹。」艾、蒲、五色丝、龙舟鼓——端午在诗词里的符号体系非常固定。</p>"
  greetingsLabel: "祝福语"
  vocab:
    - { t: "端午", p: "Duānwǔ", m: "农历五月初五" }
    - { t: "端阳", p: Duānyáng, m: "端午的别称，取五月为阳极之说" }
    - { t: "粽子", p: Zòngzi, m: "箬叶或芦苇叶包裹糯米蒸煮的食物" }
    - { t: "龙舟", p: Lóngzhōu, m: "端午竞渡用的狭长彩船" }
    - { t: "赛龙舟", p: Sài lóngzhōu, m: "端午举行的水上竞渡" }
    - { t: "艾草", p: Àicǎo, m: "端午挂在门上的草本植物" }
    - { t: "菖蒲", p: Chāngpú, m: "与艾草同挂的叶形植物，叶片如剑" }
    - { t: "雄黄酒", p: "Xiónghuángjiǔ", m: "端午饮用的酒，也有洒在屋角的做法" }
    - { t: "香囊", p: Xiāngnáng, m: "装入香草的布口袋，多给小孩佩戴" }
    - { t: "五彩绳", p: "Wǔcǎishéng", m: "系在手腕上的五色丝线" }
    - { t: "屈原", p: Qū Yuán, m: "战国楚国诗人，端午最广为流传的纪念对象" }
    - { t: "伍子胥", p: "Wǔ Zǐxū", m: "部分地区端午纪念的历史人物" }
    - { t: "沐兰汤", p: "Mù lántāng", m: "端午用草药水洗澡的旧俗" }
  greetings:
    - { t: "端午安康", p: "Duānwǔ ānkāng", m: "近年通行的端午问候，取辟邪安健之意" }
    - { t: "端午快乐", p: "Duānwǔ kuàilè", m: "通用的节日问候" }
    - { t: "安康吉祥", p: "Ānkāng jíxiáng", m: "端午常见的四字祝词" }
  faq:
    - { q: "端午节是法定节假日吗？放几天？", a: "是。按现行《全国年节及纪念日放假办法》，端午放假 1 天（农历端午当日）。与相邻周末相连时形成 3 天小长假；如果当天恰逢周三，通常只在当日放假一天。" }
    - { q: "为什么端午每年日期都不一样？", a: "端午按农历计算。农历平年约 354 天，比公历年少约 11 天，靠闰月补齐，所以五月初五落在公历上的位置每年前后浮动，大致在 5 月下旬到 6 月下旬之间。" }
    - { q: "端午是为了纪念屈原吗？", a: "最广为流传的说法是纪念战国楚国诗人屈原，这是民间流传的说法；不同地区还有纪念伍子胥、曹娥等的说法。端午的节俗本身早于这些人物传说。" }
    - { q: "为什么端午要挂艾草和菖蒲？", a: "端午在农历五月，旧时认为这一时期湿热多疫；艾草与菖蒲有特殊气味，民间把它们挂在门上，取辟邪除秽之意。这是民间讲究，不是防疫手段。" }
    - { q: "端午是联合国教科文组织的非遗吗？", a: "是。2009 年 9 月，中国申报的端午节列入联合国教科文组织人类非物质文化遗产代表作名录；此前 2006 年它已列入第一批国家级非物质文化遗产名录。" }

- key: zhongqiu
  name: "中秋节"
  pinyin: Zhōngqiūjié
  kind: legal
  holidayKey: zhongqiu
  calendarTable: false
  statutory: 1
  desc: "中秋在农历八月十五，法定假日 1 天，赏月、吃月饼、盼团圆。嫦娥奔月、月饼流派、逐年日期与常见问题，都在这一页。"
  lede: "中秋是农历八月十五，秋季三个月的正中。赏月、吃月饼、盼团圆是它的三件套——它是十二个节日里唯一以「月」为全部视觉母题的一个。"
  facts:
    - { k: "别称", v: "月节、团圆节、八月节、拜月节" }
    - { k: "农历日期", v: "八月十五" }
    - { k: "公历日期规则", v: "农历八月十五，公历多在 9 月上旬至 10 月上旬之间浮动" }
  sections:
    - id: what
      title: 什么是中秋节
      body: "<p>中秋在农历八月十五，因处在秋季三个月的中点而得名。2006 年列入第一批国家级非物质文化遗产名录，2008 年起成为法定假日，放假 1 天。</p><p>核心三件套：赏月、吃月饼、盼团圆。中秋的意象几乎都围绕「圆」展开——圆月、圆饼、人团圆，三者互相呼应，一层套一层。</p><p>它是十二个节日里唯一以「月」为全部视觉母题的一个，这决定了它在诗词与绘画里的密度远高于别的节日——翻任何一本诗词选，「月」字出现最多的日子就是八月十五。</p><p>「中秋」的字面意思是秋季的中点：农历七、八、九月为秋，八月居中，十五又是当月的正中，所以这一天也叫「仲秋」——写法不同，意思一样，民间通用的是「中秋」。</p>"
    - id: when
      title: 中秋节在什么时候
      body: "<p>中秋按农历八月十五计算。农历一年约 354 天、靠闰月配平，八月十五落在公历上的位置每年浮动，大致在 9 月上旬到 10 月上旬。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>法定假日 1 天；按 2024 年修订确定的调休原则，国庆节放假如逢中秋节则合并放假 8 天——两个节日离得近甚至同一天的年份，就会出现这种连休，月圆与国庆同框。</p><p>中秋与国庆的距离每年都不同：近的年份前后脚连成超长假期，远的年份隔着小半个月。看某一年怎么连休，最直接的办法就是翻下面的年份表。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>嫦娥奔月是中秋最核心的神话：嫦娥服不死之药飞向月宫，从此与后羿分离。吴刚伐桂、玉兔捣药是月宫里的另外两个固定形象。这些是神话传说，不是史实，历代文献里的版本也不止一种——但月宫里住着谁的答案，两千年下来相当稳定。</p><p>真正的史实线索是「祭月」到「赏月」的转变：唐代已有中秋赏月的风气，宋代形成了明确的节日形态。皇家与民间的祭月仪式，逐渐变成举家望月的日常——仪式感淡了，团圆感浓了。</p><p>「月饼起源于元末起义传递字条」一类说法流传很广，但缺乏可靠文献支持，只能算一种流传较广的说法，这里不取。</p><p>月宫神话自成一套体系：嫦娥管奔月，吴刚管伐桂，玉兔管捣药，桂花落在人间正好是八月——天上的故事与地上的花期，在对得上号的日子里互相成全。</p><p>比起人物传说，更可靠的史实线索是「祭月」到「赏月」的转变：祭月是旧的礼俗，赏月是唐人兴起的雅事，宋代以后两件事渐渐合流，月亮从被供奉的对象变成了被欣赏、被寄托的对象。至于「月饼起于元末传递字条」一类说法，流传虽广却缺少可靠文献支持，听听就好，本页不作采信。</p>"
    - id: history
      title: 简史
      body: "<p>2006 年 5 月，中秋节列入第一批国家级非物质文化遗产名录。</p><p>赏月之风在唐代已盛，宋代把八月十五正式当作节日来过；月饼作为节令食品，到明清已经普及。把这三句按时间排开，就是中秋的简史：先有月亮，后有节，再有饼。</p><p>2007 年 12 月国务院修改《放假办法》，自 2008 年 1 月 1 日起中秋与清明、端午一同成为法定假日。</p><p>月饼的名字在宋代文献里已经出现，作为中秋专属节礼定型则更晚。今天习惯的「送月饼」是一套礼俗：送的是饼，认的是亲疏。</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>赏月是中秋夜最核心的动作；月饼是典型的「分着吃」的食物——一块饼按人头切开，分的不是甜度，是团圆。</p><p>家人聚餐与返乡：中秋团聚的强度仅次于春节。旧俗里的拜月、供月、摸秋、燃灯，如今各地保留程度不一——旧俗在退，团圆没退。</p><p>中秋是「有假但不长」的团圆型节日，这决定了它的当代形态：短途返乡、送月饼、抬头看一轮月亮。它撑不起一个长假，撑得起一顿团圆饭。</p><p>赏月这件事没有门槛：有月亮就行。这大概也是中秋生命力最强的原因——不挑地点、不挑家境，一家人搬到院子里、阳台上坐下，节日就开始了。</p><p>旧俗里还有一套围绕月亮的家庭仪式：拜月、供月，把瓜果月饼摆到院中，由女眷主拜；一些地方还有摸秋、燃灯的做法，如今保留程度各地不一，多一分少一分都属正常。</p>"
    - id: food
      title: 特色食物
      body: "<p>月饼按饼皮分酥皮、浆皮等，按馅料分咸甜两大方向；广式、苏式、京式等流派以饼皮和工艺区分。地域流派众多，没有「正统」一说——哪家都是正统，哪家也都不是。</p><p>时令搭配各地有各自的组合：桂花酒、桂花糕、芋头、螃蟹、柚子一类秋季物产常在同一段时间出现。</p><p>月饼既是节礼也是高糖高油食品，近年出现减糖、小规格的做法——这是事实描述，不是评价。礼盒越做越大、单块越做越小的两股力，同时存在。</p><p>新式馅料年年有创新，传统五仁的争论也年年有——争的是馅，守的是「这一天要吃块圆饼」的仪式本身。</p><p>月饼的流派之争主要是「饼皮与工艺」之争：广式糖浆皮、苏式酥皮层叠、京式自成一路，各地还有自己的地方风格，馅料则咸甜兼备。桌上的时令搭配也不少——桂花酒、桂花糕、芋头、柚子、螃蟹，各地有各地的一套。近年月饼还出现了减糖、小规格的做法，当零食吃的多了，当「节礼」分食的本义倒没变。</p>"
    - id: end
      title: 结语
      body: "<p>中秋把「月圆」和「人圆」绑在一起，这在十二个节日里是独有的。它的假期只有 1 天，却是全年第二个返乡高峰——这两件事之间的落差，就是它今天的样子。</p>"
    - id: places
      title: 各地差异
      body: "<p>月饼流派是中秋最直观的地域差异：广式、苏式、京式等以饼皮和工艺区分，馅料与甜咸取向各成体系。</p><p>拜月在部分地区保留得更完整；厦门一带的中秋博饼、潮汕的拜月娘，是两地流传较广的中秋活动。</p><p>港澳台与少数民族地区的中秋过法各有特色，这里只陈述现象，不比较高下。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>宋·苏轼《水调歌头·明月几时有》：「人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。」中秋词的顶峰，「婵娟」从此成了月亮的代称。</p><p>唐·王建《十五夜望月寄杜郎中》：「今夜月明人尽望，不知秋思落谁家。」唐·张九龄《望月怀远》：「海上生明月，天涯共此时。」</p><p>月宫、嫦娥、玉兔、桂树——四个固定符号，构成中秋的全部意象库。</p>"
  greetingsLabel: "祝福语"
  vocab:
