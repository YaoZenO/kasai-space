- key: yuanxiao
  name: "元宵节"
  pinyin: Yuánxiāojié
  kind: traditional
  calendarTable: false
  desc: "元宵节在农历正月十五，是春节年俗的收尾，不放假。看灯、猜灯谜、吃元宵（汤圆）；道教称上元，与七月十五中元配对。"
  lede: "元宵节在农历正月十五，是春节庆贺活动的最后一站。它是十二个节日里唯一的「夜」的节日——所有重要动作都发生在入夜之后：看灯、猜灯谜、煮一碗汤圆。"
  facts:
    - { k: "别称", v: "上元节、灯节、元夕、正月十五" }
    - { k: "农历日期", v: "正月十五" }
    - { k: "公历日期规则", v: "农历正月十五，公历多在 2 月上旬至 3 月上旬之间浮动" }
  sections:
    - id: what
      title: 什么是元宵节
      body: "<p>元宵节在农历正月十五，是春节年俗的收尾节点。两个核心：吃元宵（汤圆）与看灯——灯会、猜灯谜是它最公开的一面。</p><p>它不是法定假日，不放假。《全国年节及纪念日放假办法》第二条列出的七个全体公民放假节日里没有元宵节——这一点值得写显眼，因为读者最常问：这么热闹的节日，为什么不上放假名单。</p><p>道教体系里它叫「上元」，与七月十五的<a href=\"/library/zhongyuan/\">中元节</a>、十月十五的下元配对，对应天官赐福、地官赦罪、水官解厄。三元配齐，一年有三个「十五节」，元宵是头一个。</p><p>从日历上看，元宵是正月里最后一个「大日子」：过了这一晚，年过完，各项工作与农事转入正轨——古人给它安排的节目（灯、谜、汤圆、社火），全是热热闹闹的告别式。</p>"
    - id: when
      title: 元宵节在什么时候
      body: "<p>元宵按农历正月十五计算。正月是一年中第一个月，十五是第一个月圆之夜；农历阴阳合历、靠闰月配平，所以它落在公历 2 月上旬至 3 月上旬之间浮动。逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>它是春节的终点：从除夕算起，到正月十五正好半个月。作为非法定节日，这一页不列放假区间，只列日期与星期——看灯要挑下班后的时间。</p><p>元宵与春节的关系还体现在假期上：春节假期从不覆盖到元宵，所以看灯、煮汤圆都发生在假期之外——这也是为什么它虽热闹，却总带着一点「下班后的节日」的性质。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>民间流传的说法里，名叫元宵的宫女借东方朔之计，在这一天与家人团聚，正月吃汤圆的习俗由此而来；又说汉文帝为纪念平定诸吕之乱而定正月十五为节。这些都是民间流传的说法，讲得圆满，当不得信史。</p><p>更有文献分量的一条：正月十五燃灯的习俗，与佛教正月十五日燃灯供佛的做法有关，学者认为二者有渊源。道教的三元体系，则解释了「上元」这个名称的来历——佛道两家的仪式都往这一天堆。</p><p>几条线索叠在一起，才有了今天的元宵：灯来自佛道两家的仪式，汤圆与团圆来自民间的年俗。</p><p>「元宵」这个名字本身就是食物与节日的互借：节因食得名，食因节走遍全国——北方叫元宵，南方叫汤圆，两个名字分了家，节日还是同一个。</p><p>关于起源有几条不同性质的线索。传说一类：民间流传宫女元宵借东方朔之计在正月十五与家人团聚、吃汤圆的习俗由此而来；一说汉文帝为纪念平定诸吕之乱而把正月十五定为节日——这些按流传说法对待即可。史实一类：正月十五燃灯与佛教此日燃灯供佛的做法有渊源，学者多有讨论；道教又把这一天定为上元，名称的来历就清楚了。几条线索各管一段，不必强行归一。</p>"
    - id: history
      title: 简史
      body: "<p>元宵节已列入国家级非物质文化遗产名录。历史上元宵的灯期逐步延长：汉代只有一天，唐代延长，明代曾达十天——赏灯是逐代加码的。各来源对具体天数记载不一，「逐步延长」是方向上一致的说法。</p><p>猜灯谜是后起的：猜谜之风掺入灯会之后，才成为固定项目——灯是老的，谜是新的。</p><p>灯会的公共性自古就强：旧时元宵夜官民同乐、金吾不禁，是一年里少有的「允许夜行」的日子。今天灯会的门票与预约制是新的，人山人海这一点，跟千年前没有分别。</p><p>灯期在历史上是逐代加码的：汉代赏灯的日子不长，唐代明显延长，明代曾有长达十天的记载——具体天数各来源说法不一，但「越放越长」这个方向是稳的。猜灯谜反而是后起的节目，是猜谜之风掺进灯会之后才固定下来的，论资历排不到看灯前面。</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>看灯：灯会与猜灯谜是元宵最公开的一面，各地灯会各有来路，灯彩风格差别很大。</p><p>吃元宵（汤圆）：北方称元宵、南方称汤圆，做法不同，下文食物一节细说。民间表演：龙灯、舞狮、踩高跷、扭秧歌，多集中在正月十五前后——正月十五是民间表演密度最高的一天。</p><p>必须写实的一条：这一天不放假。多数人是在下班后看灯、在家里煮一碗汤圆，白天照常上班。过了正月十五，春节这套仪式就正式结束了。</p><p>灯谜是元宵里最「文」的一项：谜面贴在灯上，猜中有彩。今天灯谜搬进了商场与线上，载体变了，谜面还是那套拆字会意的老功夫。</p><p>街头的热闹不止灯：龙灯、舞狮、踩高跷、扭秧歌，多集中在正月十五前后，北方统称社火。旧时还有元宵夜结伴行走「走百病」的说法，过桥摸钉，祈愿祛病</p>"
    - id: food
      title: 特色食物
      body: "<p>元宵与汤圆是同一种圆形糯米食品：糯米粉外皮，馅料从芝麻花生到鲜肉不等，甜咸都有。</p><p>区别在做法：北方的「摇元宵」把馅料放进糯米粉里滚出来，南方的「包汤圆」用水磨面团像包饺子一样包馅。摇与包，正是南北做法之差——一个滚出来，一个包出来。</p><p>因为要下锅煮，它也一直是正月里最方便的家常甜食。</p><p>煮元宵与煮汤圆的火候不同：摇出来的元宵粉层松，汤容易浑，讲究现煮现吃；包出来的汤圆皮薄滑，冷冻保存也稳——这也是超市冷柜里见到的多是汤圆的原因之一。</p>"
    - id: end
      title: 结语
      body: "<p>元宵是这套节日里唯一的「夜」的节日——所有重要动作都发生在入夜之后。它既是收尾也是分界：过完正月十五，春节结束，一年正式开始。</p>"
    - id: places
      title: 各地差异
      body: "<p>摇元宵与包汤圆是最直观的南北差异；各地灯会各有来路，形式与灯彩风格差别很大。</p><p>部分地区正月十五还有祭祖、串门、送灯等地方性做法；港澳台与海外华人社区的元宵灯展也各有规模。</p><p>具体到某一场灯会的身份与始末，各来源出入不小，这里不点名，只写共性。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>宋·辛弃疾《青玉案·元夕》：「众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。」元宵词里最有名的一段。</p><p>唐·苏味道《正月十五夜》：「火树银花合，星桥铁锁开。暗尘随马去，明月逐人来。」「火树银花」从此成了灯会的代称。</p><p>灯、月圆、不夜城——元宵在诗词里的三个固定符号。</p>"
  greetingsLabel: "祝福语"
  vocab:
    - { t: "元宵", p: Yuánxiāo, m: "正月十五，也指这一天吃的糯米团子" }
    - { t: "汤圆", p: Tāngyuán, m: "南方对正月十五糯米团子的称呼" }
    - { t: "上元", p: Shàngyuán, m: "元宵节的道教称谓，对应中元、下元" }
    - { t: "灯节", p: Dēngjié, m: "元宵的别称，因遍悬花灯而得名" }
    - { t: "花灯", p: Huādēng, m: "元宵节悬挂的彩灯" }
    - { t: "灯谜", p: Dēngmí, m: "写在花灯上供人猜的谜语" }
    - { t: "灯会", p: "Dēnghuì", m: "集中展出花灯的活动" }
    - { t: "闹元宵", p: Nào yuánxiāo, m: "说正月十五热闹过节的老话" }
    - { t: "猜灯谜", p: Cāi dēngmí, m: "元宵夜的常规节目" }
    - { t: "龙灯", p: Lóngdēng, m: "舞动的龙形灯" }
    - { t: "秧歌", p: Yāngge, m: "北方元宵前后的街头表演" }
    - { t: "踩高跷", p: Cǎi gāoqiāo, m: "踩在高跷上行走的表演形式" }
    - { t: "走百病", p: "Zǒu bǎibìng", m: "旧时元宵夜结伴行走、祈求祛病的说法" }
  greetings:
    - { t: "元宵快乐", p: Yuánxiāo kuàilè, m: "正月十五最常用的问候" }
    - { t: "团团圆圆", p: Tuántuán yuányuán, m: "祝一家聚齐、事情圆满" }
    - { t: "花好月圆", p: Huā hǎo yuè yuán, m: "传统吉语，喻美好圆满" }
  faq:
    - { q: "元宵节是法定节假日吗？", a: "不是。《全国年节及纪念日放假办法》第二条列出的七个全体公民放假节日是元旦、春节、清明、劳动节、端午、中秋、国庆，其中没有元宵节，所以这一天不放假。" }
    - { q: "元宵和汤圆是一回事吗？", a: "说的是同一种圆形糯米食品，区别在于做法：北方多是把馅料放进糯米粉里「滚」出来的（摇元宵），南方多是像包饺子一样「包」出来的。叫哪个名字，各地习惯不同。" }
    - { q: "为什么元宵节要在正月十五？", a: "正月是一年中第一个月，十五是第一个月圆之夜。它同时是一年中第一个月圆日，也是春节庆贺活动的最后一站——过完这一天，年就算过完了。" }
    - { q: "为什么叫「上元节」？", a: "道教把正月十五、七月十五、十月十五分别称为上元、中元、下元，对应天官赐福、地官赦罪、水官解厄。正月十五因此有了「上元」这个叫法。" }
    - { q: "2027 年的元宵节是哪一天？", a: "由这一天所在的农历决定，页面上逐年日期表会列出。本页 2027 年及以后的数据取自本站节假日数据，与逐年节假日页一致。" }

- key: qixi
  name: "七夕节"
  pinyin: Qīxījié
  kind: traditional
  calendarTable: false
  desc: "七夕在农历七月初七，不放假。它原本的主题是乞巧——女子向织女祈求手巧；牛郎织女的传说是它的另一条线。今天它被普遍当作表达情感的节日。"
  lede: "七夕在农历七月初七，旧称乞巧节、女儿节。它有两条线：一条是星空里的牛郎织女，一条是人间女子的乞巧——今天被更多人看见的是前一条，时间更久的是后一条。"
  facts:
    - { k: "别称", v: "乞巧节、女儿节、七巧节、双七" }
    - { k: "农历日期", v: "七月初七" }
    - { k: "公历日期规则", v: "农历七月初七，公历多在 7 月下旬至 8 月下旬之间浮动" }
  sections:
    - id: what
      title: 什么是七夕节
      body: "<p>七夕在农历七月初七，月与日同为「七」，故有「双七」之称；旧称乞巧节、女儿节。</p><p>它有两个来源：一是牛郎织女的传说，二是妇女向织女祈求巧手的习俗。「七夕就是中国情人节」是近年常见的类比说法，不是它原本的面目——它的原本主题是乞巧，爱情是后来越来越响的那条线。</p><p>它不是法定假日，不放假。今天它被普遍当作表达情感的节日；这一页把古今两层并列写清，不评判哪层更真。</p><p>重日的节日家族（一月一、二月二、三月三、五月五、七月七、九月九）里，七夕是唯一以「夜」为核心场面的：白天准备，入夜乞巧，看的是天上那一河两星。</p>"
    - id: when
      title: 七夕在什么时候
      body: "<p>七夕按农历七月初七计算。农历阴阳合历、靠闰月配平，七月初七落在公历 7 月下旬至 8 月下旬之间浮动；逐年日期由本站节假日数据算出，与逐年节假日页一致。</p><p>它总在盛夏——传说里的银河与夜空是有季节感的，夏夜看银河最清楚，牛郎织女两颗星就在银河两岸。非法定节日不列放假区间，只列日期与星期。</p><p>农历七月对应公历多在 8 月，暑热未退、夜风渐起——传说把相会安排在这个季节，多少也沾了夏夜观星最舒服的光。</p>"
    - id: origin
      title: 起源与传说
      body: "<p>民间传说里，放牛的青年与天上的织女成家，被王母划银河隔开，只准每年七月初七相会一次，喜鹊搭桥。这是民间传说，版本很多，各地细节不一。</p><p>文献的线索更硬：牛郎织女的形象在汉代已经出现，《古诗十九首》里就有以牵牛星、织女星为题的作品——这是最早把传说写成诗句的文字之一，比多数节日传说「入诗」都早。</p><p>乞巧早于浪漫：七夕原本是以女子的手工技艺为核心的节俗，爱情叙事是后来变得突出的部分。</p><p>传说与天象是拧在一起的：银河两岸确有牛郎星与织女星，两星隔河相望，亮度相近——古人抬头看得见，故事就编得实，这是它流传两千年的天文底气。</p><p>文献的底子比传说更硬：牛郎织女的形象在汉代已经出现，《古诗十九首》里的《迢迢牵牛星》是最早把它写成诗句的作品之一——「迢迢牵牛星，皎皎河汉女」，两颗星隔银河相望的画面，两千年前就写定了。另一点常被忽略：乞巧早于浪漫。这个节原本以女子的手工技艺为核心，牛女的爱情叙事是后来才变得突出的部分。</p>"
    - id: history
      title: 简史
      body: "<p>汉代文献中已有牵牛织女的形象；唐代七夕乞巧之风很盛，穿针、结彩楼、卖「磨喝乐」一类做法在当时的笔记里有记载。</p><p>宋元时期七夕的节俗更见繁盛，磨喝乐（泥塑小偶人）是当时流行的节令玩物。</p><p>现代社会的变化可被观察：七夕从一个以女性技艺为核心的节俗，逐渐变成以情侣互赠礼物为主要场景的日子——这条变化线清晰可考，不需要美化，也不需要惋惜。</p><p>乞巧的「巧」指向女红：针线、织作、巧手。旧时评一个女子能干，绕不开这个字——七夕是把「手艺」郑重其事放进节日的唯一一个。</p><p>唐宋是乞巧之风最盛的时期：月下穿针、结彩楼乞巧，街市上还卖一种叫「磨喝乐」的泥塑小偶人，这些在当时的笔记里都有记载。再看今天的转变：七夕从一个以女性技艺为核心的节俗，逐渐变成以情侣互赠礼物、聚餐为主要场景的日子——这是一个可以被直接观察到的事实，谈不上衰败，也谈不上复古，就是用途变了。</p>"
    - id: customs
      title: 习俗与今天怎么过
      body: "<p>旧俗：月下穿针乞巧、看喜蛛结网卜巧、供奉瓜果、妇女聚会。各地形式不一，核心都是「向织女讨手艺」。</p><p>今天的形态：互赠礼物、聚餐、看夜空；商家把这一天做成促销节点。写实现象，不臧否。</p><p>必须写实的一条：这一天不放假，多数人的七夕是在工作日下班后过的。部分地区保留了更传统的乞巧活动。</p><p>乞巧的仪式各地繁简不一，但都带一点「考试」的意味：穿针比快慢，结网比巧拙——手艺好不好，节日当天见分晓。</p><p>把旧俗排一遍：月下对月穿针，比谁先穿过；把小蜘蛛放进盒里过一夜，看结网的疏密算「得巧」多少；庭院里摆上瓜果「摆巧案」，有的地方还有妇女聚会拜织女的仪式。今天照做的已经不多，多数人的七夕不放假，是下班后的一顿饭——节日还在，过法换了主角。</p>"
    - id: food
      title: 特色食物
      body: "<p>巧果是七夕的油炸点心，部分地区流传至今。</p><p>乞巧时的供品以瓜果为主——这与它在夏末秋初的时令有关。各地七夕食俗差别很大，不存在全国统一的一味「七夕必吃」。</p><p>巧果的做法各地不一，多是油炸的小面点，做成花果鱼虫的形状——「巧」字同样用在吃食上，形状越巧越好。</p><p>供桌上的瓜果另有讲究：七夕在夏末秋初，正值瓜果上市，供品以时令瓜果为主——这也是这个节日食俗的底色：随季节走，不刻意。真正称得上「节令点心」的只有巧果一种，且各地做不做、怎么做，差别都很大，不存在全国统一的一味「七夕必吃」。</p>"
    - id: end
      title: 结语
      body: "<p>七夕有两条线：一条是星空里的牛郎织女，一条是人间女子的乞巧。今天被更多人看见的是前一条，时间更久的是后一条。</p><p>两条线并不争位：传说给了它星空，乞巧给了它人间——七夕的全部诗意，都在这两层之间来回。</p>"
    - id: places
      title: 各地差异
      body: "<p>乞巧是各地共享的底色，做法各地不同：月下穿针、看蛛网、摆巧案等。</p><p>部分地区保留了较完整的乞巧习俗并已进入各级非遗名录，甘陇一带的乞巧活动常被提及。</p><p>港澳台与海外华人社区的七夕活动多与情感表达相关，是晚近的演化。</p>"
    - id: poems
      title: 诗词与文化意象
      body: "<p>汉·《古诗十九首·迢迢牵牛星》：「迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。」最早的七夕诗之一。</p><p>宋·秦观《鹊桥仙·纤云弄巧》：「柔情似水，佳期如梦，忍顾鹊桥归路。两情若是久长时，又岂在朝朝暮暮。」唐·杜牧《秋夕》：「银烛秋光冷画屏，轻罗小扇扑流萤。天阶夜色凉如水，卧看牵牛织女星。」</p><p>银河、鹊、针线、流萤——七夕的四个固定符号。</p>"
  greetingsLabel: "祝福语"
  vocab:
