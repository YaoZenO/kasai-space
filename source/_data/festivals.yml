# 节日文化数据 —— /library/<slug>/ 页面族（12 页）的唯一数据源。
# 上游：FESTIVAL-PRD / FESTIVAL-CONTENT（唯一内容源）/ FESTIVAL-DESIGN 三份 2026-10-27 文档。
# 结构：meta（updated / notice / images）+ festivals[]（key、name、pinyin、kind、holidayKey、
#       statutory、calendarTable、desc、lede、facts、sections[]、vocab[]、greetings[]、faq[]）。
# 纪律（均有测试断言，test/festival-e2e.js）：
#   1. 本文件正文不含日期——逐年日期由 helper 从 holidays.yml 现算（PRD §5.1 方案 C）。
#   2. 中文长文案一律单行双引号书写，不用折叠标量（E-042）；日期带引号防 Date 解析（E-028）。
#   3. 内容口径以内容清单为准：❌ 不写，⚠️ 已弱化措辞或删去；不虚构人物、年代、文献。
#   4. sections[].id 锁死 11 个约定值，锚点只看 id；title 允许变体（裁决 15-2）。
#   5. qingming/zhongyuan/laba/chongyang 的 greetingsLabel 为「相关说法」，其余「祝福语」（裁决 15-3）。
#   6. 配图三要素（作者/授权/原文件页）不得删；css: true 表示该页走 CSS 纹样降级分支。

