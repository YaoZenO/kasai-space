# 节假日数据 —— /holidays/ 页面的唯一数据源
#
# 结构：
#   meta.updated    本文件最后核对日期（页面「更新于」由它渲染，不读文件 mtime——E-028 教训）
#   meta.official   本年安排是否已由国务院办公厅正式公布
#   meta.notice     页面顶部的说明文案
#   meta.sources    数据来源（页面底部原样列出）
#   years[]         年份列表，目前只有一项。新增年份时在数组尾部追加一项即可，模板按第一项渲染。
#     holidays      法定节假日：date 是「节日当天」，start/end 是放假区间（含首尾）
#                   statutory 是其中真正的法定假日天数；makeup 是调休上班日（无则空数组）
#     festivals     不放假的其他节日与纪念日
#     terms         二十四节气（按北京时间计）
#
# 纪律：
#   1. 日期一律写成带引号的 "YYYY-MM-DD"。不加引号时 js-yaml 会解析成 Date 对象，
#      模板直出会变成 "Sat Feb 06 2027 00:00:00 GMT+0000"（E-028 踩过）。
#   2. 预计值必须能在数据里看出「预计」：official: false + label: 预计。
#      官方通知发布后只改本文件：official 改 true、label 改「官方」，再校准 start/end/makeup。
#   3. 不写没有来源的日期。2027 年法定节假日的公历日期已核对（春节 2 月 6 日等），
#      放假区间与天数按 2025 年起施行的规则推算，属预计值，不得表述为官方安排。

meta:
  updated: "2026-10-21"
  official: false
  # 说明文案写成单行：中文段落用 YAML 的折叠标量（>-）换行时，折行处会被插进空格，
  # 渲染出来是「通知 （2026 年」这种夹空格的句子。
  notice: "2027 年的放假安排还没有官方版本。国务院办公厅通常在前一年 11 月前后发布次年通知（2026 年的通知发布于 2025 年 11 月 4 日），所以下面这些放假区间是按 2024 年 11 月修订、2025 年 1 月 1 日起施行的《全国年节及纪念日放假办法》以及近年调休惯例推算出来的预期值，不是国务院公布的安排。节日当天的公历日期本身是确定的，可能变动的只有放假区间的起止与调休上班日。"
  sources:
    - label: "国务院办公厅关于 2026 年部分节假日安排的通知（人民网转载，现行规则依据）"
      url: "https://cpc.people.com.cn/BIG5/n1/2025/1105/c64387-40596912.html"
      date: "2025-11-04"
    - label: "令和 9 年（2027）二十四节气时刻（日本国立天文台，换算北京时间）"
      url: "https://eco.mtk.nao.ac.jp/koyomi/yoko/2027/rekiyou272.html"
      date: "2026-02-02"

years:
  - year: 2027
    label: "预计"
    official: false
    zodiac: "丁未羊年"
