    label: "官方"
    # 生肖年：春节落进公历哪一年就算那一年的生肖。2026=丙午马、2027=丁未羊，与参考站一致。
    zodiac:
      ganzhi: "丁未"
      animal: "羊"
      element: "火"
    official: true
    holidays:
      - id: yuandan
        name: "元旦"
        pinyin: "Yuándàn"
        date: "2027-01-01"
        start: "2027-01-01"
        end: "2027-01-03"
        days: 3
        statutory: 1
        arrange: "周五至周日，与周末连休"
        desc: "公历新年的第一天。法定假日只有 1 天，与周末相连就成了 3 天小长假。"
      - id: chunjie
        name: "春节"
        pinyin: "Chūnjié"
        date: "2027-02-06"
        # 官方通知（2026-11-05 发布）：2/5（除夕、周五）至 2/13（正月初八、周六）
        # 放假调休共 9 天，1/31（周日）、2/14（周日）上班。
        start: "2027-02-05"
        end: "2027-02-13"
        days: 9
        statutory: 4
        arrange: "周五至周六"
        desc: "农历正月初一，除夕也在假期内。年夜饭、红包、守岁都集中在这几天，也是全年最大规模的人口迁徙。"
      - id: qingming
        name: "清明节"
        pinyin: "Qīngmíngjié"
        date: "2027-04-05"
        start: "2027-04-03"
        end: "2027-04-05"
        days: 3
        statutory: 1
        arrange: "周六至周一"
        desc: "既是节气也是节日。清明节气每年落在 4 月 4 日至 6 日之间，扫墓与踏青同期。"
