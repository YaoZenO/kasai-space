# 节假日数据 —— /holidays/ 页面族（/holidays/<年份>/）的唯一数据源
#
# 年份范围 2025-2036。2025、2026 两年为国务院办公厅正式通知（已逐条核对）；
# 2027-2036 为按同一规则推算的预期值，页面标注「预计」。
# 2021-2024 未收录：参考站旧版表格的年份数据未逐条核对，不录入。
#
# 结构：meta（说明 / 来源 / 通用文案）+ years[]（每年：法定节假日、其他节日、调休上班日、农历标签）
# 纪律：
#   1. 日期一律写成带引号的 "YYYY-MM-DD"。不加引号时 js-yaml 会解析成 Date 对象，
#      模板直出会变成 "Sat Feb 06 2027 00:00:00 GMT+0000"（E-028）。
#   2. 中文长文案一律写单行，不用 YAML 折叠标量 —— 折行处会被插进空格（E-042）。
#   3. 「预计 / 官方」由数据里的 label 决定，不由文案决定。

meta:
  updated: "2026-10-22"
  notice: "2027 年的放假安排还没有官方版本。国务院办公厅通常在前一年 11 月前后发布次年通知，所以 2027 年起的放假区间是按《全国年节及纪念日放假办法》与近年调休惯例推算出来的预期值。节日当天的公历日期本身是确定的，可能变动的只有放假区间的起止与调休上班日。"
  sources:
    - label: "国务院办公厅关于 2026 年部分节假日安排的通知（人民网转载，现行规则依据）"
      url: "https://cpc.people.com.cn/BIG5/n1/2025/1105/c64387-40596912.html"
      date: "2025-11-04"
    - label: "国务院办公厅关于 2025 年部分节假日安排的通知（中国政府网）"
      url: "https://www.gov.cn/zhengce/zhengceku/202411/content_6986383.htm"
      date: "2024-11-12"
    - label: "2027 年之后各年的节假日日期（推算值来源）"
      url: "https://studycli.org/zh-CN/chinese-holidays/"
      date: "2026-10-22"
  faq:
    - q: "2027 年的放假安排官方公布了吗？"
      a: "还没有。国务院办公厅通常在前一年 11 月前后发布次年通知，2026 年的通知发布于 2025 年 11 月 4 日。本页 2027 年起的放假区间是推算值。"
    - q: "2027 年春节是哪一天？"
      a: "2 月 6 日，星期六，农历正月初一；除夕是 2 月 5 日。按预计安排 2 月 5 日至 12 日放假，共 8 天。"
    - q: "2027 年国庆放几天？"
      a: "预计 10 月 1 日（星期五）至 7 日（星期四）放假，共 7 天。其中法定假日 3 天，其余由周末和调休补足。"
    - q: "2027 年中秋是哪一天？"
      a: "9 月 15 日，星期三，农历八月十五。当天是周三，前后接不上周末，预计只放当天 1 天。"
    - q: "一年到底有几天法定节假日？"
      a: "13 天，落在七个节日上：元旦 1 天、春节 4 天、清明 1 天、劳动节 2 天、端午 1 天、中秋 1 天、国庆 3 天。这是 2024 年 11 月修订《全国年节及纪念日放假办法》后、自 2025 年 1 月 1 日起执行的安排。"
  prose: |
    <h2>中国法定节假日是怎么安排的</h2>
    <p>中国每年有 13 天法定节假日，分布在七个节日上：元旦 1 天，春节 4 天（除夕和农历正月初一至初三），清明节 1 天，劳动节 2 天，端午节和中秋节各 1 天，国庆节 3 天。</p>
    <p>这些假日与周末不连在一起，就形成了较长的假期。自 2025 年起，春节从农历除夕起放假调休 8 天，国庆节放假调休 7 天，劳动节放假调休 5 天，其余四个节日则与周末连成 3 天小长假；如果节日恰逢周三，就只在当天放假一天。</p>
    <h2>为什么每年的日期都不一样</h2>
    <p>元旦、劳动节和国庆节按公历计算，日期是固定的。春节、端午节和中秋节按农历计算，农历一年约 354 天，比公历年少约 11 天，靠闰月找齐，所以这几个节日在公历上的位置每年会前后浮动一个多月。</p>
    <p>清明是节气，按太阳到达黄经 15 度的那一刻划定，落在 4 月 4 日至 6 日之间。</p>
    <h2>假期在中国出行</h2>
    <p>春节期间会出现全年的出行高峰，热门线路的车票和机票需要提前预订。国庆假期是国内旅游最集中的一周，景区与高速的压力都集中在这几天。</p>
    <p>假期里商店和餐馆大多照常营业，只有春节头几天会有很多商家关门回家过年。政府机关和银行则整个假期都不上班。</p>

