        date: "2027-01-01"
        start: "2027-01-01"
        end: "2027-01-03"
        days: 3
        statutory: 1
        makeup: []
        arrange: "周五至周日，不调休"
        desc: "公历新年的第一天。法定假日只有 1 天，与周末相连就成了 3 天小长假。"
      - id: chunjie
        name: "春节"
        pinyin: "Chūnjié"
        date: "2027-02-06"
        start: "2027-02-05"
        end: "2027-02-12"
        days: 8
        statutory: 4
        makeup: []
        arrange: "除夕至正月初七；调休上班日待官方公布"
        desc: "农历正月初一，除夕也在假期内。年夜饭、红包、守岁都集中在这几天，也是全年最大规模的人口迁徙。"
      - id: qingming
        name: "清明节"
