# 节假日数据 —— /holidays/ 页面族（/holidays/<年份>/）的唯一数据源
#
# 年份范围 2021-2036，共 16 年。2021-2027 七年为国务院办公厅正式通知（已逐条核对，
# 见 meta.sources）；2028-2036 为按同一规则推算的预期值，页面标注「预计」。
#
# 2021-2024 为什么不照抄参考站：那四页是纯表格，且只列法定假日日本身，与国务院
# 通知对不上（例：2024 国庆它写 10/1–10/3，官方是 10/1–10/7；2021 端午它写
# 6/14–6/16，官方是 6/12–6/14）。所以这四个年份一律按官方通知录。
#
# 跨年元旦（2023、2024）只统计落在本年内的天数，跨年那一段写在 arrange 里说明。
#
# 二十四节气用通用寿星公式算（产出即北京时间）。已与数据里原有的 48 个节气
# （2025-2036 每年春分 / 夏至 / 秋分 / 冬至）逐条比对，0 处不一致；2023 年夏至
# 公式差一天，按官方值 2023-06-21 修正。
#
# 结构：meta（说明 / 来源 / 通用文案）+ years[]（每年：法定节假日、其他节日、调休上班日、农历标签）
# 纪律：
#   1. 日期一律写成带引号的 "YYYY-MM-DD"。不加引号时 js-yaml 会解析成 Date 对象，
#      模板直出会变成 "Sat Feb 06 2027 00:00:00 GMT+0000"（E-028）。
#   2. 中文长文案一律写单行，不用 YAML 折叠标量 —— 折行处会被插进空格（E-042）。
#   3. 「预计 / 官方」由数据里的 label 决定，不由文案决定。

