# 城市排行榜定义 —— /cityrank/ 的唯一数据源
#
# 纪律：
#   1. 中文长文案一律写单行（E-042）；
#   2. kind: computed 的榜单禁止手写名次——名次由 helper 从 cities.yml 现算
#      （PRD §5.1 P0 铁律：名次必须是计算结果，不得先定名次再配分数）；
#   3. kind 三值：computed（可量化）/ fact（权威标准或事实清单）/
#      pending（无权威标准，沿用公开榜单，页面必须标注「观点性排名」）；
#   4. pending 榜的名次与文案均来自公开榜单整理，非本站量化结果，上线后逐条审定。

meta:
  updated: "2026-10-28"
  title: "城市排行榜"
  kicker: "CITY RANK"
  intro: "本站整理的城市榜单。有权威标准的按权威标准来，没有权威标准但有可查证数据的由本站按公开指标计算，两者都没有的沿用公开榜单名次并在页面上标为观点性排名。"
  guideLabel: "主题导航"
  guideNote: "榜单持续增补中；标为观点性排名的榜单未经量化核验。"

groups:

  # ============ 综合与经济 ============
  - key: economy
    title: 综合与经济
    kicker: ECONOMY
    desc: 以经济总量、人口规模、发展潜力等可查证的统计指标为主。
    ranks:
      - slug: "jingji-qiangshi"
        title: "中国十大经济强市"
        kind: "computed"
        size: 10
        lede: "以 2025 年地区生产总值排序，反映城市经济总量。"
        metrics:
          - { field: "gdp", weight: 1.0, dir: "up", label: "地区生产总值", unit: "亿元" }
        note: "候选范围为数据集中 2025 年 GDP 已核验的城市。人均 GDP 与财政收入待数据补齐后纳入加权。"
      - slug: "renkou-dashi"
        title: "中国人口大市"
